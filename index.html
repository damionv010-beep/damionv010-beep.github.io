<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mike’s Cascade Towing Yard">
<meta name="theme-color" content="#0b0d10">
<title>Mike’s Cascade Towing Yard</title>
<style>
:root{color-scheme:dark;--bg:#0b0d10;--card:#15191f;--line:#29313a;--text:#f5f7fa;--muted:#98a3ae;--green:#76ff03}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}.wrap{max-width:760px;margin:auto;min-height:100vh;padding:max(18px,env(safe-area-inset-top)) 16px max(32px,env(safe-area-inset-bottom))}
.brand{font-size:32px;font-weight:900;letter-spacing:-.7px}.brand b{color:var(--green)}.site-name{font-size:14px;font-weight:800;letter-spacing:.2px;margin-top:3px}.site-name span{color:var(--green)}.muted{color:var(--muted)}.small{font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
.input{width:100%;background:#101419;border:1px solid var(--line);border-radius:12px;padding:13px;color:#fff;margin:5px 0 10px;font-size:16px}
.btn{border:0;border-radius:13px;padding:14px 15px;font-weight:800;background:var(--green);color:#071003;width:100%;margin-top:8px}
.btn.secondary{background:transparent;border:1px solid #3a4652;color:#dce3e9}.btn.danger{background:#351416;border:1px solid #7d2d35;color:#ffb8bf}.row{display:flex;gap:10px}.row>*{flex:1}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.link{color:#8dff3f;background:none;border:0;font-weight:750;padding:8px 0}
.vehicle{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;color:#fff;margin:10px 0}
.vehicle h3{margin:0 0 5px}.pill{display:inline-block;padding:6px 9px;border-radius:999px;background:#20320f;color:#baff83;font-size:12px;font-weight:800;text-transform:capitalize}
.error{padding:12px;border-radius:12px;background:#271417;border:1px solid #5a272e;color:#ffb7bf;margin:10px 0}
.notice{padding:12px;border-radius:12px;background:#151c12;border:1px solid #30431e;color:#cfffaa;margin:10px 0}
.h1{font-size:28px;font-weight:850;margin:14px 0 2px}.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kv div{background:#101419;border-radius:12px;padding:12px}.kv span{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}
.qr{background:#fff;border-radius:16px;padding:14px;width:min(100%,320px);display:block;margin:14px auto}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:12px}.photos figure{margin:0;background:#101419;border-radius:14px;overflow:hidden}.photos img{width:100%;display:block;aspect-ratio:4/3;object-fit:cover}.photos figcaption{padding:9px 10px;color:#aab3bd;font-size:12px}

.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 12px}.choice{border:1px solid #3a4652;background:#101419;color:#dce3e9;border-radius:12px;padding:12px 8px;font-weight:800}.choice.active{border-color:var(--green);background:#20320f;color:#cfffaa}.toggle-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.toggle{display:flex;align-items:center;gap:10px;background:#101419;border:1px solid var(--line);border-radius:12px;padding:12px;margin:6px 0}.toggle input{width:22px;height:22px;accent-color:var(--green)}details.card summary{cursor:pointer;font-weight:800;color:#dce3e9;padding:2px 0}.filters .choice{font-size:12px;padding:10px 4px}.photo-choices .choice{font-size:12px}
@media(max-width:560px){.row{flex-direction:column}.kv,.photos{grid-template-columns:1fr}.choice-grid.filters{grid-template-columns:repeat(4,1fr)!important}.toggle-grid{grid-template-columns:1fr 1fr}}

.invoice-checks{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin:8px 0 12px}
.invoice-checks label{display:flex;align-items:center;gap:8px;background:#101419;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px}
.invoice-checks input{width:20px;height:20px;accent-color:var(--green)}
.invoice-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.invoice-actions{grid-template-columns:1fr}.invoice-checks{grid-template-columns:1fr 1fr}}


/* TowTag brand lockup — intentionally split into two distinct visual voices. */
.brand-lockup{display:inline-flex;flex-direction:column;align-items:flex-start;line-height:1;margin-bottom:3px}
.brand-mikes{font-family:Georgia,"Times New Roman",serif;font-size:29px;font-weight:700;font-style:italic;color:#f5f7fa;letter-spacing:-.5px;text-shadow:0 1px 0 #000}
.brand-yard{font-family:"Arial Narrow","Helvetica Neue Condensed","Roboto Condensed",Arial,sans-serif;font-size:17px;font-weight:900;color:var(--green);letter-spacing:3.1px;text-transform:uppercase;margin-top:5px}
.brand-powered{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:10px;font-weight:650;color:var(--muted);letter-spacing:.45px;margin-top:6px}
.search-all-note{padding:8px 10px;border:1px solid #30431e;background:#151c12;color:#cfffaa;border-radius:11px;font-size:12px;margin:-2px 0 10px}
.storage-clock{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#101419;border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.storage-clock strong{font-size:18px;color:#fff}.storage-clock span{font-size:11px;color:var(--muted);display:block;margin-top:2px}
.billing-ok{color:#baff83;font-weight:750}


/* TowTag safety / admin / signature upgrades */
.attention{border-color:#6c5721;background:#1d1a10}.attention strong{color:#ffd76a}
.age-pill{display:inline-block;padding:4px 7px;border-radius:999px;background:#1d242b;color:#cfd8e3;font-size:11px;font-weight:800;margin-left:5px}
.age-pill.old{background:#3b2710;color:#ffd28a}
.trash-pill{background:#36171b;color:#ffb8bf}
.signature-pad{width:100%;height:150px;background:#fff;border:2px solid #46515d;border-radius:12px;touch-action:none;display:block;margin:8px 0}
.signature-preview{width:100%;max-width:500px;height:auto;background:#fff;border:1px solid #46515d;border-radius:10px;margin-top:8px}
.staff-row{border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0;background:#101419}
.staff-row .email{font-size:12px;color:var(--muted);word-break:break-all}
.photo-actions{position:absolute;right:7px;top:7px;display:flex;gap:6px;z-index:2}
.photo-actions button{border:0;border-radius:999px;padding:8px 10px;font-size:11px;font-weight:850}
.photo-move{background:rgba(15,43,64,.92);color:#bfe4ff}
.photo-delete{background:rgba(55,7,10,.9);color:#ffb8bf}
@media(max-width:560px){.choice-grid.filters{grid-template-columns:repeat(3,1fr)!important}}

</style>
</head>

let session=null,user=null,staffMember=null,vehicles=[],photoRows=[],selected=null,movePhotoId=null;
const app=document.getElementById('app');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function saveSession(s){
  session=s;
  if(s){
    session.expires_at=Math.floor(Date.now()/1000)+(s.expires_in||3600);
    localStorage.setItem('towtag_session',JSON.stringify(session));
    user=s.user;
  }else{
    localStorage.removeItem('towtag_session'); user=null;
  }
}
async function ensureSession(){
  if(!session)return false;
  if((session.expires_at||0)>Math.floor(Date.now()/1000)+90)return true;
  if(!session.refresh_token){logout();return false}
  const r=await fetch(BASE+'/auth/v1/token?grant_type=refresh_token',{
    method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},
    body:JSON.stringify({refresh_token:session.refresh_token})
  });
  if(!r.ok){logout();return false}
  saveSession(await r.json()); return true;
}
async function api(path,opt={}){
  if(!await ensureSession())throw new Error('Sign in required');
  const r=await fetch(BASE+path,{...opt,headers:{apikey:KEY,Authorization:'Bearer '+session.access_token,...(opt.headers||{})}});
  const t=await r.text(); let d=null; try{d=t?JSON.parse(t):null}catch{d=t}
  if(!r.ok)throw new Error((d&&d.message)||(d&&d.error)||('Request failed '+r.status));
  return d;
}
function authBrand(){
  return '<div class="brand-lockup"><div class="brand-mikes">Mike’s Cascade</div><div class="brand-yard">Towing Yard</div><div class="brand-powered">Powered by TowTag</div></div><p class="muted">Vehicle records, billing, invoices + QR tags</p>';
}
function togglePassword(id='pw',buttonId='showPw'){
  const el=document.getElementById(id),btn=document.getElementById(buttonId);
  if(!el)return;
  const showing=el.type==='text';
  el.type=showing?'password':'text';
  if(btn)btn.textContent=showing?'Show':'Hide';
}
function passwordField(id='pw',autocomplete='current-password'){
  return '<div style="position:relative"><input id="'+id+'" class="input" style="padding-right:78px" type="password" autocomplete="'+autocomplete+'"><button id="showPw" type="button" onclick="togglePassword(\''+id+'\',\'showPw\')" style="position:absolute;right:8px;top:10px;border:0;background:transparent;color:#8dff3f;font-weight:800;padding:10px">Show</button></div>';
}
function loginScreen(msg=''){
  const saved=localStorage.getItem('towtag_email')||'';
  app.innerHTML='<div style="padding-top:8vh">'+authBrand()+msg+
  '<div class="card"><div class="h1" style="font-size:22px;margin-top:0">Staff Sign In</div><p class="muted" style="margin-top:4px">TowTag keeps you signed in on this device.</p>'+
  '<label class="small muted">EMAIL</label><input id="email" name="email" class="input" type="email" autocomplete="username" autocapitalize="none" spellcheck="false" value="'+esc(saved)+'">'+
  '<label class="small muted">PASSWORD</label>'+passwordField('pw','current-password')+
  '<label class="toggle" style="margin:0 0 6px"><input id="rememberEmail" type="checkbox" '+(saved?'checked':'')+'> Remember my email</label>'+
  '<button class="btn" onclick="login()">Sign In</button><button class="btn secondary" onclick="createAccountScreen()">Create Staff Account</button>'+
  '<p class="small muted" style="margin-bottom:0">New accounts need the Mike’s Cascade staff access code once.</p></div></div>';
  setTimeout(()=>{
    const e=document.getElementById('email'),p=document.getElementById('pw');
    if(saved&&p)p.focus(); else if(e)e.focus();
    if(p)p.addEventListener('keydown',ev=>{if(ev.key==='Enter')login()});
  },0);
}
async function login(){
  const e=(document.getElementById('email')?.value||'').trim().toLowerCase();
  const p=document.getElementById('pw')?.value||'';
  try{
    if(!e||!p)throw new Error('Enter your email and password.');
    const r=await fetch(BASE+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:e,password:p})});
    const d=await r.json();
    if(!r.ok){
      const raw=d.error_description||d.msg||d.message||'Sign in failed';
      if(/invalid login credentials/i.test(raw))throw new Error('Email or password is incorrect.');
      throw new Error(raw);
    }
    if(document.getElementById('rememberEmail')?.checked)localStorage.setItem('towtag_email',e);else localStorage.removeItem('towtag_email');
    saveSession(d); await boot();
  }catch(e){loginScreen('<div class="error">'+esc(e.message)+'</div>')}
}
function createAccountScreen(msg=''){
  const saved=localStorage.getItem('towtag_email')||'';
  app.innerHTML='<div style="padding-top:5vh">'+authBrand()+msg+
  '<div class="card"><button class="link" onclick="loginScreen()">‹ Back to Sign In</button><div class="h1" style="font-size:22px">Create Staff Account</div>'+
  '<p class="muted">Do this once per person. After that, just sign in normally.</p>'+
  '<label class="small muted">STAFF MEMBER</label><select id="newStaffName" class="input"><option value="Damion">Damion</option><option value="Mike">Mike</option></select>'+
  '<label class="small muted">EMAIL</label><input id="newEmail" class="input" type="email" autocomplete="username" autocapitalize="none" spellcheck="false" value="'+esc(saved)+'">'+
  '<label class="small muted">PASSWORD</label>'+passwordField('newPw','new-password')+
  '<div class="small muted" style="margin:-4px 0 10px">Use at least 6 characters. iPhone can save it to Passwords.</div>'+
  '<label class="small muted">STAFF ACCESS CODE</label><input id="staffCode" class="input" type="text" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" placeholder="Mike’s Cascade staff code">'+
  '<button class="btn" onclick="createStaffAccount()">Create Account & Enter TowTag</button><button class="btn secondary" onclick="loginScreen()">Cancel</button></div></div>';
}
async function callStaffJoin(displayName,staffCode){
  if(!session?.access_token)throw new Error('Sign in required.');
  const r=await fetch(BASE+'/functions/v1/towtag-staff-join',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify({displayName,staffCode})});
  const d=await r.json();
  if(!r.ok)throw new Error(d.error||'Could not activate TowTag access.');
  return d;
}
async function createStaffAccount(){
  const displayName=document.getElementById('newStaffName')?.value||'';
  const e=(document.getElementById('newEmail')?.value||'').trim().toLowerCase();
  const p=document.getElementById('newPw')?.value||'';
  const code=(document.getElementById('staffCode')?.value||'').trim().toUpperCase();
  try{
    if(!e)throw new Error('Enter an email address.');
    if(p.length<6)throw new Error('Password must be at least 6 characters.');
    if(!code)throw new Error('Enter the staff access code.');
    const r=await fetch(BASE+'/auth/v1/signup',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:e,password:p,data:{display_name:displayName}})});
    const d=await r.json();
    if(!r.ok){
      const raw=d.msg||d.message||'Account creation failed';
      if(/already registered|already exists|user already/i.test(raw)){
        localStorage.setItem('towtag_email',e);
        loginScreen('<div class="notice">That email already has an account. Sign in below; TowTag will let you activate staff access if needed.</div>');
        return;
      }
      throw new Error(raw);
    }
    localStorage.setItem('towtag_email',e);
    if(d.access_token){
      saveSession(d);
      await callStaffJoin(displayName,code);
      await boot();
    }else{
      loginScreen('<div class="notice">Account created. Check your email to confirm it, then sign in. TowTag will ask for the staff access code once.</div>');
    }
  }catch(e){createAccountScreen('<div class="error">'+esc(e.message)+'</div>')}
}

function storageDayCount(v,endOverride=null){
  if(!v||!v.tow_date||v.record_type==='company_owned')return 0;
  const start=new Date(v.tow_date);
  const rawEnd=endOverride||v.release_at||v.archived_at||new Date();
  const end=rawEnd instanceof Date?rawEnd:new Date(rawEnd);
  if(Number.isNaN(start.getTime())||Number.isNaN(end.getTime()))return 0;
  const dayStart=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();
  const diff=Math.floor((dayStart(end)-dayStart(start))/86400000);
  return Math.max(1,diff+1);
}
function storageDayText(v){
  const d=storageDayCount(v);
  return d+' calendar day'+(d===1?'':'s');
}

function recordAgeDays(v){
  if(!v?.tow_date)return 0;
  const start=new Date(v.tow_date),end=new Date();
  if(Number.isNaN(start.getTime()))return 0;
  return Math.max(0,Math.floor((end-start)/86400000));
}

function findVehicleDuplicate(vin,plate,state,excludeId=null){
  vin=String(vin||'').trim().toUpperCase(); plate=String(plate||'').trim().toUpperCase(); state=String(state||'').trim().toUpperCase();
  return vehicles.find(v=>{
    if(v.id===excludeId||v.deleted_at)return false;
    const vinMatch=vin&&String(v.vin||'').toUpperCase()===vin;
    const plateMatch=plate&&String(v.plate||'').toUpperCase()===plate&&(!state||String(v.plate_state||'').toUpperCase()===state);
    return vinMatch||plateMatch;
  })||null;
}
function handleDuplicateBeforeSave(vin,plate,state,excludeId=null){
  const dup=findVehicleDuplicate(vin,plate,state,excludeId);
  if(!dup)return false;
  const why=(vin&&String(dup.vin||'').toUpperCase()===String(vin).toUpperCase())?'VIN':'plate';
  const open=confirm('Possible duplicate '+why+' found:\\n\\n'+title(dup)+' · '+(dup.plate||'No plate')+'\\n\\nTap OK to open the existing vehicle.\\nTap Cancel to save this vehicle anyway.');
  if(open){detail(dup.id);return true}
  return false;
}

  ]).toLowerCase();

function billingReleaseWarnings(v){
  const warnings=[];
  if(!v||v.record_type==='company_owned')return warnings;
  if(!v.equipment_type)warnings.push('Equipment type has not been selected.');
  if(v.recovery_performed&&!(Number(v.recovery_minutes)>0))warnings.push('Recovery is marked, but recovery time is blank.');
  if(v.extra_labor&&!(Number(v.extra_labor_minutes)>0))warnings.push('Extra labor is marked, but labor time is blank.');
  if(v.hazmat_cleanup&&!v.cleanup_performed)warnings.push('Hazmat is marked; verify cleanup is also included on billing.');
  if(!v.invoice_number&&!v.invoice_data)warnings.push('No invoice has been saved to this vehicle yet.');
  const days=storageDayCount(v);
  const inv=v.invoice_data||{};
  if(days>1&&!inv.storage_charge)warnings.push(days+' calendar storage days are showing, but no storage charge is saved on the invoice.');
  return warnings;
}
function confirmBillingBeforeRelease(v){
  const warnings=billingReleaseWarnings(v);
  const lines=[
    'BILLING CHECK',
    '',
    'Storage: '+storageDayText(v),
    'Equipment: '+equipmentLabel(v.equipment_type),
    'Invoice: '+(v.invoice_number?'#'+v.invoice_number:(v.invoice_data?'Saved':'Not saved'))
  ];
  if(warnings.length){
    lines.push('','Possible missing billing:');
    warnings.forEach(x=>lines.push('• '+x));
    lines.push('','Release vehicle anyway?');
  }else{
    lines.push('','Billing check looks good. Release vehicle?');
  }
  return confirm(lines.join('\n'));
}

function render(q){
  q=(q||'').trim().toLowerCase();
  const globalSearch=!!q;
  let rows=vehicles.filter(v=>!q||vehicleSearchText(v).includes(q));
  if(!globalSearch){
    if(homeFilter==='trash')rows=rows.filter(v=>!!v.deleted_at);
    else if(homeFilter==='archive')rows=rows.filter(v=>!v.deleted_at&&!!v.archived_at);
    else {
      rows=rows.filter(v=>!v.deleted_at&&!v.archived_at);
      if(homeFilter==='tow')rows=rows.filter(v=>(v.record_type||'tow')!=='company_owned');
      if(homeFilter==='sale')rows=rows.filter(v=>v.record_type==='company_owned'&&v.owned_disposition==='for_sale');
      if(homeFilter==='scrap')rows=rows.filter(v=>v.record_type==='company_owned'&&v.owned_disposition==='scrap');
    }
  }
  const note=globalSearch?'<div class="search-all-note">Searching active + archived + trash records</div>':'';
  el('list').innerHTML=note+(rows.map(v=>{
    const owned=v.record_type==='company_owned';
    const badge=v.deleted_at?'Trash':(v.archived_at?'Archived':(owned?ownedLabel(v.owned_disposition):v.status));
    const extra=owned&&v.owned_disposition==='for_sale'&&v.asking_price!=null?' · '+money(v.asking_price):'';
    const archived=v.archived_at&&!v.deleted_at?' · Archived '+new Date(v.archived_at).toLocaleDateString():'';
    const trashed=v.deleted_at?' · Trashed '+new Date(v.deleted_at).toLocaleDateString():'';
    const storage=!owned&&!v.deleted_at?' · '+storageDayText(v):'';
    const age=recordAgeDays(v),ageBadge=(!owned&&!v.archived_at&&!v.deleted_at&&age>=7)?'<span class="age-pill '+(age>=30?'old':'')+'">'+age+'d in yard</span>':'';
    const warnings=incompleteWarnings(v),p=standardPhotoProgress(v);
    const check=(!v.deleted_at&&!v.archived_at)?'<div class="small muted" style="margin-top:7px">Photos '+p.done+'/'+p.total+(warnings.length?' · <span style="color:#ffd76a">⚠ '+warnings.length+' incomplete</span>':'')+'</div>':'';
    return '<button class="vehicle" onclick="detail(\''+v.id+'\')"><h3>'+esc(title(v))+' '+ageBadge+'</h3><div class="muted">'+esc(v.color||'No color')+' · '+esc(v.plate||'No plate')+extra+'</div><div class="small muted" style="margin-top:7px">'+esc(recordLabel(v.record_type||'tow'))+' · <span class="pill '+(v.deleted_at?'trash-pill':'')+'">'+esc(badge)+'</span>'+esc(storage)+esc(archived)+esc(trashed)+'</div>'+check+'</button>';
  }).join('')||'<div class="card muted">No matching vehicles.</div>');
}

const OFFLINE_QUEUE_KEY='towtag_offline_intakes';
function offlineIntakes(){try{return JSON.parse(localStorage.getItem(OFFLINE_QUEUE_KEY)||'[]')||[]}catch{return []}}
function setOfflineIntakes(rows){localStorage.setItem(OFFLINE_QUEUE_KEY,JSON.stringify(rows||[]))}
function looksOfflineError(e){return !navigator.onLine||/failed to fetch|load failed|network|offline|internet/i.test(String(e?.message||e||''))}
function queueOfflineIntake(body,agencyName){const q=offlineIntakes();q.push({id:'local-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),saved_at:new Date().toISOString(),agency_name:agencyName||'',body});setOfflineIntakes(q)}
async function syncOfflineIntakes(silent=false){
  const q=offlineIntakes();if(!q.length){if(!silent)alert('No saved offline intakes to sync.');return}
  if(!navigator.onLine){if(!silent)alert('TowTag is still offline. Try again when you have service.');return}
  const remaining=[];let synced=0;
  for(let i=0;i<q.length;i++){
    const item=q[i];
    try{
      const body={...(item.body||{})};
      if((body.record_type||'tow')==='tow'&&!body.agency_id&&item.agency_name)body.agency_id=await resolveAgency(item.agency_name);
      await api('/rest/v1/vehicles',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify(body)});synced++;
    }catch(e){remaining.push(item,...q.slice(i+1));break}
  }
  setOfflineIntakes(remaining);
  try{await load();home()}catch{}
  if(!silent)alert(synced+' saved intake'+(synced===1?'':'s')+' synced.'+(remaining.length?' '+remaining.length+' still waiting.':''));
}
window.addEventListener('online',()=>{if(offlineIntakes().length)syncOfflineIntakes(true).catch(()=>{})});

function saveIntakeDraft(){

    if(!x.id)return;fields[x.id]={value:x.value,checked:!!x.checked,type:x.type};
  });
  if(Object.keys(fields).length)localStorage.setItem('towtag_intake_draft',JSON.stringify({savedAt:Date.now(),fields}));
}
function bindIntakeDraft(){
  const raw=localStorage.getItem('towtag_intake_draft');
  if(raw){
    try{
      const d=JSON.parse(raw),age=Date.now()-(d.savedAt||0);
      if(age<86400000){Object.entries(d.fields||{}).forEach(([id,x])=>{const e=el(id);if(!e)return;if(e.type==='checkbox')e.checked=!!x.checked;else e.value=x.value??'';});}
      else localStorage.removeItem('towtag_intake_draft');
    }catch{}
  }

async function saveVehicle(mode='open'){
  try{
    const record_type=val('recordType')||'tow';
    const vinValue=val('vin').toUpperCase();
    if(vinValue&&vinValue.length!==17&&!confirm('VIN is '+vinValue.length+' characters, not 17. Save it as entered?'))return;
    if(handleDuplicateBeforeSave(vinValue,val('plate'),val('state')))return;
    let agency_id=null, impound_type=null, owned_disposition=null,offlineSave=!navigator.onLine;
    const agencyName=val('agency');
    if(record_type==='tow'){
      impound_type=val('impoundType');
      if(!impound_type){alert('Choose a reason.');return}
      if(!offlineSave){try{agency_id=await resolveAgency(agencyName)}catch(e){if(looksOfflineError(e))offlineSave=true;else throw e}}
    }else{
      owned_disposition=val('ownedDisposition');
      if(!owned_disposition){alert('Choose For Sale or Going to Scrap.');return}
    }
    const odo=val('odometer');
    const recoveryMinutes=val('recoveryMinutes'), extraLaborMinutes=val('extraLaborMinutes'), waitMinutes=val('sceneWaitMinutes'), miles=val('billableMiles'), ask=val('askingPrice');
    const hold_type=record_type==='tow'?(val('holdType')||'none'):'none';
    const body={
      record_type,year:val('year')?Number(val('year')):null,make:val('make')||null,model:val('model')||null,color:val('color')||null,plate:val('plate').toUpperCase()||null,plate_state:val('state').toUpperCase()||null,vin:vinValue||null,odometer:odo?Number(odo):null,keys_status:val('keysStatus')||'unknown',
      agency_id,impound_type,yard_location:record_type==='tow'?(val('pickup')||null):null,tow_number:record_type==='tow'?(val('towNumber').toUpperCase()||null):null,driver_name:record_type==='tow'?(val('driverName')||null):null,hold_type,hold_notes:record_type==='tow'?(val('holdNotes')||null):null,
      status:record_type==='tow'?(hold_type!=='none'?'hold':'impounded'):'other',condition_notes:val('conditionNotes')||null,property_notes:val('propertyNotes')||null,notes:val('notes')||null,created_by:user.id,
      owned_disposition,asking_price:record_type==='company_owned'&&ask?Number(ask):null,owned_notes:record_type==='company_owned'?(val('ownedNotes')||null):null,
      equipment_type:record_type==='tow'?(val('equipmentType')||null):null,used_dollies:record_type==='tow'&&checked('usedDollies'),recovery_performed:record_type==='tow'&&(checked('recoveryPerformed')||!!recoveryMinutes),recovery_minutes:record_type==='tow'&&recoveryMinutes?Number(recoveryMinutes):null,winching_performed:record_type==='tow'&&checked('winchingPerformed'),cleanup_performed:record_type==='tow'&&(checked('cleanupPerformed')||checked('hazmatCleanup')),hazmat_cleanup:record_type==='tow'&&checked('hazmatCleanup'),extra_labor:record_type==='tow'&&(checked('extraLabor')||!!extraLaborMinutes),extra_labor_minutes:record_type==='tow'&&extraLaborMinutes?Number(extraLaborMinutes):null,after_hours:record_type==='tow'&&checked('afterHours'),scene_wait_minutes:record_type==='tow'&&waitMinutes?Number(waitMinutes):null,billable_miles:record_type==='tow'&&miles?Number(miles):null,other_billable_work:record_type==='tow'?(val('otherBillableWork')||null):null,billing_notes:record_type==='tow'?(val('billingNotes')||null):null
    };
    if(record_type==='tow'){
      localStorage.setItem('towtag_state',val('state').toUpperCase()||'OR');
      if(val('driverName'))localStorage.setItem('towtag_driver',val('driverName'));
      if(val('agency'))localStorage.setItem('towtag_agency',val('agency'));
      if(val('equipmentType'))localStorage.setItem('towtag_equipment',val('equipmentType'));
    }
    if(offlineSave){queueOfflineIntake(body,agencyName);clearIntakeDraft();addForm('Connection is weak. This intake is saved on this phone and will sync when service returns.');return}
    let rows;
    try{rows=await api('/rest/v1/vehicles',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify(body)})}
    catch(e){if(looksOfflineError(e)){queueOfflineIntake(body,agencyName);clearIntakeDraft();addForm('Connection dropped. This intake is saved on this phone and will sync later.');return}else throw e}
    clearIntakeDraft();
    await load();
    if(mode==='next')addForm('Saved. Ready for the next vehicle.'); else detail(rows[0].id);
  }catch(e){alert('Save failed: '+e.message)}
}

let releaseSignatureInk=false;
function initReleaseSignature(){
  const c=el('releaseSignatureCanvas'); if(!c)return;
  const ctx=c.getContext('2d'); ctx.lineWidth=3; ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#111';
  let drawing=false;
  const point=e=>{const r=c.getBoundingClientRect();return {x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}};
  c.onpointerdown=e=>{drawing=true;releaseSignatureInk=true;c.setPointerCapture?.(e.pointerId);const p=point(e);ctx.beginPath();ctx.moveTo(p.x,p.y);e.preventDefault()};
  c.onpointermove=e=>{if(!drawing)return;const p=point(e);ctx.lineTo(p.x,p.y);ctx.stroke();e.preventDefault()};
  c.onpointerup=c.onpointercancel=e=>{drawing=false;e.preventDefault()};
}
function clearReleaseSignature(){const c=el('releaseSignatureCanvas');if(!c)return;c.getContext('2d').clearRect(0,0,c.width,c.height);releaseSignatureInk=false}
function releaseSignatureData(){const c=el('releaseSignatureCanvas');return c&&releaseSignatureInk?c.toDataURL('image/png'):null}

  if(!selected)return;
  const name=val('releasedTo'); if(!name){alert('Enter who the vehicle is being released to.');return}
  if(!confirmBillingBeforeRelease(selected))return;
  const signature=releaseSignatureData();
  if(!signature&&!confirm('No release signature was captured. Release the vehicle anyway?'))return;
  const id=selected.id;
  try{
    const now=new Date().toISOString();
    const body={status:'released',release_at:now,released_to:name,release_id_checked:checked('releaseIdChecked'),release_authorized_by:val('releaseAuthorized')||null,release_notes:val('releaseNotes')||null,release_signature_data:signature,archived_at:now,archived_by:user.id};
    await api('/rest/v1/vehicles?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify(body)});
    await load(); detail(id); alert('Vehicle released and moved to Archive.');
  }catch(e){alert('Release failed: '+e.message)}
}



function invoiceDateValue(value){
  if(!value)return '';
  const d=new Date(value); if(Number.isNaN(d.getTime()))return '';
  const pad=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function invoiceTimeValue(value){
  if(!value)return '';

  const pad=n=>String(n).padStart(2,'0'); return pad(d.getHours())+':'+pad(d.getMinutes());
}

    ];
    const extra=owned?[
      ['Owned Vehicle Notes',v.owned_notes||'—'],['Condition / Damage',v.condition_notes||'—'],['Staff Notes',v.notes||'—']
    ]:[
      ['Hold Notes',v.hold_notes||'—'],['Condition / Damage',v.condition_notes||'—'],['Personal Property',v.property_notes||'—'],['Staff Notes',v.notes||'—']
    ];
    const billing=owned?[]:billingSummaryLines(v);
    const release=(!owned&&v.release_at)?[
      ['Released',new Date(v.release_at).toLocaleString()],['Released To',v.released_to||'—'],['ID Checked',v.release_id_checked?'Yes':'No'],
      ['Authorized By',v.release_authorized_by||'—'],['Release Notes',v.release_notes||'—']
    ]:[];
    const photoHtml=photos.length?'<h2>Photos</h2><div class="photos">'+photos.map(p=>'<div><img src="'+printEscape(p.url)+'"><div class="cap">'+printEscape(p.caption||'Vehicle photo')+'</div></div>').join('')+'</div>':'';
    const html='<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+printEscape(vehicleName)+' — TowTag</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111;margin:0;background:#f3f3f3}.toolbar{position:sticky;top:0;z-index:20;background:#111;padding:10px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.toolbar button{border:0;border-radius:999px;padding:11px 18px;font-weight:700}.toolbar .back{background:#333;color:#fff}.sheet{background:#fff;max-width:900px;margin:0 auto;padding:24px}h1{margin:0}h2{font-size:16px;margin:24px 0 8px;border-bottom:2px solid #111;padding-bottom:5px}.sub{color:#555;margin-top:4px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px}.item{padding:6px 0;border-bottom:1px solid #ddd}.label{font-size:10px;color:#666;text-transform:uppercase;display:block}.billing div{padding:5px 0}.photos{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}.photos img{width:100%;max-height:240px;object-fit:contain;border:1px solid #ccc}.cap{font-size:11px;color:#555}.foot{margin-top:28px;font-size:10px;color:#666}@media print{.toolbar{display:none}body{background:#fff}.sheet{max-width:none;padding:12mm}}</style></head><body><div class="toolbar"><button class="back" onclick="if(window.opener&&!window.opener.closed){window.opener.focus();window.close()}else{history.back()}">‹ Back to TowTag</button><button onclick="window.print()">Print / Save PDF</button></div><div class="sheet">'+
      '<h1>Mike’s Cascade Towing Yard</h1><div class="sub">TowTag Vehicle Sheet · '+printEscape(vehicleName)+'</div>'+
      '<h2>Vehicle / Record</h2><div class="grid">'+fields.map(x=>'<div class="item"><span class="label">'+printEscape(x[0])+'</span>'+printEscape(x[1])+'</div>').join('')+'</div>'+
      (extra.length?'<h2>Notes</h2><div class="grid">'+extra.map(x=>'<div class="item"><span class="label">'+printEscape(x[0])+'</span>'+printEscape(x[1])+'</div>').join('')+'</div>':'')+
      (billing.length||v.billing_notes?'<h2>Billing Summary</h2><div class="billing">'+billing.map(x=>'<div>• '+printEscape(x)+'</div>').join('')+(v.billing_notes?'<div><strong>Billing notes:</strong> '+printEscape(v.billing_notes)+'</div>':'')+'</div>':'')+
      (release.length?'<h2>Release Record</h2><div class="grid">'+release.map(x=>'<div class="item"><span class="label">'+printEscape(x[0])+'</span>'+printEscape(x[1])+'</div>').join('')+'</div>'+(v.release_signature_data?'<div style="margin-top:12px"><span class="label">Release Signature</span><img src="'+printEscape(v.release_signature_data)+'" style="width:320px;max-width:100%;border:1px solid #bbb;background:#fff"></div>':''):'')+
      photoHtml+'<div class="foot">TowTag · '+printEscape(v.qr_token)+'</div></div></body></html>';
    w.document.open();w.document.write(html);w.document.close();
  }catch(e){
    w.document.body.innerHTML='<p>Could not prepare tow sheet: '+printEscape(e.message)+'</p>';
  }
}

async function loadActivity(id){
  const target=el('activity'); if(!target)return;
  try{
    const rows=await api('/rest/v1/vehicle_activity?select=event_type,description,created_at&vehicle_id=eq.'+encodeURIComponent(id)+'&order=created_at.desc&limit=50');
    target.innerHTML=(rows||[]).map(r=>'<div style="padding:10px 0;border-bottom:1px solid var(--line)"><div>'+esc(r.description)+'</div><div class="small muted" style="margin-top:3px">'+esc(new Date(r.created_at).toLocaleString())+'</div></div>').join('')||'<div class="muted">No activity recorded yet.</div>';
  }catch(e){target.innerHTML='<div class="error">History failed to load: '+esc(e.message)+'</div>'}
}
async function loadStaffPhotos(token){
  const target=el('staffPhotos'); if(!target)return;
  try{
    const r=await fetch(BASE+'/functions/v1/towtag-public-vehicle?token='+encodeURIComponent(token),{headers:{apikey:KEY,Authorization:'Bearer '+session.access_token}});const d=await r.json();if(!r.ok)throw new Error(d.error||'Photo lookup failed');
    target.innerHTML=(d.photos||[]).map(p=>'<figure style="position:relative"><img src="'+esc(p.url)+'"><figcaption>'+esc(p.caption||'Vehicle photo')+'</figcaption>'+(p.id?'<div class="photo-actions"><button class="photo-move" type="button" onclick="photoMovePicker(\''+esc(p.id)+'\')">Move</button><button class="photo-delete" type="button" onclick="deleteVehiclePhoto(\''+esc(p.id)+'\')">Delete</button></div>':'')+'</figure>').join('')||'<div class="muted">No photos yet.</div>';
  }catch(e){console.warn('Photo gallery failed',e)}
}
function photoMovePicker(photoId){
  if(!selected)return; movePhotoId=photoId;
  app.innerHTML='<button class="link" onclick="detail(\''+selected.id+'\')">‹ Cancel</button><div class="h1">Move Photo</div><div class="card"><div class="small muted">MOVE THIS PHOTO TO</div><input id="movePhotoSearch" class="input" type="search" placeholder="Search vehicle, plate or VIN" oninput="renderPhotoMoveTargets(this.value)"><div id="movePhotoTargets"></div></div>';
  renderPhotoMoveTargets('');
}
function renderPhotoMoveTargets(q=''){
  const target=el('movePhotoTargets');if(!target||!selected)return;
  q=String(q||'').trim().toLowerCase();
  const rows=vehicles.filter(v=>v.id!==selected.id&&!v.deleted_at&&(!q||vehicleSearchText(v).includes(q))).slice(0,50);
  target.innerHTML=rows.map(v=>'<button class="vehicle" onclick="moveVehiclePhoto(\''+movePhotoId+'\',\''+v.id+'\')"><h3>'+esc(title(v))+'</h3><div class="muted">'+esc(v.plate||'No plate')+' · '+esc(v.vin||'No VIN')+'</div></button>').join('')||'<div class="muted">No matching vehicle.</div>';
}
async function moveVehiclePhoto(photoId,targetVehicleId){
  if(!selected)return;
  const sourceId=selected.id,target=vehicles.find(v=>v.id===targetVehicleId);if(!target)return;
  if(!confirm('Move this photo from '+title(selected)+' to '+title(target)+'?'))return;
  try{
    if(!await ensureSession())throw new Error('Sign in required');
    const r=await fetch(BASE+'/functions/v1/towtag-move-photo',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify({photoId,targetVehicleId})});
    const d=await r.json();if(!r.ok)throw new Error(d.error||'Photo move failed');
    await load(); selected=vehicles.find(v=>v.id===sourceId); detail(sourceId); alert('Photo moved to '+title(target)+'.');
  }catch(e){alert('Could not move photo: '+e.message)}
}

async function deleteVehiclePhoto(photoId){
  if(!selected||!photoId)return;
  if(!confirm('Delete this photo from '+title(selected)+'?\n\nOnly this photo will be removed. The vehicle record will stay intact.'))return;
  try{
    if(!await ensureSession())throw new Error('Sign in required');
    const r=await fetch(BASE+'/functions/v1/towtag-delete-photo',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify({photoId,vehicleId:selected.id})});
    const d=await r.json(); if(!r.ok)throw new Error(d.error||'Photo delete failed');
    const id=selected.id; await load(); selected=vehicles.find(v=>v.id===id); await loadStaffPhotos(selected.qr_token);
    alert('Photo deleted.');
  }catch(e){alert('Could not delete photo: '+e.message)}
}
async function updateVehicleStatus(){
  if(!selected)return;
  try{
    const id=selected.id,newStatus=val('vehicleStatus');
    if(newStatus==='released'&&!confirmBillingBeforeRelease(selected))return;
    const body={status:newStatus};
    if(newStatus==='released'&&!selected.archived_at){body.archived_at=new Date().toISOString();body.archived_by=user.id;}
    await api('/rest/v1/vehicles?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify(body)});
    await load(); detail(id); alert(newStatus==='released'?'Vehicle status updated and moved to Archive.':'Vehicle status updated.');
  }catch(e){alert('Status update failed: '+e.message)}
}
async function undoRelease(){
  if(!selected||selected.record_type==='company_owned')return;
  if(!confirm('Undo this vehicle release?\n\nIt will return to the active yard list and the release information will be cleared.'))return;
  try{
    const id=selected.id;
    const restoredStatus=(selected.hold_type&&selected.hold_type!=='none')?'hold':'impounded';
    const body={status:restoredStatus,release_at:null,released_to:null,release_id_checked:false,release_authorized_by:null,release_notes:null,release_signature_data:null,archived_at:null,archived_by:null};
    await api('/rest/v1/vehicles?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify(body)});
    await load(); detail(id); alert('Release undone. Vehicle returned to the active yard list.');
  }catch(e){alert('Could not undo release: '+e.message)}
}

async function archiveVehicle(){
  if(!selected||selected.archived_at)return;
  if(!confirm('Archive '+title(selected)+'?\n\nIt will leave the active vehicle list, but its TowTag, photos, invoice and records will stay saved.'))return;
  try{
    const id=selected.id,now=new Date().toISOString();
    await api('/rest/v1/vehicles?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify({archived_at:now,archived_by:user.id})});
    await load(); detail(id); alert('Vehicle moved to Archive.');
  }catch(e){alert('Archive failed: '+e.message)}
}
async function restoreVehicle(){
  if(!selected||!selected.archived_at)return;
  try{
    const id=selected.id;
    await api('/rest/v1/vehicles?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify({archived_at:null,archived_by:null})});
    await load(); detail(id); alert('Vehicle restored to the active list.');
  }catch(e){alert('Restore failed: '+e.message)}
}

async function trashVehicle(){
  if(!selected||selected.deleted_at)return;
  if(!confirm('Move '+title(selected)+' to Trash?\n\nYou can restore it later. Nothing will be permanently deleted.'))return;
  try{
    const id=selected.id,now=new Date().toISOString();
    await api('/rest/v1/vehicles?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify({deleted_at:now,deleted_by:user.id})});
    await load();detail(id);alert('Vehicle moved to Trash.');
  }catch(e){alert('Could not move vehicle to Trash: '+e.message)}
}
async function restoreTrashedVehicle(){
  if(!selected||!selected.deleted_at)return;
  try{
    const id=selected.id;
    await api('/rest/v1/vehicles?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify({deleted_at:null,deleted_by:null})});
    await load();detail(id);alert('Vehicle restored from Trash.');
  }catch(e){alert('Could not restore vehicle: '+e.message)}
}

async function deleteVehicle(){
  if(!selected)return;
  if(staffMember?.role!=='admin'){alert('Admin access is required for permanent deletion.');return}
  if(!selected.deleted_at){alert('Move the vehicle to Trash before permanently deleting it.');return}
  const vehicleName=title(selected); if(!confirm('PERMANENTLY delete '+vehicleName+' from TowTag?\n\nThis removes the vehicle record and its photos. This cannot be undone.'))return;
  try{
    const photos=await api('/rest/v1/vehicle_photos?select=storage_path&vehicle_id=eq.'+encodeURIComponent(selected.id));
    for(const p of (photos||[])){if(!p.storage_path)continue;try{await api('/storage/v1/object/vehicle-photos/'+p.storage_path.split('/').map(encodeURIComponent).join('/'),{method:'DELETE'});}catch(err){console.warn('Photo cleanup failed for',p.storage_path,err)}}
    await api('/rest/v1/vehicles?id=eq.'+encodeURIComponent(selected.id),{method:'DELETE',headers:{Prefer:'return=minimal'}}); selected=null; await load(); home(); alert('Vehicle deleted permanently.');
  }catch(e){alert('Delete failed: '+e.message)}
}
function takeLabeledPhoto(label){
  if(el('photoCaption'))el('photoCaption').value=label;
  if(el('cameraPhoto')){el('cameraPhoto').value='';el('cameraPhoto').click()}
}
async function uploadPhotos(fileList){
  if(!selected)return;
  const files=Array.from(fileList||[]); if(!files.length)return;
  try{
    for(let i=0;i<files.length;i++){
      const file=files[i]; let ext=(file.name&&file.name.includes('.')?file.name.split('.').pop():'jpg').toLowerCase().replace(/[^a-z0-9]/g,''); if(!ext)ext='jpg';
      const path=selected.id+'/'+Date.now()+'-'+i+'-'+Math.random().toString(36).slice(2,8)+'.'+ext;
      const mime=file.type||({jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',webp:'image/webp',heic:'image/heic',heif:'image/heif'}[ext]||'application/octet-stream');
      await api('/storage/v1/object/vehicle-photos/'+path,{method:'POST',headers:{'Content-Type':mime,'x-upsert':'false'},body:file});
      const caption=el('photoCaption')?.value||'Vehicle photo';
      await api('/rest/v1/vehicle_photos',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({vehicle_id:selected.id,storage_path:path,caption,created_by:user.id})});
    }
    const id=selected.id; await load(); selected=vehicles.find(v=>v.id===id); await loadStaffPhotos(selected.qr_token); alert(files.length===1?'Photo added to TowTag.':files.length+' photos added to TowTag.');
  }catch(e){alert('Photo upload failed: '+e.message)}
}
async function shareTag(){
  const url=SITE+'?tag='+encodeURIComponent(selected.qr_token);
  if(navigator.share)await navigator.share({title:'TowTag '+title(selected),url}); else{await navigator.clipboard.writeText(url);alert('TowTag link copied.')}
}
async function adminStaffCall(payload){
  if(!await ensureSession())throw new Error('Sign in required');
  const r=await fetch(BASE+'/functions/v1/towtag-admin-staff',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify(payload)});
  const d=await r.json();if(!r.ok)throw new Error(d.error||'Admin request failed');return d;
}
async function adminStaffScreen(){
  if(staffMember?.role!=='admin'){alert('Admin access required.');return}
  app.innerHTML='<button class="link" onclick="home()">‹ Vehicles</button><div class="h1">Staff Accounts</div><div class="card muted">Loading staff…</div>';
  try{
    const d=await adminStaffCall({action:'list'}),rows=d.staff||[];
    app.innerHTML='<button class="link" onclick="home()">‹ Vehicles</button><div class="h1">Staff Accounts</div><p class="muted">Activate accounts, choose Admin or Driver, and disable access without deleting the person’s login.</p>'+
      rows.map((s,i)=>'<div class="staff-row"><div style="font-weight:850">'+esc(s.display_name||'Unnamed staff')+(s.joined?'':' <span class="pill">Pending</span>')+'</div><div class="email">'+esc(s.email||'No email')+'</div><input id="staffName_'+i+'" class="input" placeholder="Display name" value="'+esc(s.display_name||'')+'"><div class="row"><select id="staffRole_'+i+'" class="input"><option value="driver" '+(s.role!=='admin'?'selected':'')+'>Driver</option><option value="admin" '+(s.role==='admin'?'selected':'')+'>Admin</option></select><label class="toggle" style="margin:5px 0 10px"><input id="staffActive_'+i+'" type="checkbox" '+(s.active?'checked':'')+'> Active access</label></div><button class="btn secondary" onclick="saveStaffAccount(\''+esc(s.user_id)+'\','+i+')">Save Staff Access</button><div class="small muted" style="margin-top:7px">'+(s.last_sign_in_at?'Last sign in '+esc(new Date(s.last_sign_in_at).toLocaleString()):'Has not signed in yet')+'</div></div>').join('');
  }catch(e){app.innerHTML='<button class="link" onclick="home()">‹ Vehicles</button><div class="error">'+esc(e.message)+'</div>'}
}
async function saveStaffAccount(userId,i){
  try{
    await adminStaffCall({action:'update',userId,displayName:val('staffName_'+i),role:val('staffRole_'+i),active:checked('staffActive_'+i)});
    alert('Staff access updated.');await adminStaffScreen();
  }catch(e){alert('Could not update staff: '+e.message)}
}
function logout(){staffMember=null;saveSession(null);loginScreen()}


async function publicView(token){
  app.innerHTML='<div class="brand-lockup"><div class="brand-mikes">Mike’s Cascade</div><div class="brand-yard">Towing Yard</div><div class="brand-powered">Powered by TowTag</div></div><div class="card muted">Loading vehicle record…</div>';
  try{
    const r=await fetch(BASE+'/functions/v1/towtag-public-vehicle?token='+encodeURIComponent(token),{headers:{apikey:KEY}});
    const d=await r.json(); if(!r.ok)throw new Error(d.error||'TowTag not found');
    const veh=[d.vehicle?.year,d.vehicle?.make,d.vehicle?.model].filter(Boolean).join(' ')||'Vehicle';
    const photos=(d.photos||[]).map(p=>'<figure><img src="'+esc(p.url)+'"><figcaption>'+esc(p.caption||'Vehicle photo')+'</figcaption></figure>').join('');
    const owned=d.recordType==='company_owned';
    const badge=owned?ownedLabel(d.ownedDisposition):(d.status||'');
    const info=owned?'<div class="kv" style="margin-top:14px"><div><span>Record type</span>Company Owned</div><div><span>Disposition</span>'+esc(ownedLabel(d.ownedDisposition))+'</div><div><span>Plate</span>'+esc(d.plate?.number||'—')+' '+esc(d.plate?.state||'')+'</div><div><span>Added</span>'+esc(new Date(d.towDate).toLocaleString())+'</div></div>':
      '<div class="kv" style="margin-top:14px"><div><span>Brought in</span>'+esc(new Date(d.towDate).toLocaleString())+'</div><div><span>Agency</span>'+esc(d.agency||'—')+'</div><div><span>Plate</span>'+esc(d.plate?.number||'—')+' '+esc(d.plate?.state||'')+'</div><div><span>Reason</span>'+esc(impoundLabel(d.impoundType))+'</div><div style="grid-column:1/-1"><span>Picked up from</span>'+esc(d.pickupLocation||d.yardLocation||'—')+'</div></div>';
    app.innerHTML='<div class="brand-lockup"><div class="brand-mikes">Mike’s Cascade</div><div class="brand-yard">Towing Yard</div><div class="brand-powered">Powered by TowTag</div></div><div class="card"><div class="small muted">VEHICLE RECORD</div><div class="h1">'+esc(veh)+
    '</div><div class="muted">'+esc(d.vehicle?.color||'Color not listed')+'</div><div style="margin-top:12px"><span class="pill">'+esc(badge)+'</span></div>'+info+'</div>'+ (photos?'<div class="card"><div class="small muted">PHOTOS</div><div class="photos" style="margin-top:12px">'+photos+'</div></div>':'');
  }catch(e){
    app.innerHTML='<div class="brand-lockup"><div class="brand-mikes">Mike’s Cascade</div><div class="brand-yard">Towing Yard</div><div class="brand-powered">Powered by TowTag</div></div><div class="error">'+esc(e.message)+'</div>';
  }
}

const tag=new URLSearchParams(location.search).get('tag');
if(tag){publicView(tag)}
else{
  try{
    session=JSON.parse(localStorage.getItem('towtag_session')||'null');
    if(session){user=session.user;boot()}else loginScreen()
  }catch{loginScreen()}
}
</script></body></html>
