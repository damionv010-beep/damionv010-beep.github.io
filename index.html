<style>
:root{color-scheme:dark;--bg:#0b0d10;--card:#15191f;--line:#29313a;--text:#f5f7fa;--muted:#98a3ae;--green:#76ff03}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}.wrap{max-width:760px;margin:auto;min-height:100vh;padding:max(18px,env(safe-area-inset-top)) 16px max(32px,env(safe-area-inset-bottom))}
.brand{font-size:32px;font-weight:900;letter-spacing:-.7px}.brand b{color:var(--green)}.site-name{font-size:14px;font-weight:800;letter-spacing:.2px;margin-top:3px}.site-name span{color:var(--green)}.muted{color:var(--muted)}.small{font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
.input{width:100%;background:#101419;border:1px solid var(--line);border-radius:12px;padding:13px;color:#fff;margin:5px 0 10px;font-size:16px}
.btn{border:0;border-radius:13px;padding:14px 15px;font-weight:800;background:var(--green);color:#071003;width:100%;margin-top:8px}
.btn.secondary{background:transparent;border:1px solid #3a4652;color:#dce3e9}.btn.danger{background:#351416;border:1px solid #7d2d35;color:#ffb8bf}.row{display:flex;gap:10px}.row>*{flex:1}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.link{color:#8dff3f;background:none;border:0;font-weight:750;padding:8px 0}
.vehicle{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;color:#fff;margin:10px 0}
.vehicle h3{margin:0 0 5px}.pill{display:inline-block;padding:6px 9px;border-radius:999px;background:#20320f;color:#baff83;font-size:12px;font-weight:800;text-transform:capitalize}
.error{padding:12px;border-radius:12px;background:#271417;border:1px solid #5a272e;color:#ffb7bf;margin:10px 0}
.notice{padding:12px;border-radius:12px;background:#151c12;border:1px solid #30431e;color:#cfffaa;margin:10px 0}
.h1{font-size:28px;font-weight:850;margin:14px 0 2px}.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kv div{background:#101419;border-radius:12px;padding:12px}.kv span{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}
.qr{background:#fff;border-radius:16px;padding:14px;width:min(100%,320px);display:block;margin:14px auto}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:12px}.photos figure{margin:0;background:#101419;border-radius:14px;overflow:hidden}.photos img{width:100%;display:block;aspect-ratio:4/3;object-fit:cover}.photos figcaption{padding:9px 10px;color:#aab3bd;font-size:12px}

.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 12px}.choice{border:1px solid #3a4652;background:#101419;color:#dce3e9;border-radius:12px;padding:12px 8px;font-weight:800}.choice.active{border-color:var(--green);background:#20320f;color:#cfffaa}.toggle-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.toggle{display:flex;align-items:center;gap:10px;background:#101419;border:1px solid var(--line);border-radius:12px;padding:12px;margin:6px 0}.toggle input{width:22px;height:22px;accent-color:var(--green)}details.card summary{cursor:pointer;font-weight:800;color:#dce3e9;padding:2px 0}.filters .choice{font-size:12px;padding:10px 4px}.photo-choices .choice{font-size:12px}
@media(max-width:560px){.row{flex-direction:column}.kv,.photos{grid-template-columns:1fr}.choice-grid.filters{grid-template-columns:repeat(4,1fr)!important}.toggle-grid{grid-template-columns:1fr 1fr}}

.invoice-checks{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin:8px 0 12px}
.invoice-checks label{display:flex;align-items:center;gap:8px;background:#101419;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px}
.invoice-checks input{width:20px;height:20px;accent-color:var(--green)}
.invoice-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.invoice-actions{grid-template-columns:1fr}.invoice-checks{grid-template-columns:1fr 1fr}}


/* TowTag brand lockup — intentionally split into two distinct visual voices. */
.brand-lockup{display:flex;align-items:center;gap:12px;line-height:1;margin-bottom:4px}
.brand-icon{width:46px;height:46px;flex:0 0 46px;border-radius:13px;background:var(--green);color:#071003;display:grid;place-items:center;font-size:25px;font-weight:950;letter-spacing:-1px;box-shadow:0 0 0 1px rgba(118,255,3,.18),0 8px 22px rgba(0,0,0,.28)}
.brand-copy{min-width:0}.brand-company{font-size:10px;font-weight:850;color:#aab3bd;letter-spacing:1.55px;text-transform:uppercase;margin-bottom:4px;white-space:nowrap}.brand-towtag{font-size:31px;font-weight:950;letter-spacing:-1.1px;color:#f5f7fa;white-space:nowrap}.brand-towtag b{color:var(--green)}

.search-all-note{padding:8px 10px;border:1px solid #30431e;background:#151c12;color:#cfffaa;border-radius:11px;font-size:12px;margin:-2px 0 10px}
.storage-clock{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#101419;border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.storage-clock strong{font-size:18px;color:#fff}.storage-clock span{font-size:11px;color:var(--muted);display:block;margin-top:2px}
.billing-ok{color:#baff83;font-weight:750}


/* TowTag safety / admin / signature upgrades */
.attention{border-color:#6c5721;background:#1d1a10}.attention strong{color:#ffd76a}
.age-pill{display:inline-block;padding:4px 7px;border-radius:999px;background:#1d242b;color:#cfd8e3;font-size:11px;font-weight:800;margin-left:5px}
.age-pill.old{background:#3b2710;color:#ffd28a}
.trash-pill{background:#36171b;color:#ffb8bf}
.signature-pad{width:100%;height:150px;background:#fff;border:2px solid #46515d;border-radius:12px;touch-action:none;display:block;margin:8px 0}
.signature-preview{width:100%;max-width:500px;height:auto;background:#fff;border:1px solid #46515d;border-radius:10px;margin-top:8px}
.staff-row{border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0;background:#101419}
.staff-row .email{font-size:12px;color:var(--muted);word-break:break-all}
.photo-actions{position:absolute;right:7px;top:7px;display:flex;gap:6px;z-index:2}
.photo-actions button{border:0;border-radius:999px;padding:8px 10px;font-size:11px;font-weight:850}
.photo-move{background:rgba(15,43,64,.92);color:#bfe4ff}
.photo-delete{background:rgba(55,7,10,.9);color:#ffb8bf}
@media(max-width:560px){.choice-grid.filters{grid-template-columns:repeat(3,1fr)!important}}

/* Agency billing, documents, and attention dashboard */
.dashboard-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.quick-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.quick-actions .btn{margin-top:0;padding:12px 10px}.quick-actions .btn.wide{grid-column:1/-1}
.attention-count{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 7px;border-radius:999px;background:#4b3712;color:#ffd76a;font-size:11px;font-weight:900;margin-left:7px}
.agency-contact a{color:#baff83;text-decoration:none;font-weight:750}.agency-contact .line{padding:7px 0;border-bottom:1px solid var(--line)}
.rate-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.rate-grid .input{margin-bottom:3px}.rate-note{border:1px solid #2f4a20;background:#131c10;color:#cfffaa;border-radius:12px;padding:10px;margin:10px 0;font-size:12px}
.document-row{border:1px solid var(--line);background:#101419;border-radius:13px;padding:12px;margin:9px 0}.document-row .name{font-weight:800;word-break:break-word}.document-row .meta{font-size:11px;color:var(--muted);margin-top:4px}.document-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.document-actions .btn{margin-top:0;padding:10px 11px}
.attention-item{border-left:4px solid #a37b22}.attention-item .reason{font-size:12px;color:#ffd76a;margin-top:7px}
@media(max-width:560px){.dashboard-actions,.rate-grid{grid-template-columns:1fr}.document-actions{grid-template-columns:1fr 1fr}}


/* Generic TowTag invoice */
.generic-invoice-lines{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.generic-invoice-line{display:grid;grid-template-columns:minmax(0,1fr) 120px 42px;gap:8px;align-items:center}
.generic-invoice-line .input{margin:0}
.generic-invoice-line .remove-line{border:1px solid #5c2a2f;background:#2b1417;color:#ffb8bf;border-radius:10px;height:44px;font-weight:900}
.generic-total-row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-weight:800}
.generic-total-row.total{font-size:20px;border-top:1px solid var(--line);margin-top:6px;padding-top:12px}
@media(max-width:560px){.generic-invoice-line{grid-template-columns:minmax(0,1fr) 96px 42px}}

</style>

<body><main class="wrap"><div id="app"></div></main>
<script>
const BASE='https://ckonxzprnxqlefxscudt.supabase.co';
const KEY='sb_publishable_fQ-Cv2dhMlib6_16oh-WiQ_Ku96PhPp';
const SITE='https://damionv010-beep.github.io/';
const INVOICE_BG='';
let session=null,user=null,staffMember=null,vehicles=[],photoRows=[],documentRows=[],agencyRows=[],billingProfiles=[],selected=null,movePhotoId=null;
const app=document.getElementById('app');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BRAND_HTML='<div class="brand-lockup"><div class="brand-icon">T</div><div class="brand-copy"><div class="brand-company">Mike’s Cascade Towing</div><div class="brand-towtag">Tow<b>Tag</b></div><div class="brand-powered">Yard Management</div></div></div>';

function saveSession(s){
  session=s;
  if(s){
    session.expires_at=Math.floor(Date.now()/1000)+(s.expires_in||3600);
    localStorage.setItem('towtag_session',JSON.stringify(session));
    user=s.user;
  }else{
    localStorage.removeItem('towtag_session'); user=null;
  }
}
async function ensureSession(){
  if(!session)return false;
  if((session.expires_at||0)>Math.floor(Date.now()/1000)+90)return true;
  if(!session.refresh_token){logout();return false}
  const r=await fetch(BASE+'/auth/v1/token?grant_type=refresh_token',{
    method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},
    body:JSON.stringify({refresh_token:session.refresh_token})
  });
  if(!r.ok){logout();return false}
  saveSession(await r.json()); return true;
}
async function api(path,opt={}){
  if(!await ensureSession())throw new Error('Sign in required');
  const r=await fetch(BASE+path,{...opt,headers:{apikey:KEY,Authorization:'Bearer '+session.access_token,...(opt.headers||{})}});
  const t=await r.text(); let d=null; try{d=t?JSON.parse(t):null}catch{d=t}
  if(!r.ok)throw new Error((d&&d.message)||(d&&d.error)||('Request failed '+r.status));
  return d;
}
function authBrand(){
  return BRAND_HTML+'<p class="muted">Vehicle records, invoices + QR tags</p>';
}
function togglePassword(id='pw',buttonId='showPw'){
  const el=document.getElementById(id),btn=document.getElementById(buttonId);
  if(!el)return;
  const showing=el.type==='text';
  el.type=showing?'password':'text';
  if(btn)btn.textContent=showing?'Show':'Hide';
}
function passwordField(id='pw',autocomplete='current-password'){
  return '<div style="position:relative"><input id="'+id+'" class="input" style="padding-right:78px" type="password" autocomplete="'+autocomplete+'"><button id="showPw" type="button" onclick="togglePassword(\''+id+'\',\'showPw\')" style="position:absolute;right:8px;top:10px;border:0;background:transparent;color:#8dff3f;font-weight:800;padding:10px">Show</button></div>';
}
function loginScreen(msg=''){
  const saved=localStorage.getItem('towtag_email')||'';
  app.innerHTML='<div style="padding-top:8vh">'+authBrand()+msg+
  '<div class="card"><div class="h1" style="font-size:22px;margin-top:0">Staff Sign In</div><p class="muted" style="margin-top:4px">TowTag keeps you signed in on this device.</p>'+
  '<label class="small muted">EMAIL</label><input id="email" name="email" class="input" type="email" autocomplete="username" autocapitalize="none" spellcheck="false" value="'+esc(saved)+'">'+
  '<label class="small muted">PASSWORD</label>'+passwordField('pw','current-password')+
  '<label class="toggle" style="margin:0 0 6px"><input id="rememberEmail" type="checkbox" '+(saved?'checked':'')+'> Remember my email</label>'+
  '<button class="btn" onclick="login()">Sign In</button><button class="btn secondary" onclick="createAccountScreen()">Create Staff Account</button>'+
  '<button class="link" style="width:100%;text-align:center;margin-top:8px" onclick="forgotPasswordScreen()">Forgot password?</button>'+
  '<p class="small muted" style="margin-bottom:0">New accounts need the Mike’s Cascade staff access code once.</p></div></div>';
  setTimeout(()=>{
    const e=document.getElementById('email'),p=document.getElementById('pw');
    if(saved&&p)p.focus(); else if(e)e.focus();
    if(p)p.addEventListener('keydown',ev=>{if(ev.key==='Enter')login()});
  },0);
}
async function login(){
  const e=(document.getElementById('email')?.value||'').trim().toLowerCase();
  const p=document.getElementById('pw')?.value||'';
  try{
    if(!e||!p)throw new Error('Enter your email and password.');
    const r=await fetch(BASE+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:e,password:p})});
    const d=await r.json();
    if(!r.ok){
      const raw=d.error_description||d.msg||d.message||'Sign in failed';
      if(/invalid login credentials/i.test(raw))throw new Error('Email or password is incorrect.');
      throw new Error(raw);
    }
    if(document.getElementById('rememberEmail')?.checked)localStorage.setItem('towtag_email',e);else localStorage.removeItem('towtag_email');
    saveSession(d); await boot();
  }catch(e){loginScreen('<div class="error">'+esc(e.message)+'</div>')}
}

function forgotPasswordScreen(msg=''){
  const saved=localStorage.getItem('towtag_email')||'';
  app.innerHTML='<div style="padding-top:8vh">'+authBrand()+msg+
  '<div class="card"><button class="link" onclick="loginScreen()">‹ Back to Sign In</button><div class="h1" style="font-size:22px">Reset Password</div><p class="muted">Enter the staff account email. TowTag will send a password reset link.</p>'+ 
  '<label class="small muted">EMAIL</label><input id="resetEmail" class="input" type="email" autocomplete="username" autocapitalize="none" spellcheck="false" value="'+esc(saved)+'">'+
  '<button class="btn" onclick="sendPasswordReset()">Send Reset Link</button><button class="btn secondary" onclick="loginScreen()">Cancel</button></div></div>';
}
async function sendPasswordReset(){
  const email=(document.getElementById('resetEmail')?.value||'').trim().toLowerCase();
  try{
    if(!email)throw new Error('Enter the account email.');
    localStorage.setItem('towtag_email',email);
    const r=await fetch(BASE+'/auth/v1/recover?redirect_to='+encodeURIComponent(SITE),{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email})});
    let d={};try{d=await r.json()}catch{}
    if(!r.ok)throw new Error(d.msg||d.message||d.error_description||'Could not send reset email.');
    forgotPasswordScreen('<div class="notice">Reset email sent. Open the link in that email on this device, then choose a new password.</div>');
  }catch(e){forgotPasswordScreen('<div class="error">'+esc(e.message)+'</div>')}
}
function passwordRecoveryFromUrl(){
  const h=new URLSearchParams((location.hash||'').replace(/^#/,''));
  if(h.get('type')!=='recovery'||!h.get('access_token'))return false;
  session={access_token:h.get('access_token'),refresh_token:h.get('refresh_token')||'',expires_in:Number(h.get('expires_in')||3600),expires_at:Math.floor(Date.now()/1000)+Number(h.get('expires_in')||3600)};
  return true;
}
function recoveryPasswordScreen(msg=''){
  app.innerHTML='<div style="padding-top:8vh">'+authBrand()+msg+
  '<div class="card"><div class="h1" style="font-size:22px">Choose New Password</div><p class="muted">Enter a new password for this TowTag staff account.</p>'+ 
  '<label class="small muted">NEW PASSWORD</label><div style="position:relative"><input id="recoveryPw" class="input" style="padding-right:78px" type="password" autocomplete="new-password"><button id="showRecoveryPw" type="button" onclick="togglePassword(\'recoveryPw\',\'showRecoveryPw\')" style="position:absolute;right:8px;top:10px;border:0;background:transparent;color:#8dff3f;font-weight:800;padding:10px">Show</button></div>'+ 
  '<label class="small muted">CONFIRM PASSWORD</label><input id="recoveryPw2" class="input" type="password" autocomplete="new-password">'+
  '<button class="btn" onclick="finishPasswordRecovery()">Save New Password</button></div></div>';
}
async function finishPasswordRecovery(){
  const p1=document.getElementById('recoveryPw')?.value||'',p2=document.getElementById('recoveryPw2')?.value||'';
  try{
    if(!session?.access_token)throw new Error('This reset link is no longer valid. Request a new one.');
    if(p1.length<6)throw new Error('Password must be at least 6 characters.');
    if(p1!==p2)throw new Error('Passwords do not match.');
    const r=await fetch(BASE+'/auth/v1/user',{method:'PUT',headers:{apikey:KEY,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify({password:p1})});
    let d={};try{d=await r.json()}catch{}
    if(!r.ok)throw new Error(d.msg||d.message||d.error_description||'Could not update password.');
    history.replaceState(null,'',location.pathname+location.search);
    session=null;localStorage.removeItem('towtag_session');user=null;staffMember=null;
    loginScreen('<div class="notice">Password updated. Sign in with your new password.</div>');
  }catch(e){recoveryPasswordScreen('<div class="error">'+esc(e.message)+'</div>')}
}
function createAccountScreen(msg=''){
  const saved=localStorage.getItem('towtag_email')||'';
  app.innerHTML='<div style="padding-top:5vh">'+authBrand()+msg+
  '<div class="card"><button class="link" onclick="loginScreen()">‹ Back to Sign In</button><div class="h1" style="font-size:22px">Create Staff Account</div>'+
  '<p class="muted">Do this once per person. After that, just sign in normally.</p>'+
  '<label class="small muted">STAFF MEMBER</label><select id="newStaffName" class="input"><option value="Damion">Damion</option><option value="Mike">Mike</option></select>'+
  '<label class="small muted">EMAIL</label><input id="newEmail" class="input" type="email" autocomplete="username" autocapitalize="none" spellcheck="false" value="'+esc(saved)+'">'+
  '<label class="small muted">PASSWORD</label>'+passwordField('newPw','new-password')+
  '<div class="small muted" style="margin:-4px 0 10px">Use at least 6 characters. iPhone can save it to Passwords.</div>'+
  '<label class="small muted">STAFF ACCESS CODE</label><input id="staffCode" class="input" type="text" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" placeholder="Mike’s Cascade staff code">'+
  '<button class="btn" onclick="createStaffAccount()">Create Account & Enter TowTag</button><button class="btn secondary" onclick="loginScreen()">Cancel</button></div></div>';
}
async function callStaffJoin(displayName,staffCode){
  if(!session?.access_token)throw new Error('Sign in required.');
  const r=await fetch(BASE+'/functions/v1/towtag-staff-join',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify({displayName,staffCode})});
  const d=await r.json();
  if(!r.ok)throw new Error(d.error||'Could not activate TowTag access.');
  return d;
}
async function createStaffAccount(){
  const displayName=document.getElementById('newStaffName')?.value||'';
  const e=(document.getElementById('newEmail')?.value||'').trim().toLowerCase();
  const p=document.getElementById('newPw')?.value||'';
  const code=(document.getElementById('staffCode')?.value||'').trim().toUpperCase();
  try{
    if(!e)throw new Error('Enter an email address.');
    if(p.length<6)throw new Error('Password must be at least 6 characters.');
    if(!code)throw new Error('Enter the staff access code.');
    const r=await fetch(BASE+'/auth/v1/signup',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:e,password:p,data:{display_name:displayName}})});
    const d=await r.json();
    if(!r.ok){
      const raw=d.msg||d.message||'Account creation failed';
      if(/already registered|already exists|user already/i.test(raw)){
        localStorage.setItem('towtag_email',e);
        loginScreen('<div class="notice">That email already has an account. Sign in below; TowTag will let you activate staff access if needed.</div>');
        return;
      }
      throw new Error(raw);
    }
    localStorage.setItem('towtag_email',e);
    if(d.access_token){
      saveSession(d);
      await callStaffJoin(displayName,code);
      await boot();
    }else{
      loginScreen('<div class="notice">Account created. Check your email to confirm it, then sign in. TowTag will ask for the staff access code once.</div>');
    }
  }catch(e){createAccountScreen('<div class="error">'+esc(e.message)+'</div>')}
}
async function boot(){
  try{
    user=await api('/auth/v1/user');
    const m=await api('/rest/v1/staff_members?select=user_id,role,active,display_name&user_id=eq.'+encodeURIComponent(user.id));
    if(!m.length){staffJoinScreen();return}
    if(!m[0].active)throw new Error('This TowTag staff account is disabled.');
    staffMember=m[0];
    await load(); home();
  }catch(e){loginScreen('<div class="error">'+esc(e.message)+'</div>')}
}
function staffJoinScreen(msg=''){
  const suggested=(user?.user_metadata?.display_name==='Mike')?'Mike':'Damion';

function storageDayCount(v,endOverride=null){
  if(!v||!v.tow_date||v.record_type==='company_owned')return 0;
  const start=new Date(v.tow_date);
  const rawEnd=endOverride||v.release_at||v.archived_at||new Date();
  const end=rawEnd instanceof Date?rawEnd:new Date(rawEnd);
  if(Number.isNaN(start.getTime())||Number.isNaN(end.getTime()))return 0;
  const dayStart=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();
  const diff=Math.floor((dayStart(end)-dayStart(start))/86400000);
  return Math.max(1,diff+1);
}

function recordAgeDays(v){
  if(!v?.tow_date)return 0;
  const start=new Date(v.tow_date),end=new Date();
  if(Number.isNaN(start.getTime()))return 0;
  return Math.max(0,Math.floor((end-start)/86400000));
}

function agencyChargeSuggestions(v){
  const p=billingProfileForVehicle(v); if(!p)return null;
  const n=x=>Number(x)||0;
  const baseMap={wheel_lift:p.wheel_lift_base,wrecker:p.wrecker_base,medium_duty:p.medium_duty_base,flat_bed:p.flat_bed_base};
  const towing=n(baseMap[v.equipment_type]);
  const mileage=n(v.billable_miles)*n(p.mileage_rate);
  const labor=(n(v.recovery_minutes)/60)*n(p.recovery_hourly)+(n(v.scene_wait_minutes)/60)*n(p.scene_wait_hourly);
  const extra=(n(v.extra_labor_minutes)/60)*n(p.extra_labor_hourly);
  let special=0;
  if(v.used_dollies)special+=n(p.dollies_fee);
  if(v.winching_performed)special+=n(p.winching_fee);
  if(v.cleanup_performed)special+=n(p.cleanup_fee);
  if(v.hazmat_cleanup)special+=n(p.hazmat_fee);
  if(v.after_hours)special+=n(p.after_hours_fee);
  const storage=storageDayCount(v)*n(p.storage_daily);

}

  const set=(k,val)=>{if((d[k]===null||d[k]===undefined||d[k]==='')&&Number(val)>0)d[k]=Number(val).toFixed(2)};
  set('towing_charge',c.towing);set('mileage_charge',c.mileage);set('labor_charge',c.labor);set('extra_person_charge',c.extra);set('special_equipment_charge',c.special);set('storage_charge',c.storage);
  if(!d.storage_rate&&c.storage_rate)d.storage_rate=c.storage_rate.toFixed(2);
  const subtotal=['towing_charge','mileage_charge','labor_charge','extra_person_charge','special_equipment_charge','storage_charge'].reduce((sum,k)=>sum+(Number(String(d[k]||'').replace(/[$,]/g,''))||0),0);
  d.subtotal=subtotal.toFixed(2); d.total=(subtotal+(Number(String(d.tax||'').replace(/[$,]/g,''))||0)).toFixed(2);

const OFFLINE_QUEUE_KEY='towtag_offline_intakes';
function offlineIntakes(){try{return JSON.parse(localStorage.getItem(OFFLINE_QUEUE_KEY)||'[]')||[]}catch{return []}}
function setOfflineIntakes(rows){localStorage.setItem(OFFLINE_QUEUE_KEY,JSON.stringify(rows||[]))}
function looksOfflineError(e){return !navigator.onLine||/failed to fetch|load failed|network|offline|internet/i.test(String(e?.message||e||''))}
function queueOfflineIntake(body,agencyName){const q=offlineIntakes();q.push({id:'local-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),saved_at:new Date().toISOString(),agency_name:agencyName||'',body});setOfflineIntakes(q)}
async function syncOfflineIntakes(silent=false){
  const q=offlineIntakes();if(!q.length){if(!silent)alert('No saved offline intakes to sync.');return}
  if(!navigator.onLine){if(!silent)alert('TowTag is still offline. Try again when you have service.');return}
  const remaining=[];let synced=0;
  for(let i=0;i<q.length;i++){
    const item=q[i];
    try{
      const body={...(item.body||{})};
      if((body.record_type||'tow')==='tow'&&!body.agency_id&&item.agency_name)body.agency_id=await resolveAgency(item.agency_name);
      await api('/rest/v1/vehicles',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify(body)});synced++;
    }catch(e){remaining.push(item,...q.slice(i+1));break}
  }
  setOfflineIntakes(remaining);
  try{await load();home()}catch{}
  if(!silent)alert(synced+' saved intake'+(synced===1?'':'s')+' synced.'+(remaining.length?' '+remaining.length+' still waiting.':''));
}
window.addEventListener('online',()=>{if(offlineIntakes().length)syncOfflineIntakes(true).catch(()=>{})});

function saveIntakeDraft(){

    if(!x.id)return;fields[x.id]={value:x.value,checked:!!x.checked,type:x.type};
  });
  if(Object.keys(fields).length)localStorage.setItem('towtag_intake_draft',JSON.stringify({savedAt:Date.now(),fields}));
}
function bindIntakeDraft(){
  const raw=localStorage.getItem('towtag_intake_draft');

    try{
      const d=JSON.parse(raw),age=Date.now()-(d.savedAt||0);
      if(age<86400000){Object.entries(d.fields||{}).forEach(([id,x])=>{const e=el(id);if(!e)return;if(e.type==='checkbox')e.checked=!!x.checked;else e.value=x.value??'';});}

  }

}

async function saveVehicleEdits(){
  if(!selected)return;
  try{
    const id=selected.id, record_type=val('editRecordType')||'tow';
    const vinValue=val('editVin').toUpperCase();
    if(handleDuplicateBeforeSave(vinValue,val('editPlate'),val('editState'),selected.id))return;
    let tow_date=selected.tow_date; const towDateValue=val('editTowDate'); if(towDateValue){const parsed=new Date(towDateValue);if(Number.isNaN(parsed.getTime()))throw new Error('Tow date/time is invalid.');tow_date=parsed.toISOString();}
    let agency_id=null; if(record_type==='tow')agency_id=await resolveAgency(val('editAgency'));
    const num=id=>val(id)?Number(val(id)):null;
    const body={record_type,year:num('editYear'),make:val('editMake')||null,model:val('editModel')||null,color:val('editColor')||null,plate:val('editPlate').toUpperCase()||null,plate_state:val('editState').toUpperCase()||null,vin:vinValue||null,odometer:num('editOdometer'),keys_status:val('editKeys')||'unknown',tow_date,condition_notes:val('editCondition')||null,property_notes:val('editProperty')||null,notes:val('editNotes')||null};
    if(record_type==='tow')Object.assign(body,{agency_id,impound_type:val('editImpoundType')||null,yard_location:val('editPickup')||null,tow_number:val('editTowNumber').toUpperCase()||null,driver_name:val('editDriver')||null,hold_type:val('editHoldType')||'none',hold_notes:val('editHoldNotes')||null,status:val('editStatus')||selected.status,owned_disposition:null,asking_price:null,owned_notes:null,equipment_type:val('editEquipmentType')||null,used_dollies:checked('editUsedDollies'),recovery_performed:checked('editRecoveryPerformed')||!!val('editRecoveryMinutes'),recovery_minutes:num('editRecoveryMinutes'),winching_performed:checked('editWinchingPerformed'),cleanup_performed:checked('editCleanupPerformed')||checked('editHazmatCleanup'),hazmat_cleanup:checked('editHazmatCleanup'),extra_labor:checked('editExtraLabor')||!!val('editExtraLaborMinutes'),extra_labor_minutes:num('editExtraLaborMinutes'),after_hours:checked('editAfterHours'),scene_wait_minutes:num('editSceneWaitMinutes'),billable_miles:num('editBillableMiles'),other_billable_work:val('editOtherBillableWork')||null,billing_notes:val('editBillingNotes')||null});
    else {
      const disp=val('editOwnedDisposition')||null;
      Object.assign(body,{agency_id:null,impound_type:null,yard_location:null,tow_number:null,driver_name:null,hold_type:'none',hold_notes:null,status:'other',owned_disposition:disp,asking_price:num('editAskingPrice'),disposition_amount:num('editDispositionAmount'),owned_notes:val('editOwnedNotes')||null,equipment_type:null,used_dollies:false,recovery_performed:false,recovery_minutes:null,winching_performed:false,cleanup_performed:false,hazmat_cleanup:false,extra_labor:false,extra_labor_minutes:null,after_hours:false,scene_wait_minutes:null,billable_miles:null,other_billable_work:null,billing_notes:null});
      if((disp==='sold'||disp==='scrapped')&&!selected.disposition_completed_at)body.disposition_completed_at=new Date().toISOString();
      if(!disp||disp==='for_sale'||disp==='scrap')body.disposition_completed_at=null;
    }
    if(selected.release_at&&record_type==='tow'){body.released_to=val('editReleasedTo')||null;body.release_authorized_by=val('editReleaseAuthorized')||null;body.release_id_checked=checked('editReleaseIdChecked');body.release_notes=val('editReleaseNotes')||null;}
    await api('/rest/v1/vehicles?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify(body)});
    await load(); detail(id); alert('Vehicle updated.');
  }catch(e){alert('Vehicle update failed: '+e.message)}
}

async function completeOwnedDisposition(kind){
  if(!selected||selected.record_type!=='company_owned')return;
  const label=kind==='sold'?'sale price':'scrap amount';
  const input=prompt('Enter '+label+' (optional). Leave blank if you do not want to record an amount.','');
  if(input===null)return;
  const amount=input.trim()===''?null:Number(input.replace(/[$,]/g,''));
  if(input.trim()!==''&&!Number.isFinite(amount)){alert('Enter a valid amount.');return}
  try{
    const id=selected.id;
    const now=new Date().toISOString();
    await api('/rest/v1/vehicles?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify({owned_disposition:kind,disposition_amount:amount,disposition_completed_at:now,archived_at:now,archived_by:user.id})});
    await load(); detail(id); alert(kind==='sold'?'Vehicle marked sold and moved to Archive.':'Vehicle marked scrapped and moved to Archive.');
  }catch(e){alert('Update failed: '+e.message)}
}

let releaseSignatureInk=false;
function initReleaseSignature(){
  const c=el('releaseSignatureCanvas'); if(!c)return;
  const ctx=c.getContext('2d'); ctx.lineWidth=3; ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#111';
  let drawing=false;
  const point=e=>{const r=c.getBoundingClientRect();return {x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}};

async function uploadVehicleDocuments(fileList){
  if(!selected)return; const files=Array.from(fileList||[]);if(!files.length)return;
  try{
    for(let i=0;i<files.length;i++){
      const file=files[i]; let ext=(file.name&&file.name.includes('.')?file.name.split('.').pop():'bin').toLowerCase().replace(/[^a-z0-9]/g,'')||'bin';
      const path=selected.id+'/'+Date.now()+'-'+i+'-'+Math.random().toString(36).slice(2,8)+'.'+ext;
      await api('/storage/v1/object/vehicle-documents/'+path,{method:'POST',headers:{'Content-Type':file.type||'application/octet-stream','x-upsert':'false'},body:file});
      await api('/rest/v1/vehicle_documents',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({vehicle_id:selected.id,storage_path:path,file_name:file.name||('Document.'+ext),content_type:file.type||null,document_type:val('documentType')||'other',notes:val('documentNotes')||null,uploaded_by:user.id})});
    }
    const id=selected.id;await load();selected=vehicles.find(v=>v.id===id);renderVehicleDocuments(id);alert(files.length===1?'Document attached.':files.length+' documents attached.');
  }catch(e){alert('Document upload failed: '+e.message)}
}
async function openVehicleDocument(id){

    const path=d.storage_path.split('/').map(encodeURIComponent).join('/');
    const r=await api('/storage/v1/object/sign/vehicle-documents/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({expiresIn:3600})});
    let u=r?.signedURL||r?.signedUrl||r?.signed_url||''; if(!u)throw new Error('Could not create document link.');

  }catch(e){if(w)w.close();alert('Could not open document: '+e.message)}
}

async function adminStaffCall(payload){
  if(!await ensureSession())throw new Error('Sign in required');
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);
  try{
    const r=await fetch(BASE+'/functions/v1/towtag-admin-staff',{method:'POST',signal:controller.signal,headers:{apikey:KEY,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json','Cache-Control':'no-store'},body:JSON.stringify(payload)});
    const text=await r.text();let d={};try{d=text?JSON.parse(text):{}}catch{throw new Error('Staff service returned an unreadable response.');}
    if(!r.ok)throw new Error(d.error||('Staff request failed ('+r.status+')'));
    return d;
  }catch(e){if(e?.name==='AbortError')throw new Error('Staff took too long to load. Tap Retry.');throw e}
  finally{clearTimeout(timer)}
}

    '<div class="card"><div class="small muted">BILL TO</div><input id="genericCustomerName" class="input" placeholder="Customer / business name" value="'+esc(d.customer_name)+'"><input id="genericCustomerPhone" class="input" placeholder="Phone" value="'+esc(d.customer_phone)+'"><textarea id="genericCustomerAddress" class="input" rows="2" placeholder="Address">'+esc(d.customer_address)+'</textarea></div>'+
    '<div class="card"><div class="small muted">VEHICLE / TOW</div><div class="kv" style="margin-top:10px"><div><span>Vehicle</span>'+esc(vehicle)+'</div><div><span>Plate</span>'+esc(v.plate||'—')+'</div><div><span>VIN</span>'+esc(v.vin||'—')+'</div><div><span>Tow / case #</span>'+esc(v.tow_number||'—')+'</div></div></div>'+
    '<div class="card"><div class="small muted">LINE ITEMS</div><div id="genericInvoiceLines" class="generic-invoice-lines">'+d.lines.map(genericInvoiceLineHtml).join('')+'</div><button type="button" class="btn secondary" onclick="addGenericInvoiceLine()">+ Add Line Item</button></div>'+
    '<div class="card"><div class="row"><div><label class="small muted">TAX / OTHER</label><input id="genericTax" class="input" inputmode="decimal" placeholder="0.00" value="'+esc(d.tax)+'" oninput="recalcGenericInvoice()"></div><div><div class="generic-total-row"><span>Subtotal</span><span id="genericSubtotal">$0.00</span></div><div class="generic-total-row total"><span>Total</span><span id="genericTotal">$0.00</span></div></div></div><textarea id="genericNotes" class="input" rows="4" placeholder="Invoice notes">'+esc(d.notes)+'</textarea></div>'+
    '<div class="invoice-actions"><button class="btn" onclick="saveInvoice()">Save Invoice</button><button class="btn secondary" onclick="printInvoiceFromForm()">Print / Save PDF</button></div><button class="btn secondary" onclick="detail(\''+v.id+'\')">Back to Vehicle</button>';
  setTimeout(recalcGenericInvoice,0);
};
collectInvoiceForm=function(){return collectGenericInvoice();};
saveInvoice=async function(){
  if(!selected)return;
  try{
    const id=selected.id,data={...invoiceStored(selected),...collectGenericInvoice()},invoice_number=val('genericInvoiceNumber')||selected.invoice_number||null;
    await api('/rest/v1/vehicles?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify({invoice_number,invoice_data:data,invoice_updated_at:new Date().toISOString()})});
    await load();detail(id);alert('Invoice saved.');
  }catch(e){alert('Invoice save failed: '+e.message)}
};
printInvoiceFromForm=function(){
  if(!selected)return;

  const w=window.open('','_blank');if(!w){alert('Allow pop-ups to print the invoice.');return}

eneric_customer_phone||'')+'</div><div>'+esc(d.generic_customer_address||'')+'</div></div><div class="box"><div class="label">VEHICLE / TOW</div><div>'+esc(vehicle)+' · Plate '+esc(v.plate||'—')+' · VIN '+esc(v.vin||'—')+'</div><div>Tow / Case #: '+esc(v.tow_number||'—')+'</div></div><div class="box"><table><thead><tr><th>Description</th><th class="amt">Amount</th></tr></thead><tbody>'+rows+'</tbody></table><div class="totals"><div class="totalrow"><span>Subtotal</span><span>'+esc(money(Number(d.subtotal)||0))+'</span></div><div class="totalrow"><span>Tax / Other</span><span>'+esc(money(Number(d.tax)||0))+'</span></div><div class="totalrow grand"><span>Total</span><span>'+esc(money(Number(d.total)||0))+'</span></div></div></div>'+(d.generic_notes?'<div class="box"><div class="label">NOTES</div><div class="notes">'+esc(d.generic_notes)+'</div></div>':'')+'</div></body></html>');
  w.document.close();
};
