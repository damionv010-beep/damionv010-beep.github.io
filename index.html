<style>

@media(max-width:560px){.damage-canvas{height:58vh;min-height:390px}.damage-svg{inset:4% 10%}.damage-marker{width:44px;height:44px;font-size:44px}.damage-toolbar{grid-template-columns:1fr 1fr}}


/* TowTag Daily Ops Suite */
.mode-switch{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.mode-switch button{border:1px solid #3a4652;background:#101419;color:#dce3e9;border-radius:12px;padding:11px;font-weight:850}.mode-switch button.active{border-color:var(--green);background:#20320f;color:#cfffaa}.ops-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.ops-grid .btn{margin-top:0}.ops-wide{grid-column:1/-1}.ops-stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.ops-stat{background:#101419;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}.ops-stat strong{display:block;font-size:20px}.ops-stat span{display:block;color:var(--muted);font-size:10px;margin-top:3px}.critical-note{border:1px solid #84363c;background:#2a1518;color:#ffd1d5;border-radius:13px;padding:12px;margin:10px 0}.critical-note strong{display:block;color:#ff9da5;margin-bottom:4px}.workflow-strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:3px}.workflow-step{flex:0 0 auto;border:1px solid #3a4652;background:#101419;color:#dce3e9;border-radius:999px;padding:8px 11px;font-size:11px;font-weight:850}.workflow-step.active{border-color:var(--green);background:#20320f;color:#cfffaa}.check-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.check-row input{width:21px;height:21px;accent-color:var(--green)}.mini-list{display:flex;flex-direction:column;gap:7px}.mini-item{background:#101419;border:1px solid var(--line);border-radius:11px;padding:10px}.flag-pill{display:inline-block;padding:4px 7px;border-radius:999px;background:#421a1e;color:#ffb8bf;font-size:11px;font-weight:900}.pin-pill{display:inline-block;padding:4px 7px;border-radius:999px;background:#28360f;color:#cfffaa;font-size:11px;font-weight:900}.due-pill{display:inline-block;padding:4px 7px;border-radius:999px;background:#4b3712;color:#ffd76a;font-size:11px;font-weight:900}.dispatch-board{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.dispatch-col{background:#101419;border:1px solid var(--line);border-radius:14px;padding:10px}.dispatch-col h3{font-size:13px;margin:0 0 8px}.dispatch-card{display:block;width:100%;text-align:left;border:1px solid #2f3944;background:#15191f;color:#fff;border-radius:10px;padding:9px;margin:7px 0}.photo-check{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}.photo-check div{border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;font-size:11px}.photo-check .done{border-color:#426926;background:#162310;color:#cfffaa}.voice-box{border:1px dashed #46515d;border-radius:12px;padding:11px;margin:8px 0}.yard-spot-big{font-size:24px;font-weight:900;color:#cfffaa}.history-row{border-left:3px solid #394552;padding:8px 10px;margin:7px 0;background:#101419;border-radius:0 10px 10px 0}.history-row .who{font-weight:850;color:#cfffaa}.shift-note{border:1px solid var(--line);border-radius:12px;padding:11px;margin:8px 0;background:#101419}.shift-note.urgent{border-color:#7d2d35}.shift-note.important{border-color:#6c5721}.today-section{margin-top:14px}.ops-toolbar{display:flex;gap:8px;flex-wrap:wrap}.ops-toolbar .btn{width:auto;flex:1;min-width:120px}.recent-strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:3px}.recent-card{flex:0 0 180px;border:1px solid var(--line);background:#101419;color:#fff;border-radius:12px;padding:10px;text-align:left}.reminder-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.inventory-boxes{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.inventory-boxes label{background:#101419;border:1px solid var(--line);border-radius:10px;padding:9px;display:flex;gap:8px;align-items:center}.inventory-boxes input{width:19px;height:19px;accent-color:var(--green)}

<body><main class="wrap"><div id="app"></div></main>
<script>
const BASE='https://ckonxzprnxqlefxscudt.supabase.co';
const KEY='sb_publishable_fQ-Cv2dhMlib6_16oh-WiQ_Ku96PhPp';
const SITE='https://ckonxzprnxqlefxscudt.supabase.co/functions/v1/towtag-live';
const AUTH_REDIRECT='https://damionv010-beep.github.io/';
const PUBLIC_TAG='https://damionv010-beep.github.io/public.html';
const INVOICE_BG='';
let session=null,user=null,staffMember=null,vehicles=[],photoRows=[],documentRows=[],agencyRows=[],billingProfiles=[],selected=null,movePhotoId=null;
const app=document.getElementById('app');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BRAND_HTML='<div class="brand-lockup"><div class="brand-icon">T</div><div class="brand-copy"><div class="brand-company">Mike’s Cascade Towing</div><div class="brand-towtag">Tow<b>Tag</b></div><div class="brand-powered">Yard Management</div></div></div>';

function saveSession(s){
  session=s;
  if(s){
    session.expires_at=Math.floor(Date.now()/1000)+(s.expires_in||3600);
    localStorage.setItem('towtag_session',JSON.stringify(session));
    user=s.user;
  }else{
    localStorage.removeItem('towtag_session'); user=null;
  }
}
async function ensureSession(){
  if(!session)return false;
  if((session.expires_at||0)>Math.floor(Date.now()/1000)+90)return true;
  if(!session.refresh_token){logout();return false}
  const r=await fetch(BASE+'/auth/v1/token?grant_type=refresh_token',{
    method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},
    body:JSON.stringify({refresh_token:session.refresh_token})
  });
  if(!r.ok){logout();return false}
  saveSession(await r.json()); return true;
}
async function api(path,opt={}){
  if(!await ensureSession())throw new Error('Sign in required');
  const r=await fetch(BASE+path,{...opt,headers:{apikey:KEY,Authorization:'Bearer '+session.access_token,...(opt.headers||{})}});
  const t=await r.text(); let d=null; try{d=t?JSON.parse(t):null}catch{d=t}
  if(!r.ok)throw new Error((d&&d.message)||(d&&d.error)||('Request failed '+r.status));
  return d;
}
function authBrand(){
  return BRAND_HTML+'<p class="muted">Vehicle records, invoices + QR tags</p>';
}
function togglePassword(id='pw',buttonId='showPw'){
  const el=document.getElementById(id),btn=document.getElementById(buttonId);
  if(!el)return;
  const showing=el.type==='text';
  el.type=showing?'password':'text';
  if(btn)btn.textContent=showing?'Show':'Hide';
}
function passwordField(id='pw',autocomplete='current-password'){
  return '<div style="position:relative"><input id="'+id+'" class="input" style="padding-right:78px" type="password" autocomplete="'+autocomplete+'"><button id="showPw" type="button" onclick="togglePassword(\''+id+'\',\'showPw\')" style="position:absolute;right:8px;top:10px;border:0;background:transparent;color:#8dff3f;font-weight:800;padding:10px">Show</button></div>';
}
function loginScreen(msg=''){
  const saved=localStorage.getItem('towtag_email')||'';
  app.innerHTML='<div style="padding-top:8vh">'+authBrand()+msg+
  '<div class="card"><div class="h1" style="font-size:22px;margin-top:0">Staff Sign In</div><p class="muted" style="margin-top:4px">TowTag keeps you signed in on this device.</p>'+
  '<label class="small muted">EMAIL</label><input id="email" name="email" class="input" type="email" autocomplete="username" autocapitalize="none" spellcheck="false" value="'+esc(saved)+'">'+
  '<label class="small muted">PASSWORD</label>'+passwordField('pw','current-password')+
  '<label class="toggle" style="margin:0 0 6px"><input id="rememberEmail" type="checkbox" '+(saved?'checked':'')+'> Remember my email</label>'+
  '<button class="btn" onclick="login()">Sign In</button><button class="btn secondary" onclick="createAccountScreen()">Create Staff Account</button>'+
  '<button class="link" style="width:100%;text-align:center;margin-top:8px" onclick="forgotPasswordScreen()">Forgot password?</button>'+
  '<p class="small muted" style="margin-bottom:0">New accounts need the Mike’s Cascade staff access code once.</p></div></div>';
  setTimeout(()=>{
    const e=document.getElementById('email'),p=document.getElementById('pw');
    if(saved&&p)p.focus(); else if(e)e.focus();
    if(p)p.addEventListener('keydown',ev=>{if(ev.key==='Enter')login()});
  },0);
}
async function login(){
  const e=(document.getElementById('email')?.value||'').trim().toLowerCase();
  const p=document.getElementById('pw')?.value||'';
  try{
    if(!e||!p)throw new Error('Enter your email and password.');
    const r=await fetch(BASE+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:e,password:p})});
    const d=await r.json();
    if(!r.ok){

function storageDayCount(v,endOverride=null){
  if(!v||!v.tow_date||v.record_type==='company_owned')return 0;

  if(Number.isNaN(start.getTime())||Number.isNaN(end.getTime()))return 0;
  const dayStart=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();
  const diff=Math.floor((dayStart(end)-dayStart(start))/86400000);
  return Math.max(1,diff+1);
}

  if(v.recovery_performed&&!(Number(v.recovery_minutes)>0))warnings.push('Recovery is marked, but recovery time is blank.');
  if(v.extra_labor&&!(Number(v.extra_labor_minutes)>0))warnings.push('Extra labor is marked, but labor time is blank.');
  if(v.hazmat_cleanup&&!v.cleanup_performed)warnings.push('Hazmat is marked; verify cleanup is also included on billing.');
  if(!v.invoice_number&&!v.invoice_data)warnings.push('No invoice has been saved to this vehicle yet.');
  const days=storageDayCount(v);
  const inv=v.invoice_data||{};
  if(days>1&&!inv.storage_charge)warnings.push(days+' calendar storage days are showing, but no storage charge is saved on the invoice.');
  return warnings;

    'Invoice: '+(v.invoice_number?'#'+v.invoice_number:(v.invoice_data?'Saved':'Not saved'))

    warnings.forEach(x=>lines.push('• '+x));

function agencyChargeSuggestions(v){

  const baseMap={wheel_lift:p.wheel_lift_base,wrecker:p.wrecker_base,medium_duty:p.medium_duty_base,flat_bed:p.flat_bed_base};
  const towing=n(baseMap[v.equipment_type]);
  const mileage=n(v.billable_miles)*n(p.mileage_rate);
  const labor=(n(v.recovery_minutes)/60)*n(p.recovery_hourly)+(n(v.scene_wait_minutes)/60)*n(p.scene_wait_hourly);
  const extra=(n(v.extra_labor_minutes)/60)*n(p.extra_labor_hourly);
  let special=0;
  if(v.used_dollies)special+=n(p.dollies_fee);

function applyAgencyChargeSuggestions(v,d){

  set('towing_charge',c.towing);set('mileage_charge',c.mileage);set('labor_charge',c.labor);set('extra_person_charge',c.extra);set('special_equipment_charge',c.special);set('storage_charge',c.storage);
  if(!d.storage_rate&&c.storage_rate)d.storage_rate=c.storage_rate.toFixed(2);
  const subtotal=['towing_charge','mileage_charge','labor_charge','extra_person_charge','special_equipment_charge','storage_charge'].reduce((sum,k)=>sum+(Number(String(d[k]||'').replace(/[$,]/g,''))||0),0);

const OFFLINE_QUEUE_KEY='towtag_offline_intakes';
function offlineIntakes(){try{return JSON.parse(localStorage.getItem(OFFLINE_QUEUE_KEY)||'[]')||[]}catch{return []}}
function setOfflineIntakes(rows){localStorage.setItem(OFFLINE_QUEUE_KEY,JSON.stringify(rows||[]))}
function looksOfflineError(e){return !navigator.onLine||/failed to fetch|load failed|network|offline|internet/i.test(String(e?.message||e||''))}
function queueOfflineIntake(body,agencyName){const q=offlineIntakes();q.push({id:'local-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),saved_at:new Date().toISOString(),agency_name:agencyName||'',body});setOfflineIntakes(q)}
async function syncOfflineIntakes(silent=false){
  const q=offlineIntakes();if(!q.length){if(!silent)alert('No saved offline intakes to sync.');return}
  if(!navigator.onLine){if(!silent)alert('TowTag is still offline. Try again when you have service.');return}
  const remaining=[];let synced=0;
  for(let i=0;i<q.length;i++){
    const item=q[i];
    try{
      const body={...(item.body||{})};
      if((body.record_type||'tow')!=='company_owned'&&!body.agency_id&&item.agency_name)body.agency_id=await resolveAgency(item.agency_name);
      await api('/rest/v1/vehicles',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify(body)});synced++;
    }catch(e){remaining.push(item,...q.slice(i+1));break}
  }
  setOfflineIntakes(remaining);
  try{await load();home()}catch{}
  if(!silent)alert(synced+' saved intake'+(synced===1?'':'s')+' synced.'+(remaining.length?' '+remaining.length+' still waiting.':''));
}
window.addEventListener('online',()=>{if(offlineIntakes().length)syncOfflineIntakes(true).catch(()=>{})});

function saveIntakeDraft(){

    if(!x.id)return;fields[x.id]={value:x.value,checked:!!x.checked,type:x.type};

function bindIntakeDraft(){
  const raw=localStorage.getItem('towtag_intake_draft');
  if(raw){
    try{
      const d=JSON.parse(raw),age=Date.now()-(d.savedAt||0);
      if(age<86400000){Object.entries(d.fields||{}).forEach(([id,x])=>{const e=el(id);if(!e)return;if(e.type==='checkbox')e.checked=!!x.checked;else e.value=x.value??'';});}
      else localStorage.removeItem('towtag_intake_draft');
    }catch{}
  }

async function saveVehicle(mode='open'){

      agency_id,impound_type,yard_location:record_type!=='company_owned'?(val('pickup')||null):null,tow_number:record_type!=='company_owned'?(val('towNumber').toUpperCase()||null):null,driver_name:record_type!=='company_owned'?(val('driverName')||null):null,hold_type,hold_notes:record_type!=='company_owned'?(val('holdNotes')||null):null,
      status:record_type!=='company_owned'?(val('intakeStatus')||suggestedStatus(record_type,impound_type,hold_type)):'other',condition_notes:val('conditionNotes')||null,property_notes:val('propertyNotes')||null,notes:val('notes')||null,created_by:user.id,
      owned_disposition,asking_price:record_type==='company_owned'&&ask?Number(ask):null,owned_notes:record_type==='company_owned'?(val('ownedNotes')||null):null,

    };
    if(record_type!=='company_owned'){
      localStorage.setItem('towtag_state',val('state').toUpperCase()||'OR');

    let rows;

async function copyVehicleInfo(){
  if(!selected)return;
  const v=selected,owned=v.record_type==='company_owned',agency=agencyForVehicle(v)?.name||'';
  const first=[title(v),v.color].filter(Boolean).join(' · ');
  const plate=[v.plate_state,v.plate].filter(Boolean).join(' ');
  const lines=[first];
  if(plate)lines.push('Plate: '+plate);
  if(v.vin)lines.push('VIN: '+v.vin);
  if(!owned){
    if(v.tow_number)lines.push('Tow / Case #: '+v.tow_number);
    if(agency)lines.push('Agency: '+agency);
    if(v.impound_type)lines.push('Reason: '+impoundLabel(v.impound_type));
    if(v.tow_date)lines.push('Brought in: '+(arrivalDateKnown(v)?new Date(v.tow_date).toLocaleString():'Unknown'));
    if(v.yard_location)lines.push('Picked up from: '+v.yard_location);
    if(v.status)lines.push('Status: '+statusLabel(v.status));
  }else{
    lines.push('Company Owned'+(v.owned_disposition?' · '+ownedLabel(v.owned_disposition):''));
  }
  const text=lines.filter(Boolean).join('\n');
  try{
    await navigator.clipboard.writeText(text);
    alert('Vehicle info copied.');
  }catch{
    const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();
    try{document.execCommand('copy');alert('Vehicle info copied.')}catch{prompt('Copy vehicle info:',text)}
    ta.remove();
  }
}

let releaseSignatureInk=false;
function initReleaseSignature(){
  const c=el('releaseSignatureCanvas'); if(!c)return;
  const ctx=c.getContext('2d'); ctx.lineWidth=3; ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#111';
  let drawing=false;
  const point=e=>{const r=c.getBoundingClientRect();return {x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}};
  c.onpointerdown=e=>{drawing=true;releaseSignatureInk=true;c.setPointerCapture?.(e.pointerId);const p=point(e);ctx.beginPath();ctx.moveTo(p.x,p.y);e.preventDefault()};
  c.onpointermove=e=>{if(!drawing)return;const p=point(e);ctx.lineTo(p.x,p.y);ctx.stroke();e.preventDefault()};
  c.onpointerup=c.onpointercancel=e=>{drawing=false;e.preventDefault()};
}
function clearReleaseSignature(){const c=el('releaseSignatureCanvas');if(!c)return;c.getContext('2d').clearRect(0,0,c.width,c.height);releaseSignatureInk=false}
function releaseSignatureData(){const c=el('releaseSignatureCanvas');return c&&releaseSignatureInk?c.toDataURL('image/png'):null}

  if(!selected)return;
  const name=val('releasedTo'); if(!name){alert('Enter who the vehicle is being released to.');return}
  if(!confirmBillingBeforeRelease(selected))return;
  const signature=releaseSignatureData();
  if(!signature&&!confirm('No release signature was captured. Release the vehicle anyway?'))return;
  const id=selected.id;
  try{
    const now=new Date().toISOString();
    const body={status:'released',release_at:now,released_to:name,release_id_checked:checked('releaseIdChecked'),release_authorized_by:val('releaseAuthorized')||null,release_notes:val('releaseNotes')||null,release_signature_data:signature,archived_at:now,archived_by:user.id};
    await api('/rest/v1/vehicles?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify(body)});
    await load(); detail(id); if(confirm('Vehicle released and moved to Archive.\n\nPrint the release receipt now?'))printReleaseReceipt();
  }catch(e){alert('Release failed: '+e.message)}
}

  const pad=n=>String(n).padStart(2,'0');

}
function invoiceTimeValue(value){

async function uploadVehicleDocuments(fileList){
  if(!selected)return; const files=Array.from(fileList||[]);if(!files.length)return;
  try{
    for(let i=0;i<files.length;i++){
      const file=files[i]; let ext=(file.name&&file.name.includes('.')?file.name.split('.').pop():'bin').toLowerCase().replace(/[^a-z0-9]/g,'')||'bin';
      const path=selected.id+'/'+Date.now()+'-'+i+'-'+Math.random().toString(36).slice(2,8)+'.'+ext;
      await api('/storage/v1/object/vehicle-documents/'+path,{method:'POST',headers:{'Content-Type':file.type||'application/octet-stream','x-upsert':'false'},body:file});
      await api('/rest/v1/vehicle_documents',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({vehicle_id:selected.id,storage_path:path,file_name:file.name||('Document.'+ext),content_type:file.type||null,document_type:val('documentType')||'other',notes:val('documentNotes')||null,uploaded_by:user.id})});
    }
    const id=selected.id;await load();selected=vehicles.find(v=>v.id===id);renderVehicleDocuments(id);alert(files.length===1?'Document attached.':files.length+' documents attached.');

}

    let u=r?.signedURL||r?.signedUrl||r?.signed_url||''; if(!u)throw new Error('Could not create document link.');

  if(!selected.deleted_at){alert('Move the vehicle to Trash before permanently deleting it.');return}

async function adminStaffCall(payload){
  if(!await ensureSession())throw new Error('Sign in required');
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);
  try{
    const r=await fetch(BASE+'/functions/v1/towtag-admin-staff',{method:'POST',signal:controller.signal,headers:{apikey:KEY,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json','Cache-Control':'no-store'},body:JSON.stringify(payload)});
    const text=await r.text();let d={};try{d=text?JSON.parse(text):{}}catch{throw new Error('Staff service returned an unreadable response.');}
    if(!r.ok)throw new Error(d.error||('Staff request failed ('+r.status+')'));
    return d;
  }catch(e){if(e?.name==='AbortError')throw new Error('Staff took too long to load. Tap Retry.');throw e}
  finally{clearTimeout(timer)}
}

function genericInvoiceSaved(v){
  const d=invoiceStored(v);
  const all=Array.isArray(d.generic_line_items)?d.generic_line_items:[];
  let lines=all.filter(x=>x&&x.kind!=='storage_auto'&&x.kind!=='deduction'&&((x.description||'').trim()||String(x.amount??'').trim()));
  let deductions=Array.isArray(d.generic_deductions)?d.generic_deductions.filter(x=>x&&((x.description||'').trim()||String(x.amount??'').trim())):all.filter(x=>x&&x.kind==='deduction').map(x=>({description:x.description||'',amount:Math.abs(genericMoney(x.amount)).toFixed(2)}));
  if(!lines.length){
    const legacy=[
      ['Tow / service',d.towing_charge],['Mileage',d.mileage_charge],['Labor',d.labor_charge],['Additional person',d.extra_person_charge],['Special equipment',d.special_equipment_charge]
    ];
    lines=legacy.filter(x=>Number(String(x[1]??'').replace(/[$,]/g,''))>0).map(x=>({description:x[0],amount:String(x[1])}));
  }
  if(!lines.length)lines=[{description:'',amount:''}];
  return {
    invoice_date:d.generic_invoice_date||invoiceDateValue(new Date()),
    customer_name:d.generic_customer_name||d.customer_name||d.requested_by||'',
    customer_phone:d.generic_customer_phone||d.customer_phone||'',

    waived_days:Math.max(0,Number(d.generic_storage_waived_days)||0),
    payments:Array.isArray(d.generic_payments)?d.generic_payments:[],

  };
}

function currentStorageCalc(){
  const days=selected?storageDayCount(selected):0;
  const rawWaived=Math.max(0,Math.floor(Number(val('genericWaivedStorageDays'))||0));
  const waived=Math.min(days,rawWaived);
  const billableDays=Math.max(0,days-waived);
  const rate=genericMoney(val('genericStorageRate'));
  return {days,waived,billableDays,rate,amount:billableDays*rate};
}
function recalcGenericInvoice(){
  const manual=[...document.querySelectorAll('.generic-amount')].reduce((sum,x)=>sum+genericMoney(x.value),0);
  const deductions=[...document.querySelectorAll('.generic-deduction-amount')].reduce((sum,x)=>sum+Math.abs(genericMoney(x.value)),0);
  const storage=currentStorageCalc();
  const charges=manual+storage.amount;
  const subtotal=Math.max(0,charges-deductions);
  const tax=genericMoney(val('genericTax'));
  if(el('genericStorageAmount'))el('genericStorageAmount').textContent=money(storage.amount);
  if(el('genericStorageSummary'))el('genericStorageSummary').textContent=storage.days+' calendar day'+(storage.days===1?'':'s')+' · '+storage.waived+' waived · '+storage.billableDays+' billable × '+money(storage.rate)+'/day';
  if(el('genericStorageBillable'))el('genericStorageBillable').textContent=storage.billableDays;
  if(el('genericChargesSubtotal'))el('genericChargesSubtotal').textContent=money(charges);
  if(el('genericDeductionsTotal'))el('genericDeductionsTotal').textContent='−'+money(deductions);
  if(el('genericSubtotal'))el('genericSubtotal').textContent=money(subtotal);
  if(el('genericTotal'))el('genericTotal').textContent=money(Math.max(0,subtotal+tax));
}
function collectGenericInvoice(){
  const chargeLines=[...document.querySelectorAll('#genericInvoiceLines .generic-invoice-line')].map(row=>({description:row.querySelector('.generic-desc')?.value?.trim()||'',amount:row.querySelector('.generic-amount')?.value?.trim()||''})).filter(x=>x.description||x.amount);
  const deductions=[...document.querySelectorAll('#genericDeductions .generic-deduction-line')].map(row=>({description:row.querySelector('.generic-deduction-desc')?.value?.trim()||'Credit / Discount',amount:Math.abs(genericMoney(row.querySelector('.generic-deduction-amount')?.value)).toFixed(2)})).filter(x=>x.description||genericMoney(x.amount)>0);
  const lines=[...chargeLines];
  const storage=currentStorageCalc();
  if(storage.days>0&&storage.rate>0){
    const waiverText=storage.waived?' ('+storage.waived+' waived)':'';
    lines.push({kind:'storage_auto',description:'Storage — '+storage.billableDays+' billable day'+(storage.billableDays===1?'':'s')+waiverText+' @ '+money(storage.rate)+'/day',amount:storage.amount.toFixed(2)});
    try{localStorage.setItem('towtag_storage_daily_rate',storage.rate.toFixed(2))}catch{}
  }
  deductions.filter(x=>genericMoney(x.amount)>0).forEach(x=>lines.push({kind:'deduction',description:x.description||'Credit / Discount',amount:(-Math.abs(genericMoney(x.amount))).toFixed(2)}));
  const charges=lines.filter(x=>x.kind!=='deduction').reduce((sum,x)=>sum+genericMoney(x.amount),0);
  const deductionTotal=deductions.reduce((sum,x)=>sum+Math.abs(genericMoney(x.amount)),0);
  const subtotal=Math.max(0,charges-deductionTotal),tax=genericMoney(val('genericTax')),total=Math.max(0,subtotal+tax);
  return {
    generic_invoice:true,
    generic_invoice_date:val('genericInvoiceDate')||'',
    generic_customer_name:val('genericCustomerName')||'',
    generic_customer_phone:val('genericCustomerPhone')||'',
    generic_customer_address:val('genericCustomerAddress')||'',
    generic_line_items:lines,
    generic_deductions:deductions,
    generic_deductions_total:deductionTotal.toFixed(2),
    generic_charges_subtotal:charges.toFixed(2),
    generic_storage_days:storage.days,
    generic_storage_waived_days:storage.waived,
    generic_storage_billable_days:storage.billableDays,
    generic_storage_daily_rate:storage.rate.toFixed(2),
    generic_storage_amount:storage.amount.toFixed(2),
    storage_rate:storage.rate.toFixed(2),
    storage_charge:storage.amount.toFixed(2),
    generic_notes:val('genericNotes')||'',
    generic_tax:tax.toFixed(2),
    subtotal:subtotal.toFixed(2),
    tax:tax.toFixed(2),
    total:total.toFixed(2)
  };
}

function daysSince(value){
  if(!value)return 0;
  const d=new Date(value);if(Number.isNaN(d.getTime()))return 0;
  return Math.max(0,Math.floor((Date.now()-d.getTime())/86400000));
}
function agingReasons(v){
  if(!v||v.deleted_at||v.archived_at||v.release_at||v.status==='released')return [];
  const age=daysSince(v.tow_date),reasons=[];
  if(age>=60)reasons.push({label:'60+ days in yard',urgent:true});
  else if(age>=30)reasons.push({label:'30+ days in yard',urgent:true});
  else if(age>=15)reasons.push({label:'15+ days in yard',urgent:false});
  if(age>=7&&v.status==='awaiting_insurance')reasons.push({label:'Awaiting insurance '+age+'d',urgent:false});
  if(age>=7&&v.status==='awaiting_pickup')reasons.push({label:'Awaiting pickup '+age+'d',urgent:false});
  const ld=lienData(v),eligible=ld.eligible_action_date?new Date(ld.eligible_action_date+'T12:00:00'):null;
  if(eligible&&!Number.isNaN(eligible.getTime())&&ld.status!=='completed'&&ld.status!=='stopped'){
    const delta=Math.ceil((eligible.getTime()-Date.now())/86400000);
    if(delta<0)reasons.push({label:'Lien action date passed',urgent:true});
    else if(delta===0)reasons.push({label:'Lien action date today',urgent:true});
    else if(delta<=7)reasons.push({label:'Lien action date in '+delta+'d',urgent:false});
  }
  return reasons;
}
function agingAlertVehicles(){
  return vehicles.filter(v=>agingReasons(v).length).sort((a,b)=>daysSince(b.tow_date)-daysSince(a.tow_date));
}
function agingAlertsScreen(){
  selected=null;
  const rows=agingAlertVehicles(),old30=rows.filter(v=>daysSince(v.tow_date)>=30).length,old60=rows.filter(v=>daysSince(v.tow_date)>=60).length,lienDue=rows.filter(v=>agingReasons(v).some(x=>/Lien/.test(x.label))).length;
  const cards=rows.map(v=>{
    const reasons=agingReasons(v),age=daysSince(v.tow_date);
    return '<button class="vehicle" onclick="detail(\''+v.id+'\')"><h3>'+esc(title(v))+'</h3><div class="muted">'+esc(recordLabel(v.record_type||'tow'))+' · '+esc(v.record_type==='company_owned'?ownedLabel(v.owned_disposition):statusLabel(v.status))+' · '+age+' days</div><div class="alert-tags">'+reasons.map(r=>'<span class="alert-tag '+(r.urgent?'urgent':'')+'">'+esc(r.label)+'</span>').join('')+'</div></button>';
  }).join('');
  app.innerHTML='<button class="link" onclick="home()">‹ Dashboard</button><div class="h1">Aging Alerts</div><p class="muted">Vehicles that have been in the yard a while or have a lien date approaching.</p><div class="alert-summary"><div class="stat"><strong>'+rows.length+'</strong><span>ALERT VEHICLES</span></div><div class="stat"><strong>'+old30+'</strong><span>30+ DAYS</span></div><div class="stat"><strong>'+lienDue+'</strong><span>LIEN DATES</span></div></div>'+(old60?'<div class="notice"><strong>'+old60+'</strong> vehicle'+(old60===1?' is':'s are')+' at 60+ days.</div>':'')+'<div style="margin-top:12px">'+(cards||'<div class="card muted">No aging alerts right now.</div>')+'</div>';
}

function opsData(v){
  return v&&v.ops_data&&typeof v.ops_data==='object'&&!Array.isArray(v.ops_data)?v.ops_data:{};
}
function withoutHistory(o){const x={...(o||{})};delete x.change_history;return x;}
function vehicleSnapshot(v){
  if(!v)return {};
  const keys=['year','make','model','color','plate','plate_state','vin','status','yard_location','notes','impound_type','tow_number','driver_name','odometer','keys_status','yard_spot','condition_notes','property_notes','hold_type','hold_notes','release_at','released_to','release_id_checked','release_authorized_by','release_notes','record_type','owned_disposition','asking_price','disposition_amount','disposition_completed_at','owned_notes','equipment_type','used_dollies','recovery_performed','recovery_minutes','winching_performed','cleanup_performed','hazmat_cleanup','extra_labor','extra_labor_minutes','after_hours','scene_wait_minutes','billable_miles','other_billable_work','billing_notes','invoice_number','invoice_data','invoice_updated_at','archived_at','archived_by','deleted_at','deleted_by','lien_data','damage_data'];
  const out={};keys.forEach(k=>out[k]=v[k]);out.ops_data=withoutHistory(opsData(v));return out;
}
function describePatch(p){
  const keys=Object.keys(p||{});
  if(keys.includes('release_at'))return p.release_at?'Vehicle released':'Vehicle release changed';
  if(keys.includes('status'))return 'Status changed';
  if(keys.includes('invoice_data'))return 'Invoice or payment updated';
  if(keys.includes('damage_data'))return 'Damage diagram updated';
  if(keys.includes('lien_data'))return 'Lien tracker updated';
  if(keys.includes('archived_at'))return p.archived_at?'Vehicle archived':'Vehicle restored from archive';
  if(keys.includes('deleted_at'))return p.deleted_at?'Vehicle moved to Trash':'Vehicle restored from Trash';
  if(keys.length===1&&keys[0]==='ops_data')return 'Daily operations updated';
  return 'Vehicle information updated';
}
api=async function(path,opt={}){
  const method=String(opt.method||'GET').toUpperCase();
  if(method==='PATCH'&&/^\/rest\/v1\/vehicles\?id=eq\./.test(path)&&typeof opt.body==='string'){
    try{
      const id=decodeURIComponent((path.match(/id=eq\.([^&]+)/)||[])[1]||'');
      if(id){
        const fresh=await _towtagCoreApi('/rest/v1/vehicles?select=*&id=eq.'+encodeURIComponent(id));
        const current=fresh?.[0];
        if(current){
          const patch=JSON.parse(opt.body||'{}');
          const currentOps=opsData(current),prior=Array.isArray(currentOps.change_history)?currentOps.change_history:[];
          const entry={id:'hist_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,6),at:new Date().toISOString(),by:user?.id||null,by_name:staffMember?.display_name||user?.email||'Staff',description:describePatch(patch),snapshot:vehicleSnapshot(current)};
          const patchOps=patch.ops_data&&typeof patch.ops_data==='object'&&!Array.isArray(patch.ops_data)?patch.ops_data:{};
          patch.ops_data={...currentOps,...patchOps,change_history:[...prior.slice(-19),entry]};
          opt={...opt,body:JSON.stringify(patch)};
        }
      }
    }catch(e){console.warn('TowTag history capture skipped',e)}
  }
  if(method==='POST'&&path==='/rest/v1/vehicles'&&typeof opt.body==='string'){
    try{
      const body=JSON.parse(opt.body||'{}');
      if(el('intakeYardSpot'))body.yard_spot=val('intakeYardSpot')||body.yard_spot||null;
      body.ops_data={...captureIntakeOps(),...(body.ops_data||{})};
      opt={...opt,body:JSON.stringify(body)};
    }catch{}
  }
  return _towtagCoreApi(path,opt);
};

async function patchVehicleOps(v,partial,description='Daily operations updated',rerender=true){

  const live=vehicles.find(x=>x.id===v.id)||v;

  await api('/rest/v1/vehicles?id=eq.'+encodeURIComponent(v.id),{method:'PATCH',headers:{'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify({ops_data:next})});

}

function dispatchLabel(v){const s=opsData(v).dispatch_state||((v.release_at||v.archived_at)?'complete':'at_yard');return DISPATCH_STATES.find(x=>x[0]===s)?.[1]||'At Yard';}

function todayDateKey(d=new Date()){const pad=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function isToday(value){if(!value)return false;const d=new Date(value);return !Number.isNaN(d.getTime())&&todayDateKey(d)===todayDateKey();}
function dueReminders(v){return (opsData(v).reminders||[]).filter(r=>!r.done&&r.due&&new Date(r.due).getTime()<=Date.now());}
function releaseChecklist(v){return {...(opsData(v).release_checklist||{})};}
function releaseChecklistMissing(v){
  const c=releaseChecklist(v),missing=[];
  if(!c.id_ready)missing.push('ID ready / verified');
  if(v.hold_type&&v.hold_type!=='none'&&!c.hold_cleared)missing.push('Hold cleared');
  if(notificationBalance(v)>0&&!c.payment_handled)missing.push('Payment handled');
  if(!c.property_returned)missing.push('Personal property handled');
  if(v.keys_status==='received'&&!c.keys_returned)missing.push('Keys returned');
  if(!c.signature_ready)missing.push('Release signature ready');
  return missing;
}
function dailyAttentionReasons(v){
  if(!v||v.deleted_at||v.archived_at)return [];
  const reasons=[],o=opsData(v),photos=standardPhotoProgress(v);
  if(o.problem_flag)reasons.push('Problem flag');
  if(o.critical_note)reasons.push('Critical note');
  if(!v.yard_spot)reasons.push('No yard spot');
  if(!v.vin&&!v.plate)reasons.push('Missing VIN / plate');
  if(photos.done<photos.total)reasons.push('Photos '+photos.done+'/'+photos.total);
  if(v.hold_type&&v.hold_type!=='none')reasons.push(holdLabel(v.hold_type));
  if((opsData(v).dispatch_state||'at_yard')==='ready_release'&&releaseChecklistMissing(v).length)reasons.push('Release checklist incomplete');
  dueReminders(v).forEach(()=>reasons.push('Reminder due'));
  agingReasons(v).forEach(r=>reasons.push(r.label));
  return [...new Set(reasons)];
}

}

function generateTowNumber(){
  const day=todayDateKey().replace(/-/g,''),prefix='MC-'+day+'-';let max=0;
  vehicles.forEach(v=>{const x=String(v.tow_number||'').toUpperCase();if(x.startsWith(prefix)){const n=Number(x.slice(prefix.length));if(Number.isFinite(n))max=Math.max(max,n);}});
  return prefix+String(max+1).padStart(3,'0');
}

function generateJobNumber(){

}

function applyVoiceIntake(text){

function loadTesseract(){

function plateCandidateFromText(raw){
  const lines=String(raw||'').toUpperCase().split(/\n+/).map(x=>x.replace(/[^A-Z0-9]/g,'')).filter(x=>x.length>=2&&x.length<=8);
  const bad=new Set(['OREGON','WASHINGTON','CALIFORNIA','IDAHO','NEVADA','MONTANA','TRAILER','PERMANENT']);
  return lines.find(x=>!bad.has(x)&&/[0-9]/.test(x))||lines.find(x=>!bad.has(x))||'';
}

  app.innerHTML='<button class="link" onclick="home()">‹ Dashboard</button><div class="h1">Dispatch / To-Do</div><p class="muted">Move vehicles through the day without changing their legal TowTag status.</p><div class="dispatch-board">'+DISPATCH_STATES.slice(0,5).map(s=>'<div class="dispatch-col"><h3>'+esc(s[1])+' · '+byState[s[0]].length+'</h3>'+byState[s[0]].map(v=>'<button class="dispatch-card" onclick="detail(\''+v.id+'\')"><b>'+esc(title(v))+'</b><div class="small muted">'+esc(v.plate||'No plate')+(v.yard_spot?' · '+esc(v.yard_spot):'')+'</div></button>').join('')+'</div>').join('')+'</div>';
}
function yardSpotFinder(){selected=null;app.innerHTML='<button class="link" onclick="home()">‹ Dashboard</button><div class="h1">Yard Spot Finder</div><input id="yardFind" class="input" type="search" placeholder="Plate, VIN, vehicle, yard spot…" oninput="renderYardFinder()"><div id="yardFindRows"></div>';renderYardFinder();}
function renderYardFinder(){const q=(val('yardFind')||'').toLowerCase();const rows=activeYardVehicles().filter(v=>!q||vehicleSearchText(v).includes(q)||String(v.yard_spot||'').toLowerCase().includes(q)||JSON.stringify(opsData(v)).toLowerCase().includes(q));el('yardFindRows').innerHTML=rows.map(v=>'<button class="vehicle" onclick="detail(\''+v.id+'\')"><h3>'+esc(title(v))+'</h3><div class="yard-spot-big">'+esc(v.yard_spot||'NO SPOT')+'</div><div class="small muted">'+esc(v.plate||v.vin||'No plate / VIN')+'</div></button>').join('')||'<div class="card muted">No matches.</div>';}
function needsAttentionScreen(){selected=null;const rows=activeYardVehicles().filter(v=>dailyAttentionReasons(v).length).sort((a,b)=>dailyAttentionReasons(b).length-dailyAttentionReasons(a).length);app.innerHTML='<button class="link" onclick="home()">‹ Dashboard</button><div class="h1">Needs Attention</div><p class="muted">Missing info, problem flags, holds, due reminders, incomplete photos, release prep, or aging items.</p>'+rows.map(v=>'<button class="vehicle attention-item" onclick="detail(\''+v.id+'\')"><h3>'+esc(title(v))+'</h3><div class="small muted">'+esc(v.plate||'No plate')+(v.yard_spot?' · '+esc(v.yard_spot):'')+'</div><div class="reason">'+dailyAttentionReasons(v).map(esc).join(' · ')+'</div></button>').join('')||'<div class="card muted">Nothing needs attention right now.</div>';}
function holdDashboard(){selected=null;const rows=activeYardVehicles().filter(v=>v.hold_type&&v.hold_type!=='none');app.innerHTML='<button class="link" onclick="home()">‹ Dashboard</button><div class="h1">Hold Dashboard</div><p class="muted">Every active hold in one place.</p>'+rows.map(v=>'<button class="vehicle" onclick="detail(\''+v.id+'\')"><h3>'+esc(title(v))+'</h3><div><span class="flag-pill">'+esc(holdLabel(v.hold_type))+'</span></div><div class="small" style="margin-top:7px">'+esc(v.hold_notes||'No hold notes')+'</div><div class="small muted">'+esc(v.plate||'No plate')+(v.yard_spot?' · '+esc(v.yard_spot):'')+'</div></button>').join('')||'<div class="card muted">No active holds.</div>';}
function todayDashboard(){
  selected=null;const active=activeYardVehicles(),ins=vehicles.filter(v=>isToday(v.tow_date)),outs=vehicles.filter(v=>isToday(v.release_at)),due=active.filter(v=>dueReminders(v).length),payments=[];vehicles.forEach(v=>savedInvoicePayments(v).filter(p=>p.date===todayDateKey()).forEach(p=>payments.push({v,p})));const paid=payments.reduce((s,x)=>s+genericMoney(x.p.amount),0);
  app.innerHTML='<button class="link" onclick="home()">‹ Dashboard</button><div class="h1">Today</div><div class="ops-stat-grid"><div class="ops-stat"><strong>'+ins.length+'</strong><span>VEHICLES IN</span></div><div class="ops-stat"><strong>'+outs.length+'</strong><span>RELEASED</span></div><div class="ops-stat"><strong>'+due.length+'</strong><span>REMINDERS DUE</span></div><div class="ops-stat"><strong>'+esc(money(paid))+'</strong><span>PAYMENTS</span></div></div><div class="today-section"><div class="small muted">IN TODAY</div>'+ins.map(v=>'<button class="vehicle" onclick="detail(\''+v.id+'\')">'+esc(title(v))+' · '+esc(v.plate||'No plate')+'</button>').join('')+'</div><div class="today-section"><div class="small muted">OUT TODAY</div>'+outs.map(v=>'<button class="vehicle" onclick="detail(\''+v.id+'\')">'+esc(title(v))+' · '+esc(v.released_to||'Released')+'</button>').join('')+'</div>';
}
function dailyCloseout(){
  selected=null;const active=activeYardVehicles(),ins=vehicles.filter(v=>isToday(v.tow_date)),outs=vehicles.filter(v=>isToday(v.release_at)),needs=active.filter(v=>dailyAttentionReasons(v).length),holds=active.filter(v=>v.hold_type&&v.hold_type!=='none'),pending=active.filter(v=>(opsData(v).dispatch_state||'at_yard')!=='complete');let paid=0;vehicles.forEach(v=>savedInvoicePayments(v).filter(p=>p.date===todayDateKey()).forEach(p=>paid+=genericMoney(p.amount)));
  app.innerHTML='<button class="link" onclick="home()">‹ Dashboard</button><div class="h1">Daily Closeout</div><div class="card"><div class="kv"><div><span>Vehicles in</span>'+ins.length+'</div><div><span>Vehicles released</span>'+outs.length+'</div><div><span>Payments recorded</span>'+money(paid)+'</div><div><span>Active holds</span>'+holds.length+'</div><div><span>Need attention</span>'+needs.length+'</div><div><span>Open workflow items</span>'+pending.length+'</div></div><button class="btn secondary" onclick="printDailyCloseout()">Print / Save Closeout</button></div>'+shiftNotesHomeHtml()+(needs.length?'<div class="card"><div class="small muted">CARRY TO NEXT SHIFT</div>'+needs.slice(0,12).map(v=>'<button class="vehicle" onclick="detail(\''+v.id+'\')"><b>'+esc(title(v))+'</b><div class="small muted">'+dailyAttentionReasons(v).map(esc).join(' · ')+'</div></button>').join('')+'</div>':'');
}
function printDailyCloseout(){const html=app.innerHTML;const w=window.open('','_blank');if(!w)return;w.document.write('<!doctype html><title>TowTag Daily Closeout</title><style>body{font-family:Arial;padding:24px}button,input{display:none}.card,.vehicle{border:1px solid #ccc;padding:10px;margin:8px 0;border-radius:8px}.muted,.small{color:#555}.ops-stat-grid,.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}</style><h1>Mike’s Cascade Towing — Daily Closeout</h1><div>'+esc(new Date().toLocaleString())+'</div>'+html);w.document.close();setTimeout(()=>w.print(),250);}
function shiftNotesScreen(){selected=null;const rows=openShiftNotes();app.innerHTML='<button class="link" onclick="home()">‹ Dashboard</button><div class="h1">Shift Notes</div><p class="muted">Vehicle handoff notes that are still open.</p>'+rows.map(x=>'<button class="vehicle" onclick="detail(\''+x.v.id+'\')"><h3>'+esc(title(x.v))+'</h3><div>'+esc(x.n.text||'')+'</div><div class="small muted">'+esc(x.n.by_name||'Staff')+' · '+esc(new Date(x.n.at).toLocaleString())+'</div></button>').join('')||'<div class="card muted">No open shift notes.</div>';}
function morningYardCheck(){selected=null;const rows=activeYardVehicles(),today=todayDateKey(),checkedRows=rows.filter(v=>String(opsData(v).yard_check?.date||'')===today);app.innerHTML='<button class="link" onclick="home()">‹ Dashboard</button><div class="h1">Morning Yard Check</div><p class="muted">'+checkedRows.length+' of '+rows.length+' vehicles checked today.</p>'+rows.map(v=>{const c=opsData(v).yard_check||{},done=c.date===today;return '<div class="card"><b>'+esc(title(v))+'</b><div class="small muted">'+esc(v.plate||'No plate')+' · '+esc(v.yard_spot||'NO YARD SPOT')+'</div>'+(done?'<div class="notice">Checked: '+esc(c.status||'Still here')+' · '+esc(c.by_name||'Staff')+'</div>':'<div class="ops-grid"><button class="btn secondary" onclick="markYardCheck(\''+v.id+'\',\'Still here\')">Still Here</button><button class="btn secondary" onclick="markYardCheck(\''+v.id+'\',\'Moved\')">Moved</button><button class="btn danger ops-wide" onclick="markYardCheck(\''+v.id+'\',\'Issue found\')">Issue Found</button></div>')+'</div>';}).join('')+'</div>';}
async function markYardCheck(id,status){const v=vehicles.find(x=>x.id===id);if(!v)return;let note='';if(status==='Moved')note=prompt('New yard spot (optional):',v.yard_spot||'')||'';if(status==='Issue found')note=prompt('What issue did you find?','')||'';const partial={yard_check:{date:todayDateKey(),at:new Date().toISOString(),status,note,by_name:staffMember?.display_name||'Staff'},problem_flag:status==='Issue found'?true:opsData(v).problem_flag,problem_flag_note:status==='Issue found'?note:opsData(v).problem_flag_note};if(status==='Moved'&&note){await api('/rest/v1/vehicles?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify({yard_spot:note,ops_data:{...opsData(v),...partial}})});await logOpsActivity(id,'yard_check','Morning yard check: moved to '+note);await load();morningYardCheck();return}await patchVehicleOps(v,partial,'Morning yard check: '+status,false);morningYardCheck();}
function printYardInventoryChecklist(){
  const rows=activeYardVehicles();
  const body=rows.map(v=>'<tr><td class="check">☐</td><td>'+esc(v.yard_spot||'—')+'</td><td>'+esc(title(v))+'</td><td>'+esc(v.plate||'—')+'</td><td>'+esc(dispatchLabel(v))+'</td><td>'+esc(holdLabel(v.hold_type))+'</td></tr>').join('');
  const shareText=['Mike’s Cascade Towing — Yard Inventory',new Date().toLocaleString(),''].concat(rows.map(v=>[v.yard_spot||'—',title(v),v.plate||'—',dispatchLabel(v),holdLabel(v.hold_type)].join(' | '))).join('\n');
  const w=window.open('','_blank');
  if(!w){alert('Allow pop-ups to open the yard checklist.');return}
  const safeShare=JSON.stringify(shareText).replace(/</g,'\u003c');
  const html='<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yard Inventory Checklist</title><style>*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;margin:0;background:#f3f4f6;color:#111}.toolbar{position:sticky;top:0;z-index:20;display:flex;gap:9px;justify-content:center;align-items:center;padding:10px;background:#111}.toolbar button{border:0;border-radius:999px;padding:11px 16px;font-weight:800;font-size:14px}.toolbar .back{background:#333;color:#fff}.toolbar .print{background:#76ff03;color:#071003}.toolbar .share{background:#fff;color:#111}.sheet{max-width:980px;margin:0 auto;background:#fff;padding:24px}h1{font-size:25px;margin:0 0 12px}.date{font-size:12px;margin-bottom:4px}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid #ccc;padding:9px;text-align:left;font-size:13px}th{background:#eee}.check{font-size:20px;width:60px}@media(max-width:650px){.sheet{padding:16px 10px}th,td{padding:8px 5px;font-size:11px}h1{font-size:20px}.toolbar button{padding:10px 13px}}@media print{.toolbar{display:none}body{background:#fff}.sheet{max-width:none;padding:0}}</style></head><body><div class="toolbar"><button class="back" onclick="if(window.opener&&!window.opener.closed){window.opener.focus();window.close()}else{history.back()}">‹ Back to TowTag</button><button class="print" onclick="window.print()">Print / Save PDF</button><button class="share" onclick="shareYardInventory()">Share</button></div><div class="sheet"><h1>Mike’s Cascade Towing — Yard Inventory</h1><div class="date">'+esc(new Date().toLocaleString())+'</div><table><thead><tr><th>Check</th><th>Spot</th><th>Vehicle</th><th>Plate</th><th>Workflow</th><th>Hold</th></tr></thead><tbody>'+body+'</tbody></table></div><script>const yardShareText='+safeShare+';async function shareYardInventory(){try{if(navigator.share){await navigator.share({title:"Mike’s Cascade Towing — Yard Inventory",text:yardShareText});return}if(navigator.clipboard){await navigator.clipboard.writeText(yardShareText);alert("Yard inventory copied. Paste it into Messages, Mail, or Notes.");return}prompt("Copy yard inventory:",yardShareText)}catch(e){if(e&&e.name!=="AbortError")alert("Could not share this checklist.")}}<\/script></body></html>';
  w.document.open();w.document.write(html);w.document.close();
}

function suggestedChargeDescriptions(v){
  if(!v||v.record_type==='company_owned')return [];
  const x=['Tow / service'];if(v.used_dollies)x.push('Dollies');if(v.winching_performed)x.push('Winching');if(v.recovery_performed)x.push('Recovery'+(v.recovery_minutes?' — '+v.recovery_minutes+' min':''));if(v.cleanup_performed)x.push(v.hazmat_cleanup?'Hazmat / absorbent cleanup':'Scene cleanup');if(v.extra_labor)x.push('Extra labor'+(v.extra_labor_minutes?' — '+v.extra_labor_minutes+' min':''));if(v.after_hours)x.push('After-hours service');if(Number(v.scene_wait_minutes)>0)x.push('Scene wait — '+v.scene_wait_minutes+' min');if(Number(v.billable_miles)>0)x.push('Mileage — '+v.billable_miles+' mi');return x;
}
billingCard=function(v){const base=_baseBillingCardDailyOps(v),suggestions=suggestedChargeDescriptions(v);return base+(suggestions.length?'<div class="card"><div class="small muted">CHARGE SUGGESTIONS</div><p class="small muted">TowTag spotted work that may need to be billed. It does not invent prices.</p>'+suggestions.map(x=>'<div style="padding:7px 0;border-bottom:1px solid var(--line)">☐ '+esc(x)+'</div>').join('')+'</div>':'');};
invoiceForm=async function(){await _baseInvoiceFormDailyOps();setTimeout(()=>{const box=el('genericInvoiceLines')?.parentElement;if(box&&!el('addSuggestedChargesBtn')){const b=document.createElement('button');b.id='addSuggestedChargesBtn';b.type='button';b.className='btn secondary';b.textContent='Add Suggested Charge Lines';b.onclick=addSuggestedInvoiceLines;box.appendChild(b)}const ph=el('genericCustomerPhone');if(ph&&!ph.value&&selected)ph.value=opsData(selected).customer_phone||'';},0);};
function addSuggestedInvoiceLines(){if(!selected)return;const existing=new Set([...document.querySelectorAll('.generic-desc')].map(x=>x.value.trim().toLowerCase()));suggestedChargeDescriptions(selected).forEach(d=>{if(!existing.has(d.toLowerCase()))addGenericInvoiceLine({description:d,amount:''})});recalcGenericInvoice();}

releaseVehicle=async function(){
  if(selected){const missing=releaseChecklistMissing(selected);if(missing.length&&!confirm('Release checklist is not complete:\n\n• '+missing.join('\n• ')+'\n\nContinue to release anyway?'))return;}
  return _baseReleaseVehicleDailyOps();
};
customerNotificationScreen=function(){_baseCustomerNotificationScreenDailyOps();setTimeout(()=>{if(selected&&el('notifyPhone')&&!el('notifyPhone').value)el('notifyPhone').value=opsData(selected).customer_phone||invoiceStored(selected).generic_customer_phone||'';},0);};
const _baseOpenCustomerMessageDailyOps=openCustomerMessage;
openCustomerMessage=function(){if(selected){const phone=(val('notifyPhone')||'').trim();if(phone&&phone!==opsData(selected).customer_phone){patchVehicleOps(selected,{customer_phone:phone},'Customer phone updated',false).catch(()=>{});}const arr=Array.isArray(opsData(selected).call_log)?opsData(selected).call_log.slice():[];arr.push({id:'msg_'+Date.now().toString(36),type:'Text message prepared',note:(val('notifyTemplate')||'status')+' template',at:new Date().toISOString(),by_name:staffMember?.display_name||'Staff'});patchVehicleOps(selected,{call_log:arr.slice(-50)},'Customer text message prepared',false).catch(()=>{});}return _baseOpenCustomerMessageDailyOps();};

lienTrackerCard=function(v){const base=_baseLienTrackerCardDailyOps(v),l=lienData(v);if(!l?.eligible_action_date)return base;const d=new Date(l.eligible_action_date+'T12:00:00'),delta=Math.ceil((d.getTime()-Date.now())/86400000);return base+'<div class="card"><div class="small muted">LIEN COUNTDOWN</div><div class="h1" style="margin-top:5px">'+(delta>0?delta+' day'+(delta===1?'':'s'):delta===0?'TODAY':Math.abs(delta)+' days past')+'</div><div class="muted">Eligible action date: '+esc(l.eligible_action_date)+'</div></div>';};

loadActivity=async function(id){
  const target=el('activity');if(!target)return;
  try{const rows=await api('/rest/v1/vehicle_activity?select=event_type,description,actor_name,created_by,created_at&vehicle_id=eq.'+encodeURIComponent(id)+'&order=created_at.desc&limit=75');target.innerHTML=(rows||[]).map(r=>'<div style="padding:10px 0;border-bottom:1px solid var(--line)"><div>'+(r.actor_name?'<b>'+esc(r.actor_name)+'</b> — ':'')+esc(r.description)+'</div><div class="small muted" style="margin-top:3px">'+esc(new Date(r.created_at).toLocaleString())+'</div></div>').join('')||'<div class="muted">No activity recorded yet.</div>';}catch(e){target.innerHTML='<div class="error">History failed to load: '+esc(e.message)+'</div>'}
};

// ================== End Daily Ops Suite ==================

const tag=new URLSearchParams(location.search).get('tag');
if(passwordRecoveryFromUrl()){recoveryPasswordScreen()}
else if(tag){publicView(tag)}
else{
  try{
    session=JSON.parse(localStorage.getItem('towtag_session')||'null');
    if(session){user=session.user;boot()}else loginScreen()
  }catch{loginScreen()}
}

<script>
function arrivalDateKnown(v){
  if(!v)return true;
  const d=(typeof opsData==='function')?opsData(v):(v.ops_data&&typeof v.ops_data==='object'?v.ops_data:{});
  return d.intake_date_known!==false;
}
function arrivalDateText(v){
  if(!arrivalDateKnown(v)||!v?.tow_date)return 'Unknown';
  const d=new Date(v.tow_date);
  return Number.isNaN(d.getTime())?'Unknown':d.toLocaleString();
}
function localNowForInput(){return localDateTimeValue(new Date().toISOString());}
function toggleIntakeArrivalDate(){
  const unknown=checked('arrivalUnknown'),input=el('arrivalDate');
  if(!input)return;
  input.disabled=unknown;input.style.opacity=unknown?'.5':'1';
  if(!unknown&&!input.value)input.value=localNowForInput();
}
function toggleEditArrivalDate(){
  const unknown=checked('editArrivalUnknown'),input=el('editArrivalDate');
  if(!input)return;
  input.disabled=unknown;input.style.opacity=unknown?'.5':'1';
  if(!unknown&&!input.value)input.value=localNowForInput();
}
function intakeArrivalCard(){
  return '<div class="card arrival-date-card"><div class="small muted">ARRIVAL / YARD DATE</div><label class="toggle"><input id="arrivalUnknown" type="checkbox" onchange="toggleIntakeArrivalDate()"> Exact date unknown / vehicle was already in the yard</label><input id="arrivalDate" class="input" type="datetime-local" value="'+esc(localNowForInput())+'"><div class="arrival-help">Use Unknown for older vehicles when nobody knows the actual day they came in. TowTag will not invent storage days.</div></div>';
}
function editArrivalCard(v){
  const known=arrivalDateKnown(v),value=known?localDateTimeValue(v.tow_date):'';
  return '<div class="card arrival-date-card"><div class="small muted">ARRIVAL / YARD DATE</div><label class="toggle"><input id="editArrivalUnknown" type="checkbox" '+(!known?'checked':'')+' onchange="toggleEditArrivalDate()"> Exact date unknown / vehicle was already in the yard</label><input id="editArrivalDate" class="input" type="datetime-local" value="'+esc(value)+'" '+(!known?'disabled':'')+'><div class="arrival-help">If you learn the real date later, uncheck Unknown and enter it here. Storage will then calculate from that date.</div></div>';
}
function enrichArrivalBody(body,editing=false){
  body={...(body||{})};
  const unknown=editing?checked('editArrivalUnknown'):checked('arrivalUnknown');
  const dateValue=editing?val('editArrivalDate'):val('arrivalDate');
  const currentOps=editing&&selected?((typeof opsData==='function')?opsData(selected):(selected.ops_data||{})):{};
  const known=!unknown;
  if(known){
    if(!dateValue)throw new Error('Enter the arrival date/time or mark the date Unknown.');
    const parsed=new Date(dateValue);
    if(Number.isNaN(parsed.getTime()))throw new Error('Arrival date/time is invalid.');
    body.tow_date=parsed.toISOString();
  }else if(!editing||!selected?.tow_date){
    body.tow_date=new Date().toISOString();
  }
  body.ops_data={...currentOps,...(body.ops_data||{}),intake_date_known:known,intake_date_marked_at:new Date().toISOString(),intake_date_note:known?null:'Pre-existing yard vehicle; exact arrival date unknown'};
  return body;
}

const __originalStorageDayCount=storageDayCount;
storageDayCount=function(v,endOverride=null){return arrivalDateKnown(v)?__originalStorageDayCount(v,endOverride):0;};
const __originalStorageDayText=storageDayText;
storageDayText=function(v){return arrivalDateKnown(v)?__originalStorageDayText(v):'Unknown';};
const __originalRecordAgeDays=recordAgeDays;
recordAgeDays=function(v){return arrivalDateKnown(v)?__originalRecordAgeDays(v):0;};

const __originalAddForm=addForm;
addForm=function(notice=''){
  __originalAddForm(notice);
  const typeCard=el('recordType')?.closest('.card');
  if(typeCard&&!el('arrivalDate'))typeCard.insertAdjacentHTML('afterend',intakeArrivalCard());
  setTimeout(toggleIntakeArrivalDate,0);
};

const __originalEditVehicleForm=editVehicleForm;
editVehicleForm=function(){
  __originalEditVehicleForm();
  if(!selected||el('editArrivalDate'))return;
  const vehicleCard=el('editKeys')?.closest('.card');
  if(vehicleCard)vehicleCard.insertAdjacentHTML('afterend',editArrivalCard(selected));
  const oldInput=el('editTowDate');
  if(oldInput){
    oldInput.style.display='none';
    const prev=oldInput.previousElementSibling;
    if(prev&&prev.classList.contains('muted'))prev.style.display='none';
  }
  setTimeout(toggleEditArrivalDate,0);
};

    const parsed=typeof options.body==='string'?JSON.parse(options.body):options.body;
    nextOptions={...options,body:JSON.stringify(enrichArrivalBody(parsed,false))};

};

async function signVehicleThumb(path){
  if(!path)return '';

  const r=await api('/storage/v1/object/sign/vehicle-photos/'+encoded,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({expiresIn:86400})});

  if(!u)return '';
  if(u.startsWith('/storage/v1/'))u=BASE+u; else if(u.startsWith('/'))u=BASE+'/storage/v1'+u;
  vehicleThumbUrlCache[path]=u;

      ? '<div class="vehicle-list-thumb"><img data-thumb-vehicle="'+esc(v.id)+'" alt="Vehicle photo" style="display:none"><div class="vehicle-thumb-placeholder">Loading photo…</div><div class="vehicle-thumb-date'+dateClass+'">'+esc(dateLabel)+'</div></div>'

    return '<button class="vehicle" onclick="detail(\''+v.id+'\')"><div class="vehicle-list-card">'+thumbHtml+'<div class="vehicle-list-main"><h3>'+esc(title(v))+' '+(o.pinned?'<span class="pin-pill">PINNED</span>':'')+' '+(o.problem_flag?'<span class="flag-pill">FLAG</span>':'')+(unknown?'<span class="arrival-unknown-list">DATE UNKNOWN</span>':'')+'</h3><div class="muted">'+esc(v.color||'No color')+' · '+esc(v.plate||'No plate')+(v.yard_spot?' · <b>'+esc(v.yard_spot)+'</b>':'')+'</div><div class="small muted" style="margin-top:7px">'+esc(badge)+(o.internal_job_number?' · '+esc(o.internal_job_number):'')+'</div><div class="small muted" style="margin-top:6px">Photos '+p.done+'/'+p.total+(warn.length?' · <span style="color:#ffd76a">⚠ '+warn.length+'</span>':'')+'</div>'+(o.critical_note?'<div class="small" style="color:#ffb8bf;margin-top:7px">'+esc(o.critical_note)+'</div>':'')+'</div></div></button>';
  }).join('')||'<div class="card muted">No matching vehicles.</div>');
  hydrateVehicleListThumbs(rows).then(()=>{
    app.querySelectorAll('.vehicle-list-thumb').forEach(box=>{const img=box.querySelector('img');const ph=box.querySelector('.vehicle-thumb-placeholder');if(img&&img.getAttribute('src')&&ph)ph.remove();});
  }).catch(()=>{});
};
</script>


<script>
/* ===== TowTag hotfix 2026-09-13: Daily Ops + photo egress ===== */
window.TOWTAG_HOTFIX='2026-09-13-daily-ops-photo-v3';
let towtagPendingPhotoLabel='';

function towtagToast(message,isError=false){
  let n=document.getElementById('towtagHotfixToast');
  if(!n){
    n=document.createElement('div');n.id='towtagHotfixToast';
    n.style.cssText='position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:99999;max-width:calc(100vw - 32px);padding:12px 16px;border-radius:999px;font-weight:850;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.45);transition:opacity .2s';
    document.body.appendChild(n);
  }
  n.textContent=message;n.style.background=isError?'#5b1d24':'#20320f';n.style.color=isError?'#ffd2d7':'#cfffaa';n.style.border='1px solid '+(isError?'#91404a':'#4f7728');n.style.opacity='1';
  clearTimeout(n._timer);n._timer=setTimeout(()=>{n.style.opacity='0'},1800);
}

/* Load thumbnail metadata without downloading image bytes. */
load=async function(){
  const [v,p,d,a]=await Promise.all([
    api('/rest/v1/vehicles?select=*&order=tow_date.desc'),
    api('/rest/v1/vehicle_photos?select=id,vehicle_id,storage_path,thumb_path,caption,sort_order,created_by,created_at&order=created_at.asc'),
    api('/rest/v1/vehicle_documents?select=id,vehicle_id,storage_path,file_name,content_type,document_type,notes,created_at&order=created_at.desc'),
    api('/rest/v1/agencies?select=*&order=name')
  ]);
  vehicles=v||[];photoRows=p||[];documentRows=d||[];agencyRows=a||[];billingProfiles=[];
};

async function towtagSignPhotoPath(path,expiresIn=3600){
  if(!path)return '';
  const encoded=String(path).split('/').map(encodeURIComponent).join('/');
  const r=await api('/storage/v1/object/sign/vehicle-photos/'+encoded,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({expiresIn})});
  let u=r?.signedURL||r?.signedUrl||r?.signed_url||'';
  if(!u)return '';
  if(u.startsWith('/storage/v1/'))u=BASE+u;else if(u.startsWith('/'))u=BASE+'/storage/v1'+u;
  return u;
}

/* Vehicle list only loads small thumbnail files. Old originals stay unloaded. */
signVehicleThumb=async function(path){
  if(!path)return '';
  if(vehicleThumbUrlCache[path])return vehicleThumbUrlCache[path];
  const u=await towtagSignPhotoPath(path,86400);if(u)vehicleThumbUrlCache[path]=u;return u;
};
hydrateVehicleListThumbs=async function(rows){
  const work=(rows||[]).slice(0,60).map(async v=>{
    const photo=vehicleThumbPhotoRow(v),img=app.querySelector('img[data-thumb-vehicle="'+v.id+'"]');
    if(!img)return;
    const box=img.closest('.vehicle-list-thumb'),ph=box?.querySelector('.vehicle-thumb-placeholder');
    if(!photo){if(ph)ph.textContent='No Photo';return;}
    if(!photo.thumb_path){if(ph)ph.textContent='Photo on file';return;}
    try{const url=await signVehicleThumb(photo.thumb_path);if(url){img.loading='lazy';img.src=url;img.style.display='block';}}
    catch(e){if(ph)ph.textContent='Photo on file';console.warn('Thumb failed',e)}
  });
  await Promise.all(work);
};

/* Staff gallery uses thumbnails; full evidence photo loads only when tapped. */
async function openFullVehiclePhoto(photoId){
  const p=photoRows.find(x=>x.id===photoId);if(!p)return;
  const img=app.querySelector('img[data-staff-photo="'+photoId+'"]'),btn=app.querySelector('button[data-load-photo="'+photoId+'"]');
  try{
    if(btn){btn.disabled=true;btn.textContent='Loading full photo…';}
    const url=await towtagSignPhotoPath(p.storage_path,3600);if(!url)throw new Error('Could not create photo link.');
    if(img){img.src=url;img.style.display='block';img.dataset.full='1';}
    if(btn)btn.remove();
  }catch(e){if(btn){btn.disabled=false;btn.textContent='Tap to load photo';}towtagToast('Photo failed: '+e.message,true)}
}
loadStaffPhotos=async function(){
  const target=el('staffPhotos');if(!target||!selected)return;
  const rows=vehiclePhotoRows(selected);
  target.innerHTML=rows.map(p=>`<figure style="position:relative"><img data-staff-photo="${esc(p.id)}" alt="${esc(p.caption||'Vehicle photo')}" loading="lazy" style="display:none;cursor:zoom-in" onclick="openFullVehiclePhoto('${esc(p.id)}')"><button class="btn secondary" data-load-photo="${esc(p.id)}" type="button" style="margin:8px;width:calc(100% - 16px)" onclick="openFullVehiclePhoto('${esc(p.id)}')">${p.thumb_path?'Loading preview…':'Tap to load photo'}</button><figcaption>${esc(p.caption||'Vehicle photo')}</figcaption><div class="photo-actions"><button class="photo-move" type="button" onclick="photoMovePicker('${esc(p.id)}')">Move</button><button class="photo-delete" type="button" onclick="deleteVehiclePhoto('${esc(p.id)}')">Delete</button></div></figure>`).join('')||'<div class="muted">No photos yet.</div>';
  await Promise.all(rows.map(async p=>{
    if(!p.thumb_path)return;
    try{const url=await towtagSignPhotoPath(p.thumb_path,86400),img=app.querySelector('img[data-staff-photo="'+p.id+'"]'),btn=app.querySelector('button[data-load-photo="'+p.id+'"]');if(url&&img){img.src=url;img.style.display='block';}if(btn)btn.textContent='Tap photo for full size';}catch(e){console.warn('Preview failed',e)}
  }));
};

/* Camera works from Daily Ops even though the normal media inputs are not on that screen. */
takeLabeledPhoto=function(label){
  towtagPendingPhotoLabel=label||'Vehicle photo';
  if(el('photoCaption'))el('photoCaption').value=towtagPendingPhotoLabel;
  const existing=el('cameraPhoto');
  if(existing){existing.value='';existing.click();return;}
  const input=document.createElement('input');
  input.type='file';input.accept='image/*';input.setAttribute('capture','environment');input.style.display='none';
  input.onchange=async()=>{try{await uploadPhotos(input.files)}finally{input.remove()}};
  document.body.appendChild(input);input.click();
};

function towtagResizeImage(file,maxDimension,quality){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{try{
      const w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;if(!w||!h)throw new Error('Image dimensions unavailable');
      const scale=Math.min(1,maxDimension/Math.max(w,h)),cw=Math.max(1,Math.round(w*scale)),ch=Math.max(1,Math.round(h*scale));
      const c=document.createElement('canvas');c.width=cw;c.height=ch;const ctx=c.getContext('2d',{alpha:false});ctx.drawImage(img,0,0,cw,ch);
      c.toBlob(blob=>{URL.revokeObjectURL(url);blob?resolve(blob):reject(new Error('Could not compress photo'));},'image/jpeg',quality);
    }catch(e){URL.revokeObjectURL(url);reject(e)}};
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Photo format could not be resized on this device.'));};img.src=url;
  });
}
async function towtagPreparePhoto(file){
  let mainBlob=file,mainExt=(file.name&&file.name.includes('.')?file.name.split('.').pop():'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';
  let mainType=file.type||({jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',webp:'image/webp',heic:'image/heic',heif:'image/heif'}[mainExt]||'application/octet-stream'),thumbBlob=null;
  try{const b=await towtagResizeImage(file,2560,.82);if(b&&b.size<file.size){mainBlob=b;mainExt='jpg';mainType='image/jpeg';}}catch(e){console.warn('Main resize skipped',e)}
  try{thumbBlob=await towtagResizeImage(file,420,.68);}catch(e){console.warn('Thumbnail skipped',e)}
  return {mainBlob,mainExt,mainType,thumbBlob};
}
uploadPhotos=async function(fileList){
  if(!selected)return;const files=Array.from(fileList||[]);if(!files.length)return;
  const vehicleId=selected.id,label=towtagPendingPhotoLabel||el('photoCaption')?.value||'Vehicle photo';
  try{
    for(let i=0;i<files.length;i++){
      const prepared=await towtagPreparePhoto(files[i]),stem=vehicleId+'/'+Date.now()+'-'+i+'-'+Math.random().toString(36).slice(2,8),path=stem+'.'+prepared.mainExt,thumbPath=prepared.thumbBlob?stem+'-thumb.jpg':null;
      await api('/storage/v1/object/vehicle-photos/'+path,{method:'POST',headers:{'Content-Type':prepared.mainType,'x-upsert':'false','cache-control':'max-age=31536000'},body:prepared.mainBlob});
      if(thumbPath)await api('/storage/v1/object/vehicle-photos/'+thumbPath,{method:'POST',headers:{'Content-Type':'image/jpeg','x-upsert':'false','cache-control':'max-age=31536000'},body:prepared.thumbBlob});
      await api('/rest/v1/vehicle_photos',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({vehicle_id:vehicleId,storage_path:path,thumb_path:thumbPath,caption:label,created_by:user.id})});
      try{await logOpsActivity(vehicleId,'photo_added',label+' photo added')}catch{}
    }
    towtagPendingPhotoLabel='';await load();selected=vehicles.find(v=>v.id===vehicleId);if(el('staffPhotos'))await loadStaffPhotos();
    towtagToast(files.length===1?'Photo saved':'Photos saved');
    if(document.querySelector('.h1')?.textContent==='Daily Ops')dailyOpsScreen();
  }catch(e){towtagPendingPhotoLabel='';towtagToast('Photo upload failed: '+e.message,true);alert('Photo upload failed: '+e.message)}
};

/* Delete thumbnail too when a photo is removed. */
const __towtagDeletePhoto=window.deleteVehiclePhoto;
deleteVehiclePhoto=async function(photoId){
  if(!selected||!photoId)return;if(!confirm('Delete this photo from '+title(selected)+'?\n\nOnly this photo will be removed. The vehicle record will stay intact.'))return;
  const p=photoRows.find(x=>x.id===photoId),vehicleId=selected.id;
  try{
    if(p?.thumb_path){try{await api('/storage/v1/object/vehicle-photos/'+p.thumb_path.split('/').map(encodeURIComponent).join('/'),{method:'DELETE'});}catch(e){console.warn('Thumbnail cleanup failed',e)}}
    if(!await ensureSession())throw new Error('Sign in required');
    const r=await fetch(BASE+'/functions/v1/towtag-live?action=photo-delete',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify({photoId,vehicleId})});
    const d=await r.json();if(!r.ok)throw new Error(d.error||'Photo delete failed');await load();selected=vehicles.find(v=>v.id===vehicleId);if(el('staffPhotos'))await loadStaffPhotos();towtagToast('Photo deleted');
  }catch(e){towtagToast('Could not delete photo: '+e.message,true)}
};

/* Clear visual feedback for Daily Ops save buttons. */
function towtagWrapSave(name,label){
  const fn=window[name];if(typeof fn!=='function'||fn.__towtagWrapped)return;
  const wrapped=async function(...args){try{await fn.apply(this,args);towtagToast(label||'Saved');}catch(e){console.error(name,e);towtagToast('Save failed: '+(e?.message||e),true);alert('Could not save: '+(e?.message||e));}};
  wrapped.__towtagWrapped=true;window[name]=wrapped;
}
[
 ['saveJobAndSpot','Job # / yard spot saved'],['saveCriticalNote','Critical note saved'],['saveCustomerPhone','Phone saved'],
 ['saveKeyTracking','Key tracking saved'],['savePaymentStatus','Payment status saved'],['saveReleaseChecklist','Release checklist saved'],
 ['savePropertyInventory','Property inventory saved'],['addShiftNote','Shift note saved'],['addCallLog','Contact log saved'],['addReminder','Reminder saved']
].forEach(x=>towtagWrapSave(x[0],x[1]));
</script>


<script>
/* ===== TowTag photo display hotfix 2026-09-13 v4 =====
   Legacy photos do not have thumb_path. Show them automatically instead of forcing a tap.
   New photos continue to use small generated thumbnails when available. */
window.TOWTAG_PHOTO_DISPLAY_FIX='2026-09-13-v4';

hydrateVehicleListThumbs=async function(rows){
  const work=(rows||[]).slice(0,60).map(async v=>{
    const photo=vehicleThumbPhotoRow(v),img=app.querySelector('img[data-thumb-vehicle="'+v.id+'"]');
    if(!img)return;
    const box=img.closest('.vehicle-list-thumb'),ph=box?.querySelector('.vehicle-thumb-placeholder');
    if(!photo){if(ph)ph.textContent='No Photo';return;}
    const previewPath=photo.thumb_path||photo.storage_path;
    if(!previewPath){if(ph)ph.textContent='No Photo';return;}
    try{
      const url=await signVehicleThumb(previewPath);
      if(url&&img){
        img.loading='lazy';
        img.decoding='async';
        img.onload=()=>{if(ph)ph.remove();};
        img.onerror=()=>{if(ph)ph.textContent='Photo unavailable';};
        img.src=url;img.style.display='block';
      }
    }catch(e){if(ph)ph.textContent='Photo unavailable';console.warn('Thumb failed',e)}
  });
  await Promise.all(work);
};

loadStaffPhotos=async function(){
  const target=el('staffPhotos');if(!target||!selected)return;
  const rows=vehiclePhotoRows(selected);
  target.innerHTML=rows.map(p=>{
    const hasThumb=!!p.thumb_path;
    const click=hasThumb?`onclick="openFullVehiclePhoto('${esc(p.id)}')"`:'';
    const cursor=hasThumb?'cursor:zoom-in;':'';
    return `<figure style="position:relative"><div class="photo-auto-wrap" style="min-height:120px;background:#101419;display:grid;place-items:center"><div class="muted small" data-photo-loading="${esc(p.id)}">Loading photo…</div><img data-staff-photo="${esc(p.id)}" alt="${esc(p.caption||'Vehicle photo')}" loading="lazy" decoding="async" style="display:none;width:100%;${cursor}" ${click}></div><figcaption>${esc(p.caption||'Vehicle photo')}</figcaption><div class="photo-actions"><button class="photo-move" type="button" onclick="photoMovePicker('${esc(p.id)}')">Move</button><button class="photo-delete" type="button" onclick="deleteVehiclePhoto('${esc(p.id)}')">Delete</button></div></figure>`;
  }).join('')||'<div class="muted">No photos yet.</div>';

  await Promise.all(rows.map(async p=>{
    const path=p.thumb_path||p.storage_path;
    if(!path)return;
    try{
      const url=await towtagSignPhotoPath(path,p.thumb_path?86400:21600);
      const img=app.querySelector('img[data-staff-photo="'+p.id+'"]');
      const loading=app.querySelector('[data-photo-loading="'+p.id+'"]');
      if(url&&img){
        img.onload=()=>{img.style.display='block';if(loading)loading.remove();};
        img.onerror=()=>{if(loading)loading.textContent='Photo unavailable';};
        img.src=url;
      }
    }catch(e){
      const loading=app.querySelector('[data-photo-loading="'+p.id+'"]');
      if(loading)loading.textContent='Photo unavailable';
      console.warn('Photo preview failed',e);
    }
  }));
};
</script>
