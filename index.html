<head>

<style>
:root{color-scheme:dark;--bg:#0b0d10;--card:#15191f;--line:#29313a;--text:#f5f7fa;--muted:#98a3ae;--green:#76ff03}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}.wrap{max-width:760px;margin:auto;min-height:100vh;padding:max(18px,env(safe-area-inset-top)) 16px max(32px,env(safe-area-inset-bottom))}
.brand{font-size:32px;font-weight:900;letter-spacing:-.7px}.brand b{color:var(--green)}.site-name{font-size:14px;font-weight:800;letter-spacing:.2px;margin-top:3px}.site-name span{color:var(--green)}.muted{color:var(--muted)}.small{font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
.input{width:100%;background:#101419;border:1px solid var(--line);border-radius:12px;padding:13px;color:#fff;margin:5px 0 10px;font-size:16px}
.btn{border:0;border-radius:13px;padding:14px 15px;font-weight:800;background:var(--green);color:#071003;width:100%;margin-top:8px}
.btn.secondary{background:transparent;border:1px solid #3a4652;color:#dce3e9}.btn.danger{background:#351416;border:1px solid #7d2d35;color:#ffb8bf}.row{display:flex;gap:10px}.row>*{flex:1}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.link{color:#8dff3f;background:none;border:0;font-weight:750;padding:8px 0}
.vehicle{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;color:#fff;margin:10px 0}
.vehicle h3{margin:0 0 5px}.pill{display:inline-block;padding:6px 9px;border-radius:999px;background:#20320f;color:#baff83;font-size:12px;font-weight:800;text-transform:capitalize}
.error{padding:12px;border-radius:12px;background:#271417;border:1px solid #5a272e;color:#ffb7bf;margin:10px 0}
.notice{padding:12px;border-radius:12px;background:#151c12;border:1px solid #30431e;color:#cfffaa;margin:10px 0}
.h1{font-size:28px;font-weight:850;margin:14px 0 2px}.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kv div{background:#101419;border-radius:12px;padding:12px}.kv span{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}
.qr{background:#fff;border-radius:16px;padding:14px;width:min(100%,320px);display:block;margin:14px auto}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:12px}.photos figure{margin:0;background:#101419;border-radius:14px;overflow:hidden}.photos img{width:100%;display:block;aspect-ratio:4/3;object-fit:cover}.photos figcaption{padding:9px 10px;color:#aab3bd;font-size:12px}
@media(max-width:560px){.row{flex-direction:column}.kv,.photos{grid-template-columns:1fr}}
</style>
</head>
<body><main class="wrap"><div id="app"></div></main>
<script>
const BASE='https://ckonxzprnxqlefxscudt.supabase.co';
const KEY='sb_publishable_fQ-Cv2dhMlib6_16oh-WiQ_Ku96PhPp';
const SITE='https://damionv010-beep.github.io/';
let session=null,user=null,vehicles=[],selected=null;
const app=document.getElementById('app');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function saveSession(s){
  session=s;
  if(s){
    session.expires_at=Math.floor(Date.now()/1000)+(s.expires_in||3600);
    localStorage.setItem('towtag_session',JSON.stringify(session));
    user=s.user;
  }else{
    localStorage.removeItem('towtag_session'); user=null;
  }
}
async function ensureSession(){
  if(!session)return false;
  if((session.expires_at||0)>Math.floor(Date.now()/1000)+90)return true;
  if(!session.refresh_token){logout();return false}
  const r=await fetch(BASE+'/auth/v1/token?grant_type=refresh_token',{
    method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},
    body:JSON.stringify({refresh_token:session.refresh_token})
  });
  if(!r.ok){logout();return false}
  saveSession(await r.json()); return true;
}
async function api(path,opt={}){
  if(!await ensureSession())throw new Error('Sign in required');
  const r=await fetch(BASE+path,{...opt,headers:{apikey:KEY,Authorization:'Bearer '+session.access_token,...(opt.headers||{})}});
  const t=await r.text(); let d=null; try{d=t?JSON.parse(t):null}catch{d=t}
  if(!r.ok)throw new Error((d&&d.message)||(d&&d.error)||('Request failed '+r.status));
  return d;
}
function loginScreen(msg=''){
  app.innerHTML='<div style="padding-top:10vh"><div class="brand">Mike’s Cascade</div><div class="site-name"><span>TOWING YARD</span> · Powered by TowTag</div><p class="muted">Vehicle impound records + QR tags</p>'+msg+
  '<div class="card"><label class="small muted">Email</label><input id="email" class="input" type="email" autocomplete="email" autocapitalize="none">'+
  '<label class="small muted">Password</label><input id="pw" class="input" type="password" autocomplete="current-password">'+
  '<button class="btn" onclick="login()">Sign In</button><button class="btn secondary" onclick="signup()">Create Account</button></div></div>';
}
async function login(){
  try{
    const r=await fetch(BASE+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},
      body:JSON.stringify({email:email.value.trim(),password:pw.value})});
    const d=await r.json(); if(!r.ok)throw new Error(d.error_description||d.msg||d.message||'Sign in failed');
    saveSession(d); await boot();
  }catch(e){loginScreen('<div class="error">'+esc(e.message)+'</div>')}
}
async function signup(){
  try{
    const r=await fetch(BASE+'/auth/v1/signup',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},
      body:JSON.stringify({email:email.value.trim(),password:pw.value})});
    const d=await r.json(); if(!r.ok)throw new Error(d.msg||d.message||'Sign up failed');
    if(d.access_token){saveSession(d);await boot()}
    else loginScreen('<div class="notice">Account created. Check your email, confirm it, then come back and sign in.</div>');
  }catch(e){loginScreen('<div class="error">'+esc(e.message)+'</div>')}
}
async function boot(){
  try{
    user=await api('/auth/v1/user');
    const m=await api('/rest/v1/staff_members?select=user_id,role,active&user_id=eq.'+encodeURIComponent(user.id));
    if(!m.length){setupScreen();return}
    await load(); home();
  }catch(e){loginScreen('<div class="error">'+esc(e.message)+'</div>')}
}
function setupScreen(){
  app.innerHTML='<div style="padding-top:8vh"><div class="brand">Mike’s Cascade</div><div class="site-name"><span>TOWING YARD</span> · Powered by TowTag</div><div class="card"><h2>Finish first-time setup</h2>'+
  '<p class="muted">Enter the one-time TowTag setup code from ChatGPT. This only creates the first administrator.</p>'+
  '<input id="setupCode" class="input" placeholder="Setup code" autocapitalize="characters">'+
  '<button class="btn" onclick="claimAdmin()">Activate TowTag Admin</button><button class="btn secondary" onclick="logout()">Sign Out</button></div></div>';
}
async function claimAdmin(){
  try{
    const r=await fetch(BASE+'/functions/v1/towtag-bootstrap',{method:'POST',
      headers:{apikey:KEY,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},
      body:JSON.stringify({setupCode:setupCode.value.trim().toUpperCase()})});
    const d=await r.json(); if(!r.ok)throw new Error(d.error||'Setup failed');
    await load(); home();
  }catch(e){alert(e.message)}
}
async function load(){vehicles=await api('/rest/v1/vehicles?select=*&order=tow_date.desc')||[]}
const title=v=>[v.year,v.make,v.model].filter(Boolean).join(' ')||'Vehicle';
function localDateTimeValue(value){
  if(!value)return '';
  const d=new Date(value);
  if(Number.isNaN(d.getTime()))return '';
  const pad=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());
}
const impoundLabel=v=>({
  police_impound:'Police Impound',
  motor_vehicle_accident:'Motor Vehicle Accident',
  preference_motor_vehicle_accident:'Preference Motor Vehicle Accident',
  private_party_impound:'Private Party Impound'
}[v]||'Not specified');
const keysLabel=v=>({received:'Keys Received',no_keys:'No Keys',unknown:'Unknown'}[v]||'Not specified');
const holdLabel=v=>({none:'No Hold',police_hold:'Police Hold',insurance_hold:'Insurance Hold',owner_hold:'Owner Hold',other:'Other Hold'}[v]||'No Hold');
const fmtOdo=v=>v===null||v===undefined||v===''?'—':Number(v).toLocaleString()+' mi';

function home(){
  selected=null;
  app.innerHTML='<div class="top"><div><div class="brand">Mike’s Cascade</div><div class="site-name"><span>TOWING YARD</span> · Powered by TowTag</div><div class="muted small">'+vehicles.length+' vehicle'+(vehicles.length===1?'':'s')+
  '</div></div><button class="link" onclick="logout()">Sign Out</button></div>'+
  '<div class="row" style="margin-top:12px"><button class="btn" onclick="addForm()">+ Add Vehicle</button>'+
  '<button class="btn secondary" onclick="alert(\'Use the iPhone Camera app to scan a TowTag QR code.\')">Scan TowTag</button></div>'+
  '<input id="search" class="input" placeholder="Search plate, VIN, make..." oninput="render(this.value)"><div id="list"></div>';
  render('');
}
function render(q){
  q=(q||'').toLowerCase();
  const rows=vehicles.filter(v=>JSON.stringify([v.year,v.make,v.model,v.color,v.plate,v.vin,v.yard_location,v.yard_spot,v.impound_type,v.tow_number,v.driver_name]).toLowerCase().includes(q));
  document.getElementById('list').innerHTML=rows.map(v=>
    '<button class="vehicle" onclick="detail(\''+v.id+'\')"><h3>'+esc(title(v))+'</h3><div class="muted">'+esc(v.color||'No color')+' · '+esc(v.plate||'No plate')+
    '</div><div class="small muted" style="margin-top:7px">'+new Date(v.tow_date).toLocaleString()+' · <span class="pill">'+esc(v.status)+'</span></div></button>'
  ).join('')||'<div class="card muted">No vehicles yet. Add the first TowTag.</div>';
}
function addForm(){
  app.innerHTML='<button class="link" onclick="home()">‹ Back</button><div class="h1">Add Vehicle</div>'+
  '<div class="card"><div class="small muted">VEHICLE INFORMATION</div>'+
  '<div class="row"><input id="year" class="input" inputmode="numeric" placeholder="Year"><input id="color" class="input" placeholder="Color"></div>'+
  '<input id="make" class="input" placeholder="Make"><input id="model" class="input" placeholder="Model">'+
  '<div class="row"><input id="plate" class="input" placeholder="Plate"><input id="state" class="input" value="OR" placeholder="State"></div>'+
  '<input id="vin" class="input" placeholder="VIN" autocapitalize="characters"><div class="row"><input id="towNumber" class="input" placeholder="Tow / case number"><input id="odometer" class="input" inputmode="numeric" placeholder="Odometer"></div>'+
  '<input id="driverName" class="input" placeholder="Tow operator / driver">'+
  '<div class="small muted">KEYS</div><select id="keysStatus" class="input"><option value="unknown">Unknown</option><option value="received">Keys Received</option><option value="no_keys">No Keys</option></select></div>'+
  '<div class="card"><div class="small muted">TOW DETAILS</div><input id="agency" class="input" placeholder="Agency">'+
  '<div class="small muted">IMPOUND TYPE</div><select id="impoundType" class="input"><option value="">Select impound type…</option>'+
  '<option value="police_impound">Police Impound</option><option value="motor_vehicle_accident">Motor Vehicle Accident</option>'+
  '<option value="preference_motor_vehicle_accident">Preference Motor Vehicle Accident</option><option value="private_party_impound">Private Party Impound</option></select>'+
  '<div class="small muted">PICKED UP FROM</div><input id="yard" class="input" placeholder="Address, intersection, highway, business, etc.">'+
  '<div class="small muted">YARD SPOT</div><input id="yardSpot" class="input" placeholder="Example: Row B - Spot 14">'+
  '<div class="small muted">HOLD</div><select id="holdType" class="input"><option value="none">No Hold</option><option value="police_hold">Police Hold</option><option value="insurance_hold">Insurance Hold</option><option value="owner_hold">Owner Hold</option><option value="other">Other Hold</option></select>'+
  '<textarea id="holdNotes" class="input" rows="2" placeholder="Hold notes / instructions"></textarea></div>'+
  '<div class="card"><div class="small muted">CONDITION & PROPERTY</div><textarea id="conditionNotes" class="input" rows="3" placeholder="Vehicle condition / existing damage"></textarea>'+
  '<textarea id="propertyNotes" class="input" rows="3" placeholder="Personal property inside vehicle"></textarea>'+
  '<textarea id="notes" class="input" rows="4" placeholder="Staff notes"></textarea>'+
  '<div class="small muted">VEHICLE STATUS</div><select id="status" class="input"><option value="impounded">Impounded</option><option value="hold">Hold</option><option value="released">Released</option><option value="auction">Auction</option><option value="other">Other</option></select>'+
  '<button class="btn" onclick="saveVehicle()">Save & Generate TowTag</button></div>';
}
async function saveVehicle(){
  try{
    if(!impoundType.value){alert('Choose an impound type.');return}
    let agency_id=null; const n=agency.value.trim();
    if(n){
      let a=await api('/rest/v1/agencies?select=id,name&name=eq.'+encodeURIComponent(n));
      if(a.length)agency_id=a[0].id;
      else{
        a=await api('/rest/v1/agencies',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify({name:n})});
        agency_id=a[0].id;
      }
    }
    const odo=odometer.value.trim();
    const body={year:year.value?Number(year.value):null,make:make.value.trim()||null,model:model.value.trim()||null,color:color.value.trim()||null,
      plate:plate.value.trim()||null,plate_state:state.value.trim().toUpperCase()||null,vin:vin.value.trim().toUpperCase()||null,agency_id,yard_location:yard.value.trim()||null,
      yard_spot:yardSpot.value.trim()||null,impound_type:impoundType.value,tow_number:towNumber.value.trim()||null,driver_name:driverName.value.trim()||null,
      odometer:odo?Number(odo):null,keys_status:keysStatus.value,condition_notes:conditionNotes.value.trim()||null,property_notes:propertyNotes.value.trim()||null,
      hold_type:holdType.value,hold_notes:holdNotes.value.trim()||null,status:status.value,notes:notes.value.trim()||null,created_by:user.id};
    const rows=await api('/rest/v1/vehicles',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify(body)});
    await load(); detail(rows[0].id);
  }catch(e){alert(e.message)}
}
function detail(id){
  selected=vehicles.find(v=>v.id===id); const v=selected; if(!v)return;
  const qr=BASE+'/functions/v1/towtag-qr?token='+encodeURIComponent(v.qr_token);
  const publicUrl=SITE+'?tag='+encodeURIComponent(v.qr_token);
  const releaseCard=v.release_at?
    '<div class="card"><div class="small muted">RELEASE RECORD</div><div class="kv" style="margin-top:10px"><div><span>Released</span>'+esc(new Date(v.release_at).toLocaleString())+'</div><div><span>Released to</span>'+esc(v.released_to||'—')+'</div><div><span>ID checked</span>'+(v.release_id_checked?'Yes':'No')+'</div><div><span>Authorized by</span>'+esc(v.release_authorized_by||'—')+'</div><div style="grid-column:1/-1"><span>Release notes</span>'+esc(v.release_notes||'—')+'</div></div></div>':
    '<div class="card"><div class="small muted">RELEASE VEHICLE</div><input id="releasedTo" class="input" placeholder="Released to (name)"><input id="releaseAuthorized" class="input" placeholder="Release authorized by"><label style="display:flex;align-items:center;gap:10px;margin:8px 0 12px"><input id="releaseIdChecked" type="checkbox" style="width:22px;height:22px"> ID checked</label><textarea id="releaseNotes" class="input" rows="3" placeholder="Release notes"></textarea><button class="btn" onclick="releaseVehicle()">Release Vehicle</button></div>';
  app.innerHTML='<button class="link" onclick="home()">‹ Vehicles</button><div class="h1">'+esc(title(v))+'</div><div class="muted">'+esc(v.color||'Color not listed')+
  ' · <span class="pill">'+esc(v.status)+'</span></div><div class="card kv"><div><span>Tow date</span>'+esc(new Date(v.tow_date).toLocaleString())+
  '</div><div><span>Tow / case #</span>'+esc(v.tow_number||'—')+'</div><div><span>Plate</span>'+esc(v.plate||'—')+' '+esc(v.plate_state||'')+'</div><div><span>VIN</span>'+esc(v.vin||'—')+
  '</div><div><span>Impound type</span>'+esc(impoundLabel(v.impound_type))+'</div><div><span>Driver</span>'+esc(v.driver_name||'—')+'</div><div><span>Odometer</span>'+esc(fmtOdo(v.odometer))+
  '</div><div><span>Keys</span>'+esc(keysLabel(v.keys_status))+'</div><div><span>Picked up from</span>'+esc(v.yard_location||'—')+'</div><div><span>Yard spot</span>'+esc(v.yard_spot||'—')+
  '</div><div><span>Hold</span>'+esc(holdLabel(v.hold_type))+'</div><div><span>Hold notes</span>'+esc(v.hold_notes||'—')+'</div><div style="grid-column:1/-1"><span>Condition / damage</span>'+esc(v.condition_notes||'—')+
  '</div><div style="grid-column:1/-1"><span>Personal property</span>'+esc(v.property_notes||'—')+'</div><div style="grid-column:1/-1"><span>Staff notes</span>'+esc(v.notes||'—')+'</div></div>'+
  '<button class="btn secondary" onclick="editVehicleForm()">Edit Vehicle</button>'+
  '<div class="card"><div class="small muted">VEHICLE STATUS</div><select id="vehicleStatus" class="input">'+
  '<option value="impounded" '+(v.status==='impounded'?'selected':'')+'>Impounded</option><option value="hold" '+(v.status==='hold'?'selected':'')+'>Hold</option><option value="released" '+(v.status==='released'?'selected':'')+'>Released</option><option value="auction" '+(v.status==='auction'?'selected':'')+'>Auction</option><option value="other" '+(v.status==='other'?'selected':'')+'>Other</option></select><button class="btn" onclick="updateVehicleStatus()">Save Status</button></div>'+
  releaseCard+
  '<div class="card" style="text-align:center"><img class="qr" src="'+qr+'"><div class="small muted">Scan with any phone camera</div>'+
  '<input id="cameraPhoto" type="file" accept="image/*" capture="environment" style="display:none" onchange="uploadPhotos(this.files)"><input id="libraryPhoto" type="file" accept="image/*" multiple style="display:none" onchange="uploadPhotos(this.files)">'+
  '<div class="small muted" style="margin-top:14px">PHOTO LABEL</div><select id="photoCaption" class="input"><option value="Vehicle photo">General Photo</option><option value="Front">Front</option><option value="Rear">Rear</option><option value="Driver side">Driver Side</option><option value="Passenger side">Passenger Side</option><option value="Interior">Interior</option><option value="Damage">Damage</option><option value="VIN">VIN</option><option value="Odometer">Odometer</option><option value="Personal property">Personal Property</option></select>'+
  '<div class="row"><button class="btn" onclick="cameraPhoto.click()">Take Photo</button><button class="btn secondary" onclick="libraryPhoto.click()">Choose From Photos</button></div><div id="staffPhotos" class="photos" style="margin-top:12px"></div>'+
  '<div class="row"><button class="btn secondary" onclick="location.href=\''+publicUrl+'\'">Open Public Tag</button><button class="btn secondary" onclick="shareTag()">Share</button></div></div>'+
  '<div class="card"><div class="small muted">ACTIVITY HISTORY</div><div id="activity" class="muted" style="margin-top:10px">Loading history…</div></div>'+
  '<div class="card"><div class="small muted">DANGER ZONE</div><p class="muted">Permanently removes this vehicle and its uploaded photos. This cannot be undone.</p><button class="btn danger" onclick="deleteVehicle()">Delete Vehicle Permanently</button></div>';
  loadActivity(v.id);
  loadStaffPhotos(v.qr_token);
}
async function editVehicleForm(){
  if(!selected)return;
  const v=selected;
  let agencyName='';
  try{if(v.agency_id){const rows=await api('/rest/v1/agencies?select=name&id=eq.'+encodeURIComponent(v.agency_id));if(rows&&rows.length)agencyName=rows[0].name||'';}}catch(e){console.warn('Could not load agency name',e);}
  app.innerHTML='<button class="link" onclick="detail(\''+v.id+'\')">‹ Cancel</button><div class="h1">Edit Vehicle</div>'+
  '<div class="card"><div class="small muted">VEHICLE INFORMATION</div><div class="row"><input id="editYear" class="input" inputmode="numeric" placeholder="Year" value="'+esc(v.year||'')+'"><input id="editColor" class="input" placeholder="Color" value="'+esc(v.color||'')+'"></div>'+
  '<input id="editMake" class="input" placeholder="Make" value="'+esc(v.make||'')+'"><input id="editModel" class="input" placeholder="Model" value="'+esc(v.model||'')+'"><div class="row"><input id="editPlate" class="input" placeholder="Plate" value="'+esc(v.plate||'')+'"><input id="editState" class="input" placeholder="State" value="'+esc(v.plate_state||'OR')+'"></div>'+
  '<input id="editVin" class="input" placeholder="VIN" autocapitalize="characters" value="'+esc(v.vin||'')+'"><div class="row"><input id="editTowNumber" class="input" placeholder="Tow / case number" value="'+esc(v.tow_number||'')+'"><input id="editOdometer" class="input" inputmode="numeric" placeholder="Odometer" value="'+esc(v.odometer??'')+'"></div>'+
  '<input id="editDriver" class="input" placeholder="Tow operator / driver" value="'+esc(v.driver_name||'')+'"><div class="small muted">KEYS</div><select id="editKeys" class="input"><option value="unknown" '+(!v.keys_status||v.keys_status==='unknown'?'selected':'')+'>Unknown</option><option value="received" '+(v.keys_status==='received'?'selected':'')+'>Keys Received</option><option value="no_keys" '+(v.keys_status==='no_keys'?'selected':'')+'>No Keys</option></select></div>'+
  '<div class="card"><div class="small muted">TOW DETAILS</div><div class="small muted">TOW DATE / TIME</div><input id="editTowDate" class="input" type="datetime-local" value="'+esc(localDateTimeValue(v.tow_date))+'"><input id="editAgency" class="input" placeholder="Agency" value="'+esc(agencyName)+'">'+
  '<div class="small muted">IMPOUND TYPE</div><select id="editImpoundType" class="input"><option value="" '+(!v.impound_type?'selected':'')+'>Not specified</option><option value="police_impound" '+(v.impound_type==='police_impound'?'selected':'')+'>Police Impound</option><option value="motor_vehicle_accident" '+(v.impound_type==='motor_vehicle_accident'?'selected':'')+'>Motor Vehicle Accident</option><option value="preference_motor_vehicle_accident" '+(v.impound_type==='preference_motor_vehicle_accident'?'selected':'')+'>Preference Motor Vehicle Accident</option><option value="private_party_impound" '+(v.impound_type==='private_party_impound'?'selected':'')+'>Private Party Impound</option></select>'+
  '<div class="small muted">PICKED UP FROM</div><input id="editPickup" class="input" value="'+esc(v.yard_location||'')+'" placeholder="Pickup location"><div class="small muted">YARD SPOT</div><input id="editYardSpot" class="input" value="'+esc(v.yard_spot||'')+'" placeholder="Row / spot">'+
  '<div class="small muted">HOLD</div><select id="editHoldType" class="input"><option value="none" '+(!v.hold_type||v.hold_type==='none'?'selected':'')+'>No Hold</option><option value="police_hold" '+(v.hold_type==='police_hold'?'selected':'')+'>Police Hold</option><option value="insurance_hold" '+(v.hold_type==='insurance_hold'?'selected':'')+'>Insurance Hold</option><option value="owner_hold" '+(v.hold_type==='owner_hold'?'selected':'')+'>Owner Hold</option><option value="other" '+(v.hold_type==='other'?'selected':'')+'>Other Hold</option></select><textarea id="editHoldNotes" class="input" rows="2" placeholder="Hold notes">'+esc(v.hold_notes||'')+'</textarea></div>'+
  '<div class="card"><div class="small muted">CONDITION & PROPERTY</div><textarea id="editCondition" class="input" rows="3" placeholder="Vehicle condition / existing damage">'+esc(v.condition_notes||'')+'</textarea><textarea id="editProperty" class="input" rows="3" placeholder="Personal property">'+esc(v.property_notes||'')+'</textarea><textarea id="editNotes" class="input" rows="4" placeholder="Staff notes">'+esc(v.notes||'')+'</textarea>'+
  '<div class="small muted">VEHICLE STATUS</div><select id="editStatus" class="input"><option value="impounded" '+(v.status==='impounded'?'selected':'')+'>Impounded</option><option value="hold" '+(v.status==='hold'?'selected':'')+'>Hold</option><option value="released" '+(v.status==='released'?'selected':'')+'>Released</option><option value="auction" '+(v.status==='auction'?'selected':'')+'>Auction</option><option value="other" '+(v.status==='other'?'selected':'')+'>Other</option></select></div>'+
  (v.release_at?'<div class="card"><div class="small muted">RELEASE RECORD</div><input id="editReleasedTo" class="input" placeholder="Released to" value="'+esc(v.released_to||'')+'"><input id="editReleaseAuthorized" class="input" placeholder="Authorized by" value="'+esc(v.release_authorized_by||'')+'"><label style="display:flex;align-items:center;gap:10px;margin:8px 0 12px"><input id="editReleaseIdChecked" type="checkbox" style="width:22px;height:22px" '+(v.release_id_checked?'checked':'')+'> ID checked</label><textarea id="editReleaseNotes" class="input" rows="3" placeholder="Release notes">'+esc(v.release_notes||'')+'</textarea></div>':'')+
  '<button class="btn" onclick="saveVehicleEdits()">Save Vehicle Changes</button><button class="btn secondary" onclick="detail(\''+v.id+'\')">Cancel</button>';
}

async function saveVehicleEdits(){
  if(!selected)return;
  try{
    const id=selected.id; let agency_id=null; const agencyName=document.getElementById('editAgency').value.trim();
    if(agencyName){let a=await api('/rest/v1/agencies?select=id,name&name=eq.'+encodeURIComponent(agencyName));if(a.length)agency_id=a[0].id;else{a=await api('/rest/v1/agencies',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify({name:agencyName})});agency_id=a[0].id;}}
    const towDateValue=document.getElementById('editTowDate').value; let tow_date=selected.tow_date;if(towDateValue){const parsed=new Date(towDateValue);if(Number.isNaN(parsed.getTime()))throw new Error('Tow date/time is invalid.');tow_date=parsed.toISOString();}
    const odo=document.getElementById('editOdometer').value.trim();
    const body={year:editYear.value.trim()?Number(editYear.value.trim()):null,make:editMake.value.trim()||null,model:editModel.value.trim()||null,color:editColor.value.trim()||null,plate:editPlate.value.trim()||null,plate_state:editState.value.trim().toUpperCase()||null,vin:editVin.value.trim().toUpperCase()||null,tow_date,agency_id,
      impound_type:editImpoundType.value||null,yard_location:editPickup.value.trim()||null,yard_spot:editYardSpot.value.trim()||null,tow_number:editTowNumber.value.trim()||null,driver_name:editDriver.value.trim()||null,odometer:odo?Number(odo):null,keys_status:editKeys.value,
      hold_type:editHoldType.value,hold_notes:editHoldNotes.value.trim()||null,condition_notes:editCondition.value.trim()||null,property_notes:editProperty.value.trim()||null,status:editStatus.value,notes:editNotes.value.trim()||null};
    if(selected.release_at){body.released_to=editReleasedTo.value.trim()||null;body.release_authorized_by=editReleaseAuthorized.value.trim()||null;body.release_id_checked=editReleaseIdChecked.checked;body.release_notes=editReleaseNotes.value.trim()||null;}
    await api('/rest/v1/vehicles?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify(body)});
    await load(); detail(id); alert('Vehicle updated.');
  }catch(e){alert('Vehicle update failed: '+e.message)}
}

async function releaseVehicle(){
  if(!selected)return;
  const name=document.getElementById('releasedTo').value.trim();
  if(!name){alert('Enter who the vehicle is being released to.');return}
  const id=selected.id;
  try{
    const body={status:'released',release_at:new Date().toISOString(),released_to:name,release_id_checked:document.getElementById('releaseIdChecked').checked,release_authorized_by:document.getElementById('releaseAuthorized').value.trim()||null,release_notes:document.getElementById('releaseNotes').value.trim()||null};
    await api('/rest/v1/vehicles?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify(body)});
    await load(); detail(id); alert('Vehicle released and recorded.');
  }catch(e){alert('Release failed: '+e.message)}
}

async function loadActivity(id){
  const el=document.getElementById('activity'); if(!el)return;
  try{
    const rows=await api('/rest/v1/vehicle_activity?select=event_type,description,created_at&vehicle_id=eq.'+encodeURIComponent(id)+'&order=created_at.desc&limit=50');
    el.innerHTML=(rows||[]).map(r=>'<div style="padding:10px 0;border-bottom:1px solid var(--line)"><div>'+esc(r.description)+'</div><div class="small muted" style="margin-top:3px">'+esc(new Date(r.created_at).toLocaleString())+'</div></div>').join('')||'<div class="muted">No activity recorded yet.</div>';
  }catch(e){el.innerHTML='<div class="error">History failed to load: '+esc(e.message)+'</div>'}
}

async function loadStaffPhotos(token){
  const el=document.getElementById('staffPhotos'); if(!el)return;
  try{
    const r=await fetch(BASE+'/functions/v1/towtag-public-vehicle?token='+encodeURIComponent(token),{headers:{apikey:KEY}});const d=await r.json();if(!r.ok)throw new Error(d.error||'Photo lookup failed');
    el.innerHTML=(d.photos||[]).map(p=>'<figure><img src="'+esc(p.url)+'"><figcaption>'+esc(p.caption||'Vehicle photo')+'</figcaption></figure>').join('');
  }catch(e){console.warn('Photo gallery failed',e)}
}
async function updateTowDetails(){
  if(!selected)return;
  try{
    const impound_type=document.getElementById('vehicleImpoundType').value||null;
    const pickup=document.getElementById('vehiclePickupLocation').value.trim()||null;
    const oldId=selected.id;
    await api('/rest/v1/vehicles?id=eq.'+encodeURIComponent(oldId),{
      method:'PATCH',
      headers:{'Content-Type':'application/json',Prefer:'return=representation'},
      body:JSON.stringify({impound_type,yard_location:pickup})
    });
    await load();
    detail(oldId);
    alert('Tow details updated.');
  }catch(e){
    alert('Tow details update failed: '+e.message);
  }
}

async function updateVehicleStatus(){
  if(!selected)return;
  try{
    const newStatus=document.getElementById('vehicleStatus').value;
    await api('/rest/v1/vehicles?id=eq.'+encodeURIComponent(selected.id),{
      method:'PATCH',
      headers:{'Content-Type':'application/json',Prefer:'return=representation'},
      body:JSON.stringify({status:newStatus})
    });
    await load();
    selected=vehicles.find(v=>v.id===selected.id);
    detail(selected.id);
    alert('Vehicle status updated to '+newStatus+'.');
  }catch(e){
    alert('Status update failed: '+e.message);
  }
}

async function deleteVehicle(){
  if(!selected)return;
  const vehicleName=title(selected);
  const ok=confirm('Permanently delete '+vehicleName+' from TowTag?\n\nThis removes the vehicle record and its photos. This cannot be undone.');
  if(!ok)return;
  try{
    const photos=await api('/rest/v1/vehicle_photos?select=storage_path&vehicle_id=eq.'+encodeURIComponent(selected.id));
    for(const p of (photos||[])){
      if(!p.storage_path)continue;
      try{
        await api('/storage/v1/object/vehicle-photos/'+p.storage_path.split('/').map(encodeURIComponent).join('/'),{method:'DELETE'});
      }catch(err){
        console.warn('Photo cleanup failed for',p.storage_path,err);
      }
    }
    await api('/rest/v1/vehicles?id=eq.'+encodeURIComponent(selected.id),{
      method:'DELETE',
      headers:{Prefer:'return=minimal'}
    });
    selected=null;
    await load();
    home();
    alert('Vehicle deleted permanently.');
  }catch(e){
    alert('Delete failed: '+e.message);
  }
}

async function uploadPhotos(fileList){
  if(!selected)return;
  const files=Array.from(fileList||[]);
  if(!files.length)return;
  try{
    for(let i=0;i<files.length;i++){
      const file=files[i];
      let ext=(file.name&&file.name.includes('.')?file.name.split('.').pop():'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');
      if(!ext)ext='jpg';
      const path=selected.id+'/'+Date.now()+'-'+i+'-'+Math.random().toString(36).slice(2,8)+'.'+ext;
      await api('/storage/v1/object/vehicle-photos/'+path,{method:'POST',headers:{'Content-Type':file.type||'image/jpeg','x-upsert':'false'},body:file});
      const caption=(document.getElementById('photoCaption')?.value||'Vehicle photo');
      await api('/rest/v1/vehicle_photos',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},
        body:JSON.stringify({vehicle_id:selected.id,storage_path:path,caption,created_by:user.id})});
    }
    await loadStaffPhotos(selected.qr_token); await loadActivity(selected.id);
    alert(files.length===1?'Photo added to TowTag.':files.length+' photos added to TowTag.');
  }catch(e){alert('Photo upload failed: '+e.message)}
}

async function shareTag(){
  const url=SITE+'?tag='+encodeURIComponent(selected.qr_token);
  if(navigator.share)await navigator.share({title:'TowTag '+title(selected),url});
  else{await navigator.clipboard.writeText(url);alert('TowTag link copied.')}
}
function logout(){saveSession(null);loginScreen()}

async function publicView(token){
  app.innerHTML='<div class="brand">Mike’s Cascade</div><div class="site-name"><span>TOWING YARD</span> · Powered by TowTag</div><div class="card muted">Loading vehicle record…</div>';
  try{
    const r=await fetch(BASE+'/functions/v1/towtag-public-vehicle?token='+encodeURIComponent(token),{headers:{apikey:KEY}});
    const d=await r.json(); if(!r.ok)throw new Error(d.error||'TowTag not found');
    const veh=[d.vehicle?.year,d.vehicle?.make,d.vehicle?.model].filter(Boolean).join(' ')||'Vehicle';
    const photos=(d.photos||[]).map(p=>'<figure><img src="'+esc(p.url)+'"><figcaption>'+esc(p.caption||'Vehicle photo')+'</figcaption></figure>').join('');
    app.innerHTML='<div class="brand">Mike’s Cascade</div><div class="site-name"><span>TOWING YARD</span> · Powered by TowTag</div><div class="card"><div class="small muted">VEHICLE RECORD</div><div class="h1">'+esc(veh)+
    '</div><div class="muted">'+esc(d.vehicle?.color||'Color not listed')+'</div><div style="margin-top:12px"><span class="pill">'+esc(d.status||'')+
    '</span></div><div class="kv" style="margin-top:14px"><div><span>Brought in</span>'+esc(new Date(d.towDate).toLocaleString())+
    '</div><div><span>Agency</span>'+esc(d.agency||'—')+'</div><div><span>Plate</span>'+esc(d.plate?.number||'—')+' '+esc(d.plate?.state||'')+
    '</div><div><span>Impound type</span>'+esc(impoundLabel(d.impoundType))+'</div><div style="grid-column:1/-1"><span>Picked up from</span>'+esc(d.pickupLocation||d.yardLocation||'—')+'</div></div></div>'+
    (photos?'<div class="card"><div class="small muted">PHOTOS</div><div class="photos" style="margin-top:12px">'+photos+'</div></div>':'');
  }catch(e){
    app.innerHTML='<div class="brand">Mike’s Cascade</div><div class="site-name"><span>TOWING YARD</span> · Powered by TowTag</div><div class="error">'+esc(e.message)+'</div>';
  }
}

const tag=new URLSearchParams(location.search).get('tag');
if(tag){publicView(tag)}
else{
  try{
    session=JSON.parse(localStorage.getItem('towtag_session')||'null');
    if(session){user=session.user;boot()}else loginScreen()
  }catch{loginScreen()}
}
</script></body></html>
