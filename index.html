<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mike’s Cascade Towing Yard">
<meta name="theme-color" content="#0b0d10">
<title>Mike’s Cascade Towing Yard</title>
<style>
:root{color-scheme:dark;--bg:#0b0d10;--card:#15191f;--line:#29313a;--text:#f5f7fa;--muted:#98a3ae;--green:#76ff03}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}.wrap{max-width:760px;margin:auto;min-height:100vh;padding:max(18px,env(safe-area-inset-top)) 16px max(32px,env(safe-area-inset-bottom))}
.brand{font-size:32px;font-weight:900;letter-spacing:-.7px}.brand b{color:var(--green)}.site-name{font-size:14px;font-weight:800;letter-spacing:.2px;margin-top:3px}.site-name span{color:var(--green)}.muted{color:var(--muted)}.small{font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
.input{width:100%;background:#101419;border:1px solid var(--line);border-radius:12px;padding:13px;color:#fff;margin:5px 0 10px;font-size:16px}
.btn{border:0;border-radius:13px;padding:14px 15px;font-weight:800;background:var(--green);color:#071003;width:100%;margin-top:8px}
.btn.secondary{background:transparent;border:1px solid #3a4652;color:#dce3e9}.btn.danger{background:#351416;border:1px solid #7d2d35;color:#ffb8bf}.row{display:flex;gap:10px}.row>*{flex:1}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.link{color:#8dff3f;background:none;border:0;font-weight:750;padding:8px 0}
.vehicle{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;color:#fff;margin:10px 0}
.vehicle h3{margin:0 0 5px}.pill{display:inline-block;padding:6px 9px;border-radius:999px;background:#20320f;color:#baff83;font-size:12px;font-weight:800;text-transform:capitalize}
.error{padding:12px;border-radius:12px;background:#271417;border:1px solid #5a272e;color:#ffb7bf;margin:10px 0}
.notice{padding:12px;border-radius:12px;background:#151c12;border:1px solid #30431e;color:#cfffaa;margin:10px 0}
.h1{font-size:28px;font-weight:850;margin:14px 0 2px}.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kv div{background:#101419;border-radius:12px;padding:12px}.kv span{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}
.qr{background:#fff;border-radius:16px;padding:14px;width:min(100%,320px);display:block;margin:14px auto}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:12px}.photos figure{margin:0;background:#101419;border-radius:14px;overflow:hidden}.photos img{width:100%;display:block;aspect-ratio:4/3;object-fit:cover}.photos figcaption{padding:9px 10px;color:#aab3bd;font-size:12px}

.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 12px}.choice{border:1px solid #3a4652;background:#101419;color:#dce3e9;border-radius:12px;padding:12px 8px;font-weight:800}.choice.active{border-color:var(--green);background:#20320f;color:#cfffaa}.toggle-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.toggle{display:flex;align-items:center;gap:10px;background:#101419;border:1px solid var(--line);border-radius:12px;padding:12px;margin:6px 0}.toggle input{width:22px;height:22px;accent-color:var(--green)}details.card summary{cursor:pointer;font-weight:800;color:#dce3e9;padding:2px 0}.filters .choice{font-size:12px;padding:10px 4px}.photo-choices .choice{font-size:12px}
@media(max-width:560px){.row{flex-direction:column}.kv,.photos{grid-template-columns:1fr}.choice-grid.filters{grid-template-columns:repeat(4,1fr)!important}.toggle-grid{grid-template-columns:1fr 1fr}}

</style>
</head>
<body><main class="wrap"><div id="app"></div></main>
<script>
const BASE='https://ckonxzprnxqlefxscudt.supabase.co';
const KEY='sb_publishable_fQ-Cv2dhMlib6_16oh-WiQ_Ku96PhPp';
const SITE='https://damionv010-beep.github.io/';
let session=null,user=null,vehicles=[],selected=null;
const app=document.getElementById('app');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function saveSession(s){
  session=s;
  if(s){
    session.expires_at=Math.floor(Date.now()/1000)+(s.expires_in||3600);
    localStorage.setItem('towtag_session',JSON.stringify(session));
    user=s.user;
  }else{
    localStorage.removeItem('towtag_session'); user=null;
  }
}
async function ensureSession(){
  if(!session)return false;
  if((session.expires_at||0)>Math.floor(Date.now()/1000)+90)return true;
  if(!session.refresh_token){logout();return false}
  const r=await fetch(BASE+'/auth/v1/token?grant_type=refresh_token',{
    method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},
    body:JSON.stringify({refresh_token:session.refresh_token})
  });
  if(!r.ok){logout();return false}
  saveSession(await r.json()); return true;
}
async function api(path,opt={}){
  if(!await ensureSession())throw new Error('Sign in required');
  const r=await fetch(BASE+path,{...opt,headers:{apikey:KEY,Authorization:'Bearer '+session.access_token,...(opt.headers||{})}});
  const t=await r.text(); let d=null; try{d=t?JSON.parse(t):null}catch{d=t}
  if(!r.ok)throw new Error((d&&d.message)||(d&&d.error)||('Request failed '+r.status));
  return d;
}
function loginScreen(msg=''){
  app.innerHTML='<div style="padding-top:10vh"><div class="brand">Mike’s Cascade</div><div class="site-name"><span>TOWING YARD</span> · Powered by TowTag</div><p class="muted">Vehicle impound records + QR tags</p>'+msg+
  '<div class="card"><label class="small muted">Email</label><input id="email" class="input" type="email" autocomplete="email" autocapitalize="none">'+
  '<label class="small muted">Password</label><input id="pw" class="input" type="password" autocomplete="current-password">'+
  '<button class="btn" onclick="login()">Sign In</button><button class="btn secondary" onclick="signup()">Create Account</button></div></div>';
}
async function login(){
  try{
    const r=await fetch(BASE+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},
      body:JSON.stringify({email:email.value.trim(),password:pw.value})});
    const d=await r.json(); if(!r.ok)throw new Error(d.error_description||d.msg||d.message||'Sign in failed');
    saveSession(d); await boot();
  }catch(e){loginScreen('<div class="error">'+esc(e.message)+'</div>')}
}
async function signup(){
  try{
    const r=await fetch(BASE+'/auth/v1/signup',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},
      body:JSON.stringify({email:email.value.trim(),password:pw.value})});
    const d=await r.json(); if(!r.ok)throw new Error(d.msg||d.message||'Sign up failed');
    if(d.access_token){saveSession(d);await boot()}
    else loginScreen('<div class="notice">Account created. Check your email, confirm it, then come back and sign in.</div>');
  }catch(e){loginScreen('<div class="error">'+esc(e.message)+'</div>')}
}
async function boot(){
  try{
    user=await api('/auth/v1/user');
    const m=await api('/rest/v1/staff_members?select=user_id,role,active&user_id=eq.'+encodeURIComponent(user.id));
    if(!m.length){setupScreen();return}
    await load(); home();
  }catch(e){loginScreen('<div class="error">'+esc(e.message)+'</div>')}
}
function setupScreen(){
  app.innerHTML='<div style="padding-top:8vh"><div class="brand">Mike’s Cascade</div><div class="site-name"><span>TOWING YARD</span> · Powered by TowTag</div><div class="card"><h2>Finish first-time setup</h2>'+
  '<p class="muted">Enter the one-time TowTag setup code from ChatGPT. This only creates the first administrator.</p>'+
  '<input id="setupCode" class="input" placeholder="Setup code" autocapitalize="characters">'+
  '<button class="btn" onclick="claimAdmin()">Activate TowTag Admin</button><button class="btn secondary" onclick="logout()">Sign Out</button></div></div>';
}
async function claimAdmin(){
  try{
    const r=await fetch(BASE+'/functions/v1/towtag-bootstrap',{method:'POST',
      headers:{apikey:KEY,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},
      body:JSON.stringify({setupCode:setupCode.value.trim().toUpperCase()})});
    const d=await r.json(); if(!r.ok)throw new Error(d.error||'Setup failed');
    await load(); home();
  }catch(e){alert(e.message)}
}
async function load(){vehicles=await api('/rest/v1/vehicles?select=*&order=tow_date.desc')||[]}
const title=v=>[v.year,v.make,v.model].filter(Boolean).join(' ')||'Vehicle';
function localDateTimeValue(value){
  if(!value)return '';
  const d=new Date(value);
  if(Number.isNaN(d.getTime()))return '';
  const pad=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());
}
const impoundLabel=v=>({
  police_impound:'Police Impound',
  motor_vehicle_accident:'Motor Vehicle Accident',
  preference_motor_vehicle_accident:'Preference Motor Vehicle Accident',
  private_party_impound:'Private Party Impound'
}[v]||'Not specified');
const keysLabel=v=>({received:'Keys Received',no_keys:'No Keys',unknown:'Unknown'}[v]||'Not specified');
const holdLabel=v=>({none:'No Hold',police_hold:'Police Hold',insurance_hold:'Insurance Hold',owner_hold:'Owner Hold',other:'Other Hold'}[v]||'No Hold');
const fmtOdo=v=>v===null||v===undefined||v===''?'—':Number(v).toLocaleString()+' mi';

let homeFilter='all';
const el=id=>document.getElementById(id);
const val=id=>(el(id)?.value||'').trim();
const checked=id=>!!el(id)?.checked;
const pref=(key,fallback='')=>localStorage.getItem('towtag_'+key)||fallback;
const money=v=>v===null||v===undefined||v===''?'—':'$'+Number(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const recordLabel=v=>v==='company_owned'?'Company Owned':'Tow / Impound';
const ownedLabel=v=>({for_sale:'For Sale',scrap:'Going to Scrap',sold:'Sold',scrapped:'Scrapped'}[v]||'Not specified');
const equipmentLabel=v=>({wheel_lift:'Wheel Lift',wrecker:'Wrecker',medium_duty:'Medium Duty',flat_bed:'Flat Bed'}[v]||'Not specified');
const yesNo=v=>v?'Yes':'No';

function statusOptions(current){
  return (current==='auction'?'<option value="auction" selected>Legacy Auction</option>':'')+
  '<option value="impounded" '+(current==='impounded'?'selected':'')+'>Impounded</option>'+
  '<option value="hold" '+(current==='hold'?'selected':'')+'>Hold</option>'+
  '<option value="released" '+(current==='released'?'selected':'')+'>Released</option>'+
  '<option value="other" '+(current==='other'?'selected':'')+'>Other</option>';
}
function setHomeFilter(mode,btn){
  homeFilter=mode;
  document.querySelectorAll('[data-filter]').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  render(val('search'));
}
function pickChoice(id,value,btn){
  const target=el(id); if(target)target.value=value;
  const group=btn?.closest('.choice-grid');
  if(group)group.querySelectorAll('.choice').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  if(id==='recordType')toggleIntakeType();
  if(id==='ownedDisposition')toggleOwnedPrice();
}
function toggleIntakeType(){
  const owned=val('recordType')==='company_owned';
  if(el('towIntake'))el('towIntake').style.display=owned?'none':'block';
  if(el('ownedIntake'))el('ownedIntake').style.display=owned?'block':'none';
}
function toggleOwnedPrice(){
  if(!el('askingPriceWrap'))return;
  el('askingPriceWrap').style.display=val('ownedDisposition')==='for_sale'?'block':'none';
}
function toggleEditType(){
  const owned=val('editRecordType')==='company_owned';
  if(el('editTowSection'))el('editTowSection').style.display=owned?'none':'block';
  if(el('editOwnedSection'))el('editOwnedSection').style.display=owned?'block':'none';
  if(el('editStatusWrap'))el('editStatusWrap').style.display=owned?'none':'block';
}
async function fillAgencySuggestions(){
  const list=el('agencyList'); if(!list)return;
  try{
    const rows=await api('/rest/v1/agencies?select=name&order=name');
    list.innerHTML=(rows||[]).map(a=>'<option value="'+esc(a.name)+'"></option>').join('');
  }catch(e){console.warn('Agency suggestions failed',e)}
}
async function resolveAgency(name){
  name=(name||'').trim(); if(!name)return null;
  let rows=await api('/rest/v1/agencies?select=id,name&name=ilike.'+encodeURIComponent(name));
  if(rows.length)return rows[0].id;
  rows=await api('/rest/v1/agencies',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify({name})});
  return rows[0].id;
}
function billingHasData(v){
  return !!(v.equipment_type||v.used_dollies||v.recovery_performed||v.winching_performed||v.cleanup_performed||v.hazmat_cleanup||v.extra_labor||v.after_hours||v.scene_wait_minutes||v.billable_miles||v.other_billable_work||v.billing_notes);
}
function billingCard(v){
  if(v.record_type==='company_owned')return '';
  return '<div class="card"><div class="small muted">EQUIPMENT & BILLING</div><div class="kv" style="margin-top:10px">'+
    '<div><span>Truck / equipment</span>'+esc(equipmentLabel(v.equipment_type))+'</div><div><span>Dollies</span>'+yesNo(v.used_dollies)+'</div>'+
    '<div><span>Recovery</span>'+(v.recovery_performed?'Yes'+(v.recovery_minutes!=null?' · '+esc(v.recovery_minutes)+' min':''):'No')+'</div><div><span>Winching</span>'+yesNo(v.winching_performed)+'</div>'+
    '<div><span>Cleanup</span>'+yesNo(v.cleanup_performed)+'</div><div><span>Hazmat / absorbent</span>'+yesNo(v.hazmat_cleanup)+'</div>'+
    '<div><span>Extra labor</span>'+(v.extra_labor?'Yes'+(v.extra_labor_minutes!=null?' · '+esc(v.extra_labor_minutes)+' min':''):'No')+'</div><div><span>After hours</span>'+yesNo(v.after_hours)+'</div>'+
    '<div><span>Scene wait</span>'+(v.scene_wait_minutes!=null?esc(v.scene_wait_minutes)+' min':'—')+'</div><div><span>Billable miles</span>'+(v.billable_miles!=null?esc(v.billable_miles)+' mi':'—')+'</div>'+
    '<div style="grid-column:1/-1"><span>Other billable work</span>'+esc(v.other_billable_work||'—')+'</div><div style="grid-column:1/-1"><span>Billing notes</span>'+esc(v.billing_notes||'—')+'</div></div></div>';
}

function home(){
  selected=null;
  const towCount=vehicles.filter(v=>(v.record_type||'tow')!=='company_owned').length;
  const saleCount=vehicles.filter(v=>v.record_type==='company_owned'&&v.owned_disposition==='for_sale').length;
  const scrapCount=vehicles.filter(v=>v.record_type==='company_owned'&&v.owned_disposition==='scrap').length;
  app.innerHTML='<div class="top"><div><div class="brand">Mike’s Cascade</div><div class="site-name"><span>TOWING YARD</span> · Powered by TowTag</div><div class="muted small">'+vehicles.length+' total · '+towCount+' tow yard · '+saleCount+' for sale · '+scrapCount+' scrap</div></div><button class="link" onclick="logout()">Sign Out</button></div>'+
  '<div class="row" style="margin-top:12px"><button class="btn" onclick="addForm()">+ Quick Intake</button><button class="btn secondary" onclick="alert(\'Use the iPhone Camera app to scan a TowTag QR code.\')">Scan TowTag</button></div>'+
  '<div class="choice-grid filters" style="grid-template-columns:repeat(4,1fr);margin-top:12px"><button class="choice active" data-filter onclick="setHomeFilter(\'all\',this)">All</button><button class="choice" data-filter onclick="setHomeFilter(\'tow\',this)">Tows</button><button class="choice" data-filter onclick="setHomeFilter(\'sale\',this)">For Sale</button><button class="choice" data-filter onclick="setHomeFilter(\'scrap\',this)">Scrap</button></div>'+
  '<input id="search" class="input" placeholder="Search plate, VIN, tow #, driver..." oninput="render(this.value)"><div id="list"></div>';
  homeFilter='all'; render('');
}
function render(q){
  q=(q||'').toLowerCase();
  let rows=vehicles.filter(v=>JSON.stringify([v.year,v.make,v.model,v.color,v.plate,v.vin,v.yard_location,v.impound_type,v.tow_number,v.driver_name,v.record_type,v.owned_disposition,v.equipment_type,v.other_billable_work]).toLowerCase().includes(q));
  if(homeFilter==='tow')rows=rows.filter(v=>(v.record_type||'tow')!=='company_owned');
  if(homeFilter==='sale')rows=rows.filter(v=>v.record_type==='company_owned'&&v.owned_disposition==='for_sale');
  if(homeFilter==='scrap')rows=rows.filter(v=>v.record_type==='company_owned'&&v.owned_disposition==='scrap');
  el('list').innerHTML=rows.map(v=>{
    const owned=v.record_type==='company_owned';
    const badge=owned?ownedLabel(v.owned_disposition):v.status;
    const extra=owned&&v.owned_disposition==='for_sale'&&v.asking_price!=null?' · '+money(v.asking_price):'';
    return '<button class="vehicle" onclick="detail(\''+v.id+'\')"><h3>'+esc(title(v))+'</h3><div class="muted">'+esc(v.color||'No color')+' · '+esc(v.plate||'No plate')+extra+'</div><div class="small muted" style="margin-top:7px">'+esc(recordLabel(v.record_type||'tow'))+' · <span class="pill">'+esc(badge)+'</span></div></button>';
  }).join('')||'<div class="card muted">No matching vehicles.</div>';
}

function addForm(notice=''){
  const lastState=pref('state','OR'), lastDriver=pref('driver',''), lastAgency=pref('agency',''), lastEquipment=pref('equipment','wheel_lift');
  app.innerHTML='<button class="link" onclick="home()">‹ Back</button><div class="h1">Quick Intake</div><p class="muted">Get the vehicle into TowTag now. Finish the less-important details later.</p>'+
  (notice?'<div class="notice">'+esc(notice)+'</div>':'')+
  '<div class="card"><div class="small muted">WHAT ARE WE ADDING?</div><input id="recordType" type="hidden" value="tow"><div class="choice-grid"><button class="choice active" onclick="pickChoice(\'recordType\',\'tow\',this)">Tow / Impound</button><button class="choice" onclick="pickChoice(\'recordType\',\'company_owned\',this)">Company Owned</button></div></div>'+
  '<div class="card"><div class="small muted">VEHICLE</div><div class="row"><input id="year" class="input" inputmode="numeric" placeholder="Year"><input id="color" class="input" placeholder="Color"></div><input id="make" class="input" placeholder="Make"><input id="model" class="input" placeholder="Model">'+
  '<div class="row"><input id="plate" class="input" placeholder="Plate" autocapitalize="characters" oninput="this.value=this.value.toUpperCase()"><input id="state" class="input" value="'+esc(lastState)+'" placeholder="State" maxlength="2" autocapitalize="characters" oninput="this.value=this.value.toUpperCase()"></div>'+
  '<input id="vin" class="input" placeholder="VIN" maxlength="17" autocapitalize="characters" oninput="this.value=this.value.toUpperCase().replace(/[^A-HJ-NPR-Z0-9]/g,\'\')"><div class="row"><input id="odometer" class="input" inputmode="numeric" placeholder="Odometer"><div></div></div>'+ 
  '<div class="small muted">KEYS</div><input id="keysStatus" type="hidden" value="unknown"><div class="choice-grid" style="grid-template-columns:repeat(3,1fr)"><button class="choice" onclick="pickChoice(\'keysStatus\',\'received\',this)">Keys ✓</button><button class="choice" onclick="pickChoice(\'keysStatus\',\'no_keys\',this)">No Keys</button><button class="choice active" onclick="pickChoice(\'keysStatus\',\'unknown\',this)">Unknown</button></div></div>'+
  '<div id="towIntake">'+
    '<div class="card"><div class="small muted">TOW / IMPOUND</div><div class="row"><input id="towNumber" class="input" placeholder="Tow / case #" autocapitalize="characters" oninput="this.value=this.value.toUpperCase()"><input id="driverName" class="input" placeholder="Driver" value="'+esc(lastDriver)+'"></div>'+
    '<input id="agency" class="input" list="agencyList" placeholder="Agency" value="'+esc(lastAgency)+'"><datalist id="agencyList"></datalist><input id="pickup" class="input" placeholder="Picked up from">'+
    '<div class="small muted">IMPOUND TYPE</div><input id="impoundType" type="hidden" value=""><div class="choice-grid"><button class="choice" onclick="pickChoice(\'impoundType\',\'police_impound\',this)">Police Impound</button><button class="choice" onclick="pickChoice(\'impoundType\',\'motor_vehicle_accident\',this)">MVA</button><button class="choice" onclick="pickChoice(\'impoundType\',\'preference_motor_vehicle_accident\',this)">Preference MVA</button><button class="choice" onclick="pickChoice(\'impoundType\',\'private_party_impound\',this)">Private Party</button></div>'+ 
    '<div class="small muted">TRUCK / EQUIPMENT</div><select id="equipmentType" class="input"><option value="wheel_lift" '+(lastEquipment==='wheel_lift'?'selected':'')+'>Wheel Lift</option><option value="wrecker" '+(lastEquipment==='wrecker'?'selected':'')+'>Wrecker</option><option value="medium_duty" '+(lastEquipment==='medium_duty'?'selected':'')+'>Medium Duty</option><option value="flat_bed" '+(lastEquipment==='flat_bed'?'selected':'')+'>Flat Bed</option></select></div>'+ 
    '<details class="card"><summary>Billing / recovery details</summary><div style="margin-top:12px" class="toggle-grid"><label class="toggle"><input id="usedDollies" type="checkbox"> Dollies</label><label class="toggle"><input id="recoveryPerformed" type="checkbox"> Recovery</label><label class="toggle"><input id="winchingPerformed" type="checkbox"> Winching</label><label class="toggle"><input id="cleanupPerformed" type="checkbox"> Cleanup</label><label class="toggle"><input id="hazmatCleanup" type="checkbox"> Hazmat / absorbent</label><label class="toggle"><input id="extraLabor" type="checkbox"> Extra labor</label><label class="toggle"><input id="afterHours" type="checkbox"> After hours</label></div>'+ 
    '<div class="row"><input id="recoveryMinutes" class="input" inputmode="numeric" placeholder="Recovery minutes"><input id="extraLaborMinutes" class="input" inputmode="numeric" placeholder="Extra labor minutes"></div><div class="row"><input id="sceneWaitMinutes" class="input" inputmode="numeric" placeholder="Scene wait minutes"><input id="billableMiles" class="input" inputmode="decimal" placeholder="Billable miles"></div><textarea id="otherBillableWork" class="input" rows="2" placeholder="Other billable work"></textarea><textarea id="billingNotes" class="input" rows="2" placeholder="Billing notes"></textarea></details>'+

async function saveVehicle(mode='open'){
  try{
    const record_type=val('recordType')||'tow';
    const vinValue=val('vin').toUpperCase();
    if(vinValue&&vinValue.length!==17&&!confirm('VIN is '+vinValue.length+' characters, not 17. Save it as entered?'))return;
    let agency_id=null, impound_type=null, owned_disposition=null;
    if(record_type==='tow'){
      impound_type=val('impoundType');
      if(!impound_type){alert('Choose an impound type.');return}
      agency_id=await resolveAgency(val('agency'));
    }else{
      owned_disposition=val('ownedDisposition');
      if(!owned_disposition){alert('Choose For Sale or Going to Scrap.');return}
    }
    const odo=val('odometer');
    const recoveryMinutes=val('recoveryMinutes'), extraLaborMinutes=val('extraLaborMinutes'), waitMinutes=val('sceneWaitMinutes'), miles=val('billableMiles'), ask=val('askingPrice');
    const hold_type=record_type==='tow'?(val('holdType')||'none'):'none';
    const body={
      record_type,year:val('year')?Number(val('year')):null,make:val('make')||null,model:val('model')||null,color:val('color')||null,plate:val('plate').toUpperCase()||null,plate_state:val('state').toUpperCase()||null,vin:vinValue||null,odometer:odo?Number(odo):null,keys_status:val('keysStatus')||'unknown',
      agency_id,impound_type,yard_location:record_type==='tow'?(val('pickup')||null):null,tow_number:record_type==='tow'?(val('towNumber').toUpperCase()||null):null,driver_name:record_type==='tow'?(val('driverName')||null):null,hold_type,hold_notes:record_type==='tow'?(val('holdNotes')||null):null,
      status:record_type==='tow'?(hold_type!=='none'?'hold':'impounded'):'other',condition_notes:val('conditionNotes')||null,property_notes:val('propertyNotes')||null,notes:val('notes')||null,created_by:user.id,
      owned_disposition,asking_price:record_type==='company_owned'&&ask?Number(ask):null,owned_notes:record_type==='company_owned'?(val('ownedNotes')||null):null,
      equipment_type:record_type==='tow'?(val('equipmentType')||null):null,used_dollies:record_type==='tow'&&checked('usedDollies'),recovery_performed:record_type==='tow'&&(checked('recoveryPerformed')||!!recoveryMinutes),recovery_minutes:record_type==='tow'&&recoveryMinutes?Number(recoveryMinutes):null,winching_performed:record_type==='tow'&&checked('winchingPerformed'),cleanup_performed:record_type==='tow'&&(checked('cleanupPerformed')||checked('hazmatCleanup')),hazmat_cleanup:record_type==='tow'&&checked('hazmatCleanup'),extra_labor:record_type==='tow'&&(checked('extraLabor')||!!extraLaborMinutes),extra_labor_minutes:record_type==='tow'&&extraLaborMinutes?Number(extraLaborMinutes):null,after_hours:record_type==='tow'&&checked('afterHours'),scene_wait_minutes:record_type==='tow'&&waitMinutes?Number(waitMinutes):null,billable_miles:record_type==='tow'&&miles?Number(miles):null,other_billable_work:record_type==='tow'?(val('otherBillableWork')||null):null,billing_notes:record_type==='tow'?(val('billingNotes')||null):null
    };
    if(record_type==='tow'){
      localStorage.setItem('towtag_state',val('state').toUpperCase()||'OR');
      if(val('driverName'))localStorage.setItem('towtag_driver',val('driverName'));
      if(val('agency'))localStorage.setItem('towtag_agency',val('agency'));
      if(val('equipmentType'))localStorage.setItem('towtag_equipment',val('equipmentType'));
    }
    const rows=await api('/rest/v1/vehicles',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify(body)});

      const disp=val('editOwnedDisposition')||'for_sale';
      Object.assign(body,{agency_id:null,impound_type:null,yard_location:null,tow_number:null,driver_name:null,hold_type:'none',hold_notes:null,status:'other',owned_disposition:disp,asking_price:num('editAskingPrice'),disposition_amount:num('editDispositionAmount'),owned_notes:val('editOwnedNotes')||null,equipment_type:null,used_dollies:false,recovery_performed:false,recovery_minutes:null,winching_performed:false,cleanup_performed:false,hazmat_cleanup:false,extra_labor:false,extra_labor_minutes:null,after_hours:false,scene_wait_minutes:null,billable_miles:null,other_billable_work:null,billing_notes:null});
      if((disp==='sold'||disp==='scrapped')&&!selected.disposition_completed_at)body.disposition_completed_at=new Date().toISOString();
      if(disp==='for_sale'||disp==='scrap')body.disposition_completed_at=null;
    }
    if(selected.release_at&&record_type==='tow'){body.released_to=val('editReleasedTo')||null;body.release_authorized_by=val('editReleaseAuthorized')||null;body.release_id_checked=checked('editReleaseIdChecked');body.release_notes=val('editReleaseNotes')||null;}
    await api('/rest/v1/vehicles?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify(body)});
    await load(); detail(id); alert('Vehicle updated.');
  }catch(e){alert('Vehicle update failed: '+e.message)}
}

async function completeOwnedDisposition(kind){
  if(!selected||selected.record_type!=='company_owned')return;
  const label=kind==='sold'?'sale price':'scrap amount';
  const input=prompt('Enter '+label+' (optional). Leave blank if you do not want to record an amount.','');
  if(input===null)return;
  const amount=input.trim()===''?null:Number(input.replace(/[$,]/g,''));
  if(input.trim()!==''&&!Number.isFinite(amount)){alert('Enter a valid amount.');return}
  try{
    const id=selected.id;
    await api('/rest/v1/vehicles?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify({owned_disposition:kind,disposition_amount:amount,disposition_completed_at:new Date().toISOString()})});
    await load(); detail(id); alert(kind==='sold'?'Vehicle marked sold.':'Vehicle marked scrapped.');
  }catch(e){alert('Update failed: '+e.message)}
}

async function releaseVehicle(){
  if(!selected)return;
  const name=val('releasedTo'); if(!name){alert('Enter who the vehicle is being released to.');return}
  const id=selected.id;
  try{
    const body={status:'released',release_at:new Date().toISOString(),released_to:name,release_id_checked:checked('releaseIdChecked'),release_authorized_by:val('releaseAuthorized')||null,release_notes:val('releaseNotes')||null};
    await api('/rest/v1/vehicles?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify(body)});
    await load(); detail(id); alert('Vehicle released and recorded.');
  }catch(e){alert('Release failed: '+e.message)}
}

async function loadActivity(id){
  const target=el('activity'); if(!target)return;
  try{
    const rows=await api('/rest/v1/vehicle_activity?select=event_type,description,created_at&vehicle_id=eq.'+encodeURIComponent(id)+'&order=created_at.desc&limit=50');
    target.innerHTML=(rows||[]).map(r=>'<div style="padding:10px 0;border-bottom:1px solid var(--line)"><div>'+esc(r.description)+'</div><div class="small muted" style="margin-top:3px">'+esc(new Date(r.created_at).toLocaleString())+'</div></div>').join('')||'<div class="muted">No activity recorded yet.</div>';
  }catch(e){target.innerHTML='<div class="error">History failed to load: '+esc(e.message)+'</div>'}
}
async function loadStaffPhotos(token){
  const target=el('staffPhotos'); if(!target)return;
  try{
    const r=await fetch(BASE+'/functions/v1/towtag-public-vehicle?token='+encodeURIComponent(token),{headers:{apikey:KEY}});const d=await r.json();if(!r.ok)throw new Error(d.error||'Photo lookup failed');
    target.innerHTML=(d.photos||[]).map(p=>'<figure><img src="'+esc(p.url)+'"><figcaption>'+esc(p.caption||'Vehicle photo')+'</figcaption></figure>').join('');
  }catch(e){console.warn('Photo gallery failed',e)}
}
async function updateVehicleStatus(){
  if(!selected)return;
  try{
    const id=selected.id,newStatus=val('vehicleStatus');
    await api('/rest/v1/vehicles?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify({status:newStatus})});
    await load(); detail(id); alert('Vehicle status updated.');
  }catch(e){alert('Status update failed: '+e.message)}
}
async function deleteVehicle(){
  if(!selected)return;
  const vehicleName=title(selected); if(!confirm('Permanently delete '+vehicleName+' from TowTag?\n\nThis removes the vehicle record and its photos. This cannot be undone.'))return;
  try{
    const photos=await api('/rest/v1/vehicle_photos?select=storage_path&vehicle_id=eq.'+encodeURIComponent(selected.id));
    for(const p of (photos||[])){if(!p.storage_path)continue;try{await api('/storage/v1/object/vehicle-photos/'+p.storage_path.split('/').map(encodeURIComponent).join('/'),{method:'DELETE'});}catch(err){console.warn('Photo cleanup failed for',p.storage_path,err)}}
    await api('/rest/v1/vehicles?id=eq.'+encodeURIComponent(selected.id),{method:'DELETE',headers:{Prefer:'return=minimal'}}); selected=null; await load(); home(); alert('Vehicle deleted permanently.');
  }catch(e){alert('Delete failed: '+e.message)}
}
function takeLabeledPhoto(label){
  if(el('photoCaption'))el('photoCaption').value=label;
  if(el('cameraPhoto')){el('cameraPhoto').value='';el('cameraPhoto').click()}
}
async function uploadPhotos(fileList){
  if(!selected)return;
  const files=Array.from(fileList||[]); if(!files.length)return;
  try{
    for(let i=0;i<files.length;i++){
      const file=files[i]; let ext=(file.name&&file.name.includes('.')?file.name.split('.').pop():'jpg').toLowerCase().replace(/[^a-z0-9]/g,''); if(!ext)ext='jpg';
      const path=selected.id+'/'+Date.now()+'-'+i+'-'+Math.random().toString(36).slice(2,8)+'.'+ext;
      const mime=file.type||({jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',webp:'image/webp',heic:'image/heic',heif:'image/heif'}[ext]||'application/octet-stream');
      await api('/storage/v1/object/vehicle-photos/'+path,{method:'POST',headers:{'Content-Type':mime,'x-upsert':'false'},body:file});
      const caption=el('photoCaption')?.value||'Vehicle photo';
      await api('/rest/v1/vehicle_photos',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({vehicle_id:selected.id,storage_path:path,caption,created_by:user.id})});
    }
    await loadStaffPhotos(selected.qr_token); await loadActivity(selected.id); alert(files.length===1?'Photo added to TowTag.':files.length+' photos added to TowTag.');
  }catch(e){alert('Photo upload failed: '+e.message)}
}
async function shareTag(){
  const url=SITE+'?tag='+encodeURIComponent(selected.qr_token);
  if(navigator.share)await navigator.share({title:'TowTag '+title(selected),url}); else{await navigator.clipboard.writeText(url);alert('TowTag link copied.')}
}
function logout(){saveSession(null);loginScreen()}


async function publicView(token){
  app.innerHTML='<div class="brand">Mike’s Cascade</div><div class="site-name"><span>TOWING YARD</span> · Powered by TowTag</div><div class="card muted">Loading vehicle record…</div>';
  try{
    const r=await fetch(BASE+'/functions/v1/towtag-public-vehicle?token='+encodeURIComponent(token),{headers:{apikey:KEY}});
    const d=await r.json(); if(!r.ok)throw new Error(d.error||'TowTag not found');
    const veh=[d.vehicle?.year,d.vehicle?.make,d.vehicle?.model].filter(Boolean).join(' ')||'Vehicle';
    const photos=(d.photos||[]).map(p=>'<figure><img src="'+esc(p.url)+'"><figcaption>'+esc(p.caption||'Vehicle photo')+'</figcaption></figure>').join('');
    const owned=d.recordType==='company_owned';
    const badge=owned?ownedLabel(d.ownedDisposition):(d.status||'');
    const info=owned?'<div class="kv" style="margin-top:14px"><div><span>Record type</span>Company Owned</div><div><span>Disposition</span>'+esc(ownedLabel(d.ownedDisposition))+'</div><div><span>Plate</span>'+esc(d.plate?.number||'—')+' '+esc(d.plate?.state||'')+'</div><div><span>Added</span>'+esc(new Date(d.towDate).toLocaleString())+'</div></div>':
      '<div class="kv" style="margin-top:14px"><div><span>Brought in</span>'+esc(new Date(d.towDate).toLocaleString())+'</div><div><span>Agency</span>'+esc(d.agency||'—')+'</div><div><span>Plate</span>'+esc(d.plate?.number||'—')+' '+esc(d.plate?.state||'')+'</div><div><span>Impound type</span>'+esc(impoundLabel(d.impoundType))+'</div><div style="grid-column:1/-1"><span>Picked up from</span>'+esc(d.pickupLocation||d.yardLocation||'—')+'</div></div>';
    app.innerHTML='<div class="brand">Mike’s Cascade</div><div class="site-name"><span>TOWING YARD</span> · Powered by TowTag</div><div class="card"><div class="small muted">VEHICLE RECORD</div><div class="h1">'+esc(veh)+
    '</div><div class="muted">'+esc(d.vehicle?.color||'Color not listed')+'</div><div style="margin-top:12px"><span class="pill">'+esc(badge)+'</span></div>'+info+'</div>'+ (photos?'<div class="card"><div class="small muted">PHOTOS</div><div class="photos" style="margin-top:12px">'+photos+'</div></div>':'');
  }catch(e){
    app.innerHTML='<div class="brand">Mike’s Cascade</div><div class="site-name"><span>TOWING YARD</span> · Powered by TowTag</div><div class="error">'+esc(e.message)+'</div>';
  }
}

const tag=new URLSearchParams(location.search).get('tag');
if(tag){publicView(tag)}
else{
  try{
    session=JSON.parse(localStorage.getItem('towtag_session')||'null');
    if(session){user=session.user;boot()}else loginScreen()
  }catch{loginScreen()}
}
</script></body></html>
